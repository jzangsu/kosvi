<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Travel Manager - Vietnam Integrated</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .ceo-card { background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%); color: white; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .excel-border { border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="bg-[#f1f5f9]">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE - Gemini 전용 기억 저장소]
         * ---------------------------------------------------------
         * 1. 사용자 정보: 허창수 법인장 (CEO, KOSVI Travel)
         * 2. 프로젝트: KOSVI 여행사 통합 관리 시스템 (v9.0 - 일정+견적 통합 뷰)
         * 3. 핵심 규칙:
         * - UI 개선: 엑셀처럼 일정과 견적을 한 화면(모달)에서 동시에 작업 가능하게 통합.
         * - 보안: CEO(admin - 일정+견적 동시 노출), Staff(staff - 일정 전용).
         * - 통화: 베트남 동 (VND) 기준.
         * - 기능: 캘린더, 예약 알림, 파일 업로드 시뮬레이션.
         * ---------------------------------------------------------
         */

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const KosviLogo = ({ className = "" }) => (
            <div className={`flex items-center gap-3 ${className}`}>
                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/40">
                    <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 20L80 80M80 20L20 80" stroke="white" strokeWidth="12" strokeLinecap="round"/>
                        <circle cx="50" cy="50" r="15" fill="#f8fafc" stroke="white" strokeWidth="4"/>
                    </svg>
                </div>
                <div className="flex flex-col text-left">
                    <span className="text-xl font-black text-slate-800 leading-none tracking-tighter">KOSVI</span>
                    <span className="text-[10px] font-extrabold text-blue-600 tracking-[0.25em] leading-tight uppercase text-nowrap">Travel & Logistics</span>
                </div>
            </div>
        );

        const INITIAL_TRIPS = [
            { 
                id: 1, 
                title: '임창호 님 호치민 3박 4일 패키지', 
                client: '임창호 님', 
                pax: 3, 
                date: '2026-01-13',
                endDate: '2026-01-16',
                flightIn: 'KE469 12:40 도착',
                flightOut: 'KE470 13:55 출발',
                exchangeRate: 5.5386, 
                status: '견적완료',
                bookingStatus: '확정',
                fileUploaded: true,
                itinerary: [
                    { day: 1, title: '호치민 입국 및 미팅', activities: ['공항 픽업', '호텔 체크인', '중식(신밧드케밥)'] },
                    { day: 2, title: '트윈도브스 골프 라운딩', activities: ['18홀 라운딩', '석식(한솔식당)', '마사지 90분'] },
                    { day: 3, title: '무이네 지프 투어', activities: ['새벽 지프투어', '화이트샌듄/레드샌듄', '해산물 식당'] }
                ],
                quoteItems: [
                    { name: 'S2 차량 지원 (6일분)', cost: 3354600, price: 6300000, qty: 6, unit: '회' },
                    { name: 'Twin Doves Golf (18홀)', cost: 6300000, price: 8500000, qty: 2, unit: '명' },
                    { name: 'Landmark Plus Hotel', cost: 10950000, price: 13687500, qty: 3, unit: '박' }
                ],
                staffNote: '골프장 예약 바우처 확인 완료.'
            },
            { 
                id: 2, 
                title: '대웅에스앤티 하노이 기업연수', 
                client: '대웅에스앤티', 
                pax: 12, 
                date: '2026-01-20',
                endDate: '2026-01-24',
                flightIn: 'VN441 10:15 도착',
                flightOut: 'VN440 23:30 출발',
                exchangeRate: 5.45, 
                status: '견적중',
                bookingStatus: '대기', 
                fileUploaded: false,
                itinerary: [
                    { day: 1, title: '하노이 도착 및 시내관광', activities: ['노이바이 공항 픽업', '호안끼엠 관광', '전통식 석식'] }
                ],
                quoteItems: [
                    { name: '45인승 대형 버스', cost: 4000000, price: 6000000, qty: 5, unit: '일' }
                ],
                staffNote: '배차 업체 확인 중입니다.'
            }
        ];

        const CalendarView = ({ trips, onTripClick }) => {
            const calendarDays = Array.from({ length: 31 }, (_, i) => i + 1);

            return (
                <div className="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm p-10 animate-fade-in overflow-hidden">
                    <div className="flex justify-between items-center mb-8 px-2">
                        <h3 className="text-2xl font-black text-slate-800 tracking-tighter italic">JANUARY 2026</h3>
                        <div className="flex gap-2">
                            <button className="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition-all"><Icon name="chevron-left" /></button>
                            <button className="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition-all"><Icon name="chevron-right" /></button>
                        </div>
                    </div>
                    <div className="calendar-grid border-t border-l border-slate-100 font-bold">
                        {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map((d, i) => (
                            <div key={d} className={`p-4 text-center text-[10px] uppercase tracking-[0.2em] border-r border-b border-slate-100 bg-slate-50/50 ${i === 0 ? 'text-red-400' : i === 6 ? 'text-blue-400' : 'text-slate-400'}`}>{d}</div>
                        ))}
                        {calendarDays.map(day => {
                            const dateStr = `2026-01-${day.toString().padStart(2, '0')}`;
                            const dayTrips = trips.filter(t => t.date === dateStr);
                            return (
                                <div key={day} className="min-h-[140px] p-2 border-r border-b border-slate-100 hover:bg-blue-50/20 transition-colors relative group">
                                    <span className="text-xs font-black text-slate-300 ml-1 group-hover:text-blue-500 transition-colors">{day}</span>
                                    <div className="mt-2 space-y-1">
                                        {dayTrips.map(t => (
                                            <div key={t.id} onClick={() => onTripClick(t)} className={`text-[10px] p-2 rounded-xl cursor-pointer truncate shadow-sm font-black transition-all hover:scale-105 ${t.bookingStatus === '확정' ? 'bg-blue-600 text-white' : 'bg-red-500 text-white animate-pulse'}`}>{t.client}</div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const MainApp = ({ userRole, onLogout }) => {
            const [viewMode, setViewMode] = useState('list'); 
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedTrip, setSelectedTrip] = useState(null);

            const alerts = useMemo(() => trips.filter(t => t.bookingStatus === '대기'), [trips]);
            const filteredTrips = trips.filter(trip => trip.client.includes(searchTerm));
            const formatVND = (val) => val.toLocaleString() + ' ₫';

            return (
                <div className="flex h-screen bg-[#f1f5f9] text-slate-900 overflow-hidden animate-fade-in">
                    <aside className="w-80 sidebar-gradient text-white flex flex-col shrink-0 z-30 shadow-2xl">
                        <div className="p-8 bg-white mb-6 shadow-md"><KosviLogo /></div>
                        <nav className="flex-1 px-4 space-y-2">
                            <NavItem active={viewMode === 'list'} onClick={() => setViewMode('list')} icon="layout-dashboard" label="운영 현황 리스트" />
                            <NavItem active={viewMode === 'calendar'} onClick={() => setViewMode('calendar')} icon="calendar" label="월간 일정표" />
                        </nav>
                        <div className="p-6 border-t border-slate-800 space-y-4">
                            <div className="p-5 bg-slate-800/40 rounded-[2rem] border border-slate-700">
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1 italic">Authorized Admin</p>
                                <p className="text-sm font-black text-blue-400">{userRole === 'ceo' ? '허창수 법인장' : 'VND 예약담당'}</p>
                            </div>
                            <button onClick={onLogout} className="w-full py-3 bg-slate-700 hover:bg-red-900/40 text-slate-400 hover:text-red-400 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-2 italic">LOGOUT</button>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto flex flex-col">
                        <header className="glass-panel sticky top-0 px-10 py-6 flex justify-between items-center z-20 shadow-sm border-b border-slate-200/50">
                            <div className="flex items-center gap-6">
                                <h2 className="text-2xl font-black text-slate-800 tracking-tighter italic uppercase">{userRole === 'ceo' ? 'CEO Control Panel' : 'Staff Workspace'}</h2>
                                {alerts.length > 0 && (
                                    <div className="flex items-center gap-3 bg-red-50 text-red-600 px-4 py-2 rounded-2xl animate-pulse border border-red-100">
                                        <Icon name="alert-triangle" size={16} />
                                        <span className="text-[10px] font-black uppercase tracking-widest">누락 알림: {alerts.length}건</span>
                                    </div>
                                )}
                            </div>
                            <div className="relative">
                                <Icon name="search" size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" />
                                <input type="text" placeholder="고객 검색..." className="pl-12 pr-6 py-3 bg-white border border-slate-200 rounded-[1.5rem] text-sm outline-none w-72 shadow-inner focus:ring-4 focus:ring-blue-500/5 transition-all" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                        </header>

                        <div className="p-10 space-y-10 max-w-[1600px] mx-auto w-full">
                            {viewMode === 'calendar' ? (
                                <CalendarView trips={trips} onTripClick={(t) => setSelectedTrip(t)} />
                            ) : (
                                <div className="bg-white rounded-[3rem] border border-slate-200 shadow-xl overflow-hidden animate-fade-in">
                                    <div className="px-10 py-8 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                                        <h3 className="text-xl font-black text-slate-800 flex items-center gap-3 uppercase italic tracking-widest">Active Master List</h3>
                                        <button className="bg-slate-900 text-white px-5 py-2.5 rounded-2xl font-black text-[11px] shadow-lg flex items-center gap-2 hover:bg-slate-800 transition-all uppercase"><Icon name="plus" size={14} /> New Schedule</button>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="text-slate-400 text-[10px] font-black uppercase tracking-[0.25em] border-b border-slate-100 bg-slate-50/30">
                                                    <th className="px-10 py-6">Customer Information</th>
                                                    <th className="px-10 py-6">Flight Status</th>
                                                    <th className="px-10 py-6 text-center">Booking</th>
                                                    <th className="px-10 py-6 text-center">Evidence</th>
                                                    <th className="px-10 py-6 text-right">Master Action</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {filteredTrips.map(trip => (
                                                    <tr key={trip.id} className="group hover:bg-slate-50 transition-all">
                                                        <td className="px-10 py-8">
                                                            <p className="font-black text-slate-900 text-lg tracking-tight">{trip.client}</p>
                                                            <p className="text-[10px] text-blue-600 font-bold mt-1.5 uppercase tracking-widest">{trip.date} · {trip.pax} Pax</p>
                                                        </td>
                                                        <td className="px-10 py-8">
                                                            <div className="text-[10px] font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 w-fit">{trip.flightIn}</div>
                                                        </td>
                                                        <td className="px-10 py-8 text-center font-black">
                                                            <span className={`inline-block px-4 py-2 rounded-full text-[10px] tracking-widest ${trip.bookingStatus === '확정' ? 'bg-green-100 text-green-700' : 'bg-red-50 text-red-600 animate-pulse border border-red-100'}`}>
                                                                {trip.bookingStatus === '확정' ? 'CONFIRMED' : 'PENDING!'}
                                                            </span>
                                                        </td>
                                                        <td className="px-10 py-8 text-center">
                                                            <Icon name={trip.fileUploaded ? "file-check" : "file-warning"} size={22} className={trip.fileUploaded ? "text-green-500 mx-auto" : "text-slate-200 mx-auto"} />
                                                        </td>
                                                        <td className="px-10 py-8 text-right font-black flex items-center justify-end gap-6 h-full">
                                                            {userRole === 'ceo' && <span className="text-slate-800 text-lg mr-2 italic tracking-tighter">{formatVND(trip.quoteItems.reduce((a,b)=>a+b.price,0))}</span>}
                                                            <button onClick={() => setSelectedTrip(trip)} className="p-4 bg-white border border-slate-200 rounded-2xl hover:border-blue-600 hover:text-blue-600 shadow-sm transition-all active:scale-90"><Icon name="edit-3" /></button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* [통합 마스터 모달] 일정 + 견적 한 화면 구성 */}
                    {selectedTrip && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/70 backdrop-blur-md animate-in fade-in duration-300 p-8">
                            <div className="bg-white w-full max-w-[1400px] h-[90vh] shadow-2xl rounded-[4rem] flex flex-col animate-in zoom-in-95 duration-500 overflow-hidden border border-white/20">
                                <div className="px-12 py-10 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                                    <div>
                                        <h3 className="text-4xl font-black text-slate-900 tracking-tighter italic uppercase">{selectedTrip.client} 통합 마스터 워크시트</h3>
                                        <p className="text-blue-600 text-xs font-black mt-2 tracking-[0.4em] italic">{selectedTrip.date} ~ {selectedTrip.endDate} (PAX: {selectedTrip.pax})</p>
                                    </div>
                                    <button onClick={() => setSelectedTrip(null)} className="p-6 bg-slate-100 rounded-[2.5rem] hover:bg-slate-200 transition-all shadow-sm"><Icon name="x" size={28} /></button>
                                </div>

                                <div className="flex-1 flex overflow-hidden">
                                    {/* 왼쪽: 일정표 (엑셀 양식 왼쪽) */}
                                    <div className="w-1/2 p-12 overflow-y-auto border-r border-slate-100 space-y-10">
                                        <h4 className="text-sm font-black text-slate-400 uppercase tracking-[0.3em] mb-6 flex items-center gap-2">
                                            <Icon name="map" size={16} /> 01. TRAVEL ITINERARY
                                        </h4>
                                        {selectedTrip.itinerary.map((day, idx) => (
                                            <div key={idx} className="flex gap-8 group">
                                                <div className="w-14 h-14 rounded-[1.8rem] bg-slate-900 text-white flex items-center justify-center font-black text-sm shrink-0 shadow-lg group-hover:scale-110 transition-transform">D-{day.day}</div>
                                                <div className="flex-1 bg-slate-50 p-8 rounded-[2.5rem] border border-slate-100 shadow-sm transition-all hover:bg-white hover:shadow-md">
                                                    <h5 className="font-black text-slate-800 text-lg mb-4 flex justify-between items-center italic">{day.title} <Icon name="edit-2" size={14} className="text-slate-200 hover:text-blue-400 cursor-pointer" /></h5>
                                                    <div className="grid grid-cols-1 gap-3">
                                                        {day.activities.map((act, i) => (
                                                            <div key={i} className="flex items-center gap-3 text-sm text-slate-600 font-bold bg-white p-4 rounded-2xl border border-slate-50 shadow-sm"><div className="w-2 h-2 bg-blue-600 rounded-full animate-pulse"></div>{act}</div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* 오른쪽: 견적서 및 예약관리 (엑셀 양식 오른쪽) */}
                                    <div className="w-1/2 p-12 overflow-y-auto bg-slate-50/30">
                                        {userRole === 'ceo' ? (
                                            <div className="space-y-10">
                                                <h4 className="text-sm font-black text-slate-400 uppercase tracking-[0.3em] flex items-center gap-2">
                                                    <Icon name="calculator" size={16} /> 02. COST & QUOTATION (VND)
                                                </h4>
                                                <div className="bg-slate-900 rounded-[3rem] p-10 text-white shadow-2xl relative border border-slate-800 overflow-hidden">
                                                    <div className="absolute top-0 right-0 p-8 opacity-5"><Icon name="shield-check" size={140} /></div>
                                                    <div className="flex justify-between items-end mb-10 border-b border-slate-800 pb-8">
                                                        <h5 className="text-2xl font-black italic tracking-tighter uppercase text-blue-400">Financial Report</h5>
                                                        <span className="text-[10px] font-bold text-slate-500 tracking-[0.2em] uppercase italic underline underline-offset-8">Exchange Rate: {selectedTrip.exchangeRate}</span>
                                                    </div>
                                                    <table className="w-full text-sm">
                                                        <thead className="text-slate-500 border-b border-slate-800 font-bold text-[10px] uppercase tracking-widest">
                                                            <tr><th className="py-5 text-left">Description</th><th className="py-5 text-right">Cost (VND)</th><th className="py-5 text-right text-blue-400">Quote (VND)</th></tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-800 font-bold">
                                                            {selectedTrip.quoteItems.map((item, i) => (
                                                                <tr key={i} className="hover:bg-white/5 transition-colors">
                                                                    <td className="py-6">{item.name}</td>
                                                                    <td className="py-6 text-right text-slate-400">{formatVND(item.cost)}</td>
                                                                    <td className="py-6 text-right text-blue-400 font-black text-lg">{formatVND(item.price)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                        <tfoot>
                                                            <tr className="border-t border-slate-700 bg-white/5">
                                                                <td colSpan="2" className="py-10 text-right text-slate-500 font-black uppercase text-xs tracking-widest italic">Total Estimated Net Profit</td>
                                                                <td className="py-10 pr-2 text-right text-4xl font-black text-white italic tracking-tighter decoration-green-500 underline decoration-4 underline-offset-8">
                                                                    {formatVND(selectedTrip.quoteItems.reduce((a,b)=>a+(b.price-b.cost),0))}
                                                                </td>
                                                            </tr>
                                                        </tfoot>
                                                    </table>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-10">
                                                <h4 className="text-sm font-black text-slate-400 uppercase tracking-[0.3em] flex items-center gap-2">
                                                    <Icon name="lock" size={16} /> 02. RESERVATION SYSTEM (RESTRICTED)
                                                </h4>
                                                <div className="p-20 bg-white rounded-[3rem] border-2 border-dashed border-slate-200 text-center flex flex-col items-center shadow-inner">
                                                    <Icon name="shield-off" size={64} className="text-slate-100 mb-8" />
                                                    <h5 className="text-xl font-black text-slate-300 tracking-widest uppercase italic">Price Data Locked</h5>
                                                    <p className="text-slate-300 font-bold text-xs mt-4 leading-relaxed max-w-xs">상세 견적 및 수익 정보는 허창수 법인장님 고유 권한입니다. 하단의 예약 특이사항만 업데이트해 주세요.</p>
                                                </div>
                                            </div>
                                        )}

                                        {/* 공통: 직원용 예약 업데이트 섹션 */}
                                        <div className="mt-12 p-10 bg-blue-50/50 border border-blue-100 rounded-[3rem] space-y-8">
                                            <div className="flex justify-between items-center">
                                                <h4 className="text-[11px] font-black text-blue-600 uppercase tracking-[0.2em] flex items-center gap-2 italic"><Icon name="cloud-upload" size={18} /> Booking & Evidence Master</h4>
                                                <select className="bg-white border border-blue-200 px-4 py-2 rounded-xl text-[10px] font-black text-blue-600 outline-none shadow-sm" defaultValue={selectedTrip.bookingStatus}>
                                                    <option>대기 (Pending)</option>
                                                    <option>확정 (Confirmed)</option>
                                                </select>
                                            </div>
                                            <div className="flex gap-6">
                                                <div className="flex-1 p-10 border-2 border-dashed border-blue-200 rounded-[2.5rem] flex flex-col items-center justify-center bg-white/60 cursor-pointer hover:bg-white transition-all group">
                                                    <Icon name="file-up" size={32} className="text-blue-300 mb-3 group-hover:scale-125 transition-transform" />
                                                    <p className="text-[10px] font-black text-blue-400 tracking-tighter">바우처 업로드</p>
                                                </div>
                                                <textarea className="flex-[1.5] bg-white border border-slate-200 rounded-[2.5rem] p-8 text-sm font-bold outline-none h-40 shadow-inner focus:ring-4 focus:ring-blue-500/5 transition-all" placeholder="예약 담당자 특이사항 메모..." defaultValue={selectedTrip.staffNote}></textarea>
                                            </div>
                                            <button className="w-full bg-slate-900 text-white py-6 rounded-[2.5rem] font-black text-lg shadow-2xl active:scale-95 transition-all uppercase italic tracking-widest">Update Master Record</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [authState, setAuthState] = useState({ isLoggedIn: false, role: null });
            const login = (role) => setAuthState({ isLoggedIn: true, role });
            const logout = () => setAuthState({ isLoggedIn: false, role: null });

            return authState.isLoggedIn ? <MainApp userRole={authState.role} onLogout={logout} /> : <LoginPage onLogin={login} />;
        };

        const LoginPage = ({ onLogin }) => {
            const [id, setId] = useState('');
            const [pw, setPw] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (id === 'admin' && pw === '1234') onLogin('ceo');
                else if (id === 'staff' && pw === '5678') onLogin('staff');
                else setError('ID/PW Error');
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-[#f8fafc] p-6 relative">
                    <div className="absolute top-0 right-0 w-[800px] h-[800px] bg-blue-500/5 rounded-full blur-[120px]"></div>
                    <div className="bg-white p-20 rounded-[5rem] shadow-2xl w-full max-w-lg animate-fade-in border border-slate-100 relative z-10">
                        <KosviLogo className="justify-center mb-16" />
                        <form onSubmit={handleLogin} className="space-y-8">
                            <input type="text" className="w-full px-10 py-6 bg-slate-50 border border-slate-200 rounded-[2.5rem] outline-none font-black italic shadow-inner focus:ring-8 focus:ring-blue-500/5 transition-all" placeholder="ADMIN ID" value={id} onChange={(e) => setId(e.target.value)} />
                            <input type="password" className="w-full px-10 py-6 bg-slate-50 border border-slate-200 rounded-[2.5rem] outline-none font-black italic shadow-inner focus:ring-8 focus:ring-blue-500/5 transition-all" placeholder="SECRET KEY" value={pw} onChange={(e) => setPw(e.target.value)} />
                            {error && <p className="text-red-500 text-xs font-black text-center italic uppercase tracking-widest">{error}</p>}
                            <button type="submit" className="w-full bg-blue-600 text-white py-7 rounded-[2.5rem] font-black shadow-xl shadow-blue-500/20 active:scale-95 transition-all text-xl uppercase italic tracking-tighter">Enter Management</button>
                        </form>
                    </div>
                </div>
            );
        };

        const NavItem = ({ active, icon, label, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-5 px-10 py-6 rounded-[2.5rem] transition-all duration-300 ${active ? 'bg-blue-600 text-white shadow-2xl font-black scale-105' : 'text-slate-400 hover:text-slate-100 hover:bg-white/5 font-bold'}`}>
                <Icon name={icon} size={22} /> <span className="text-[11px] tracking-widest uppercase font-black">{label}</span>
                {active && <div className="ml-auto w-2 h-2 bg-white rounded-full animate-ping"></div>}
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
