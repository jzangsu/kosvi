<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Travel Manager - Integrated Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .ceo-card { background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%); color: white; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 엑셀 스타일 입력 필드 */
        .excel-input { 
            background: transparent; 
            border: 1px solid transparent; 
            width: 100%; 
            padding: 6px; 
            border-radius: 4px; 
            transition: all 0.2s;
        }
        .excel-input:hover { border-color: #cbd5e1; background: #f8fafc; }
        .excel-input:focus { border-color: #3b82f6; background: #ffffff; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        /* 테이블 헤더 고정 */
        .sticky-header th { position: sticky; top: 0; background: #f8fafc; z-index: 10; border-bottom: 2px solid #e2e8f0; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* 인쇄 전용 스타일 */
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { 
                position: fixed; 
                top: 0; 
                left: 0; 
                width: 100%; 
                height: 100%; 
                background: white; 
                z-index: 9999; 
                overflow: visible;
            }
        }
    </style>
</head>
<body class="bg-[#f1f5f9]">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE]
         * 1. 사용자: 허창수 법인장 (KOSVI)
         * 2. 계정: admin(1234), staff1(1111), staff2(2222)
         * 3. 핵심: 일정+견적 통합, 항공 구간(Route) 추가, 신규 고객 추가 기능, 하단 합계 표시 강화
         */

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const KosviLogo = ({ dark = false }) => (
            <div className="flex items-center gap-3">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center shadow-lg ${dark ? 'bg-slate-900' : 'bg-blue-600'}`}>
                    <svg width="24" height="24" viewBox="0 0 100 100" fill="none">
                        <path d="M20 20L80 80M80 20L20 80" stroke="white" strokeWidth="14" strokeLinecap="round"/>
                        <circle cx="50" cy="50" r="18" fill={dark ? "#1e293b" : "#f8fafc"} stroke="white" strokeWidth="4"/>
                    </svg>
                </div>
                <div className="flex flex-col">
                    <span className={`text-xl font-black leading-none italic ${dark ? 'text-slate-900' : 'text-slate-800'}`}>KOSVI</span>
                    <span className="text-[10px] font-bold text-blue-600 tracking-widest uppercase">Vietnam Travel</span>
                </div>
            </div>
        );

        const getDayOfWeek = (dateString) => {
            if (!dateString) return '';
            const days = ['일(CN)', '월(T2)', '화(T3)', '수(T4)', '목(T5)', '금(T6)', '토(T7)'];
            const date = new Date(dateString);
            return isNaN(date) ? '' : days[date.getDay()];
        };

        const INITIAL_TRIPS = [
            { 
                id: 1, 
                title: '임창호 님 호치민 3박 4일', 
                client: '임창호 님', 
                pax: 3, 
                startDate: '2026-01-13',
                endDate: '2026-01-16',
                exchangeRate: 5.54, 
                targetCurrency: 'KRW',
                status: '진행중',
                flightInfo: {
                    in: { flight: 'KE469', route: 'ICN-SGN', depTime: '09:05', arrTime: '12:40' },
                    out: { flight: 'KE470', route: 'SGN-ICN', depTime: '13:55', arrTime: '21:15' }
                },
                items: [
                    { id: 1, date: '2026-01-13', time: '12:40', category: '차량', content: '공항 픽업 및 미팅 (S2)', qty: 1, unit: '회', costVnd: 500000, priceVnd: 800000, booking: '확정', note: '기사 배정 완료' },
                    { id: 2, date: '2026-01-13', time: '15:00', category: '호텔', content: '호텔 체크인 (랜드마크)', qty: 3, unit: '박', costVnd: 3650000, priceVnd: 4500000, booking: '대기', note: '바우처 대기중' },
                    { id: 3, date: '2026-01-14', time: '08:30', category: '골프', content: '트윈도브스 18홀 라운딩', qty: 3, unit: '명', costVnd: 3150000, priceVnd: 4200000, booking: '확정', note: '' },
                    { id: 4, date: '2026-01-14', time: '18:00', category: '식사', content: '석식 (한솔식당)', qty: 3, unit: '인', costVnd: 300000, priceVnd: 500000, booking: '미정', note: '' },
                ]
            }
        ];

        const MainApp = ({ userRole, onLogout }) => {
            const [viewMode, setViewMode] = useState('list'); 
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [selectedTrip, setSelectedTrip] = useState(null);
            const [showCustomerQuote, setShowCustomerQuote] = useState(false); 

            const calculateTotal = (items, type) => items.reduce((acc, item) => acc + (item[type] * item.qty), 0);
            
            const convertCurrency = (vndAmount, rate, currency) => {
                if (currency === 'VND') return vndAmount;
                if (currency === 'USD') return vndAmount / 23500; 
                return vndAmount / rate; 
            };

            const formatMoney = (amount, currency) => {
                return Math.round(amount).toLocaleString(undefined, { maximumFractionDigits: 0 }) + (currency === 'VND' ? ' ₫' : currency === 'KRW' ? ' 원' : ' $');
            };

            // 신규 고객 추가 기능
            const handleAddTrip = () => {
                const newId = Date.now();
                const newTrip = {
                    id: newId,
                    title: '신규 여행 일정',
                    client: '새 고객님',
                    pax: 1,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: new Date().toISOString().split('T')[0],
                    exchangeRate: 1,
                    targetCurrency: 'VND',
                    status: '견적중',
                    flightInfo: { in: { flight: '', route: '', depTime: '', arrTime: '' }, out: { flight: '', route: '', depTime: '', arrTime: '' } },
                    items: [
                        { id: 1, date: new Date().toISOString().split('T')[0], time: '', category: '', content: '', qty: 1, unit: '', costVnd: 0, priceVnd: 0, booking: '미정', note: '' }
                    ]
                };
                setTrips([newTrip, ...trips]);
                setSelectedTrip(newTrip);
            };

            const updateTrip = (updatedTrip) => {
                setTrips(trips.map(t => t.id === updatedTrip.id ? updatedTrip : t));
                setSelectedTrip(updatedTrip);
            };

            const updateFlightInfo = (type, field, value) => {
                setSelectedTrip(prev => ({
                    ...prev,
                    flightInfo: {
                        ...prev.flightInfo,
                        [type]: {
                            ...prev.flightInfo[type],
                            [field]: value
                        }
                    }
                }));
            };

            if (showCustomerQuote && selectedTrip) {
                const totalVND = calculateTotal(selectedTrip.items, 'priceVnd');
                const finalPrice = convertCurrency(totalVND, selectedTrip.exchangeRate, selectedTrip.targetCurrency);
                
                return (
                    <div className="fixed inset-0 z-[200] bg-white overflow-y-auto print-container animate-fade-in">
                        <div className="max-w-[210mm] mx-auto min-h-screen bg-white p-12 shadow-2xl my-10 relative print:shadow-none print:m-0 print:p-0">
                            <div className="absolute top-4 right-4 flex gap-2 no-print">
                                <button onClick={() => window.print()} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-lg"><Icon name="printer" /> 인쇄/PDF</button>
                                <button onClick={() => setShowCustomerQuote(false)} className="bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-200">닫기</button>
                            </div>

                            <div className="flex justify-between items-end border-b-4 border-blue-600 pb-8 mb-10">
                                <div><KosviLogo dark={true} /><p className="text-slate-500 text-sm font-medium mt-2">여행 견적서 (Quotation)</p></div>
                                <div className="text-right">
                                    <h1 className="text-4xl font-black text-slate-800 uppercase tracking-tighter mb-1">INVOICE & ITINERARY</h1>
                                    <p className="text-sm font-bold text-slate-500">Date: {new Date().toLocaleDateString()}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-8 mb-12">
                                <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                    <h3 className="text-blue-600 font-black text-xs uppercase tracking-widest mb-4">Customer Details</h3>
                                    <div className="space-y-3 text-sm font-bold text-slate-700">
                                        <div className="flex justify-between border-b border-slate-200 pb-2"><span>고객명 (Client)</span> <span>{selectedTrip.client} 님 (외 {selectedTrip.pax - 1}명)</span></div>
                                        <div className="flex justify-between border-b border-slate-200 pb-2"><span>기간 (Period)</span> <span>{selectedTrip.startDate} ~ {selectedTrip.endDate}</span></div>
                                        <div className="flex justify-between"><span>인원 (Pax)</span> <span>{selectedTrip.pax} 명</span></div>
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                    <h3 className="text-blue-600 font-black text-xs uppercase tracking-widest mb-4">Flight Information</h3>
                                    <div className="space-y-3 text-sm font-bold text-slate-700">
                                        <div className="flex justify-between border-b border-slate-200 pb-2">
                                            <span className="bg-blue-100 text-blue-600 px-2 py-0.5 rounded text-xs mr-2">IN</span>
                                            <span>{selectedTrip.flightInfo.in.route} | {selectedTrip.flightInfo.in.flight} ({selectedTrip.flightInfo.in.arrTime} 도착)</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="bg-orange-100 text-orange-600 px-2 py-0.5 rounded text-xs mr-2">OUT</span>
                                            <span>{selectedTrip.flightInfo.out.route} | {selectedTrip.flightInfo.out.flight} ({selectedTrip.flightInfo.out.depTime} 출발)</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="mb-12">
                                <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-2"><Icon name="calendar-days" size={20} className="text-blue-600" /> 상세 일정 및 포함 내역</h3>
                                <table className="w-full text-sm text-left border-collapse rounded-2xl shadow-sm border border-slate-200">
                                    <thead>
                                        <tr className="bg-slate-900 text-white uppercase text-[11px] font-black tracking-widest">
                                            <th className="p-4 w-32">Date</th>
                                            <th className="p-4 w-20 text-center">Time</th>
                                            <th className="p-4">Description (Itinerary)</th>
                                            <th className="p-4 text-center w-16">Qty</th>
                                            <th className="p-4 text-center w-16">Unit</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-slate-700 font-bold">
                                        {selectedTrip.items.map((item, idx) => (
                                            <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50">
                                                <td className="p-4 bg-slate-50/50">
                                                    <div className="text-slate-900">{item.date}</div>
                                                    <div className="text-[10px] text-slate-400 font-medium">({getDayOfWeek(item.date)})</div>
                                                </td>
                                                <td className="p-4 text-center text-blue-600 font-black">{item.time || '-'}</td>
                                                <td className="p-4"><span className="text-slate-800">{item.content}</span><span className="ml-2 text-[10px] bg-slate-200 px-2 py-0.5 rounded text-slate-500 uppercase">{item.category}</span></td>
                                                <td className="p-4 text-center">{item.qty}</td>
                                                <td className="p-4 text-center text-slate-400">{item.unit}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <div className="flex justify-end mb-16">
                                <div className="w-1/2 bg-blue-600 text-white p-10 rounded-[3rem] shadow-2xl text-right relative overflow-hidden">
                                    <div className="absolute top-0 left-0 p-8 opacity-10"><Icon name="check-circle-2" size={120} /></div>
                                    <p className="text-blue-200 text-xs font-black uppercase tracking-widest mb-2">Final Total Amount (VAT Included)</p>
                                    <h2 className="text-5xl font-black tracking-tighter underline underline-offset-8 decoration-white/20 italic">{formatMoney(finalPrice, selectedTrip.targetCurrency)}</h2>
                                    <div className="mt-6 pt-6 border-t border-white/20 flex justify-between text-xs font-medium text-blue-100">
                                        <span>Total VND: {formatMoney(totalVND, 'VND')}</span>
                                        <span>Exchange Rate: {selectedTrip.exchangeRate}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="border-t-4 border-double border-slate-200 pt-10 grid grid-cols-2 gap-10 text-sm">
                                <div>
                                    <h4 className="font-black text-slate-800 mb-4 flex items-center gap-2"><Icon name="banknote" size={20} /> 결제 계좌 (Payment Info)</h4>
                                    <div className="bg-slate-50 p-6 rounded-3xl border border-slate-200 space-y-3">
                                        {selectedTrip.targetCurrency === 'KRW' ? (
                                            <p className="font-black text-slate-700 text-lg">KRW: 토스뱅크 1000-1841-9143 <span className="text-sm font-medium text-slate-400 ml-2">(예금주: 허창수)</span></p>
                                        ) : (
                                            <p className="font-black text-slate-700 text-lg">VND: 신한베트남 077-890-1861 <span className="text-sm font-medium text-slate-400 ml-2">(예금주: HEO CHANGSU)</span></p>
                                        )}
                                    </div>
                                </div>
                                <div className="text-right flex flex-col justify-end space-y-1 text-xs text-slate-400">
                                    <p className="font-black text-blue-600 text-xl italic mb-2">KOSVI CO., LTD</p>
                                    <p className="font-bold">Address: Landmark Plus, Vinhomes Central Park, HCM</p>
                                    <p className="font-bold">Tel: 0286-270-6413 | Mobile: 077-890-1861</p>
                                    <p className="font-bold">Kakao ID: KOSVIVN</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-[#f1f5f9] text-slate-900 overflow-hidden animate-fade-in no-print">
                    <aside className="w-72 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl">
                        <div className="p-6 bg-white"><KosviLogo /></div>
                        <div className="p-6">
                            <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700">
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Signed in as</p>
                                <div className="flex items-center gap-2">
                                    <div className={`w-2 h-2 rounded-full ${userRole === 'admin' ? 'bg-blue-500' : 'bg-green-500'}`}></div>
                                    <span className="font-bold text-lg">{userRole === 'admin' ? '허창수 법인장' : '직원 (Staff)'}</span>
                                </div>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            <button className="w-full flex items-center gap-4 px-6 py-4 bg-blue-600 rounded-2xl text-white font-bold shadow-lg"><Icon name="layout-dashboard" /> 통합 대시보드</button>
                        </nav>
                        <div className="p-6">
                            <button onClick={onLogout} className="w-full py-3 bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                                <Icon name="log-out" size={14} /> 로그아웃
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto flex flex-col">
                        <header className="glass-panel sticky top-0 px-8 py-5 flex justify-between items-center z-20 shadow-sm">
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">KOSVI Integrated Manager</h2>
                            {userRole === 'admin' && (
                                <button onClick={handleAddTrip} className="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg flex items-center gap-2 hover:bg-slate-800 transition-all">
                                    <Icon name="plus" size={16} /> 새 견적 생성 (Tạo mới)
                                </button>
                            )}
                        </header>

                        <div className="p-8 max-w-[1600px] mx-auto w-full">
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
                                <table className="w-full text-left font-bold">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                            <th className="px-8 py-5">고객명 (Khách hàng)</th>
                                            <th className="px-8 py-5">일정 및 항공 (Lịch trình & Bay)</th>
                                            <th className="px-8 py-5 text-center">상태 (Trạng thái)</th>
                                            {userRole === 'admin' && <th className="px-8 py-5 text-right">총 견적 (Tổng giá)</th>}
                                            <th className="px-8 py-5 text-right">관리 (Quản lý)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {trips.map(trip => (
                                            <tr key={trip.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-8 py-6">
                                                    <p className="text-lg text-slate-800">{trip.client}</p>
                                                    <p className="text-xs text-slate-400 font-medium">({trip.pax}명)</p>
                                                </td>
                                                <td className="px-8 py-6">
                                                    <div className="text-slate-800 text-sm mb-2">{trip.title}</div>
                                                    <div className="flex flex-col gap-1 text-[11px] text-slate-500">
                                                        <div className="flex items-center gap-2">
                                                            <span className="bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded font-black">IN</span>
                                                            <span className="font-bold">{trip.flightInfo.in.route}</span>
                                                            <span>{trip.flightInfo.in.arrTime} 도착</span>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="bg-orange-100 text-orange-600 px-1.5 py-0.5 rounded font-black">OUT</span>
                                                            <span className="font-bold">{trip.flightInfo.out.route}</span>
                                                            <span>{trip.flightInfo.out.depTime} 출발</span>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="px-8 py-6 text-center"><span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs">{trip.status}</span></td>
                                                {userRole === 'admin' && (
                                                    <td className="px-8 py-6 text-right font-black text-slate-800 text-lg">
                                                        {formatMoney(convertCurrency(calculateTotal(trip.items, 'priceVnd'), trip.exchangeRate, trip.targetCurrency), trip.targetCurrency)}
                                                    </td>
                                                )}
                                                <td className="px-8 py-6 text-right">
                                                    <button onClick={() => setSelectedTrip({...trip})} className="p-3 bg-white border border-slate-200 rounded-xl hover:border-blue-500 hover:text-blue-600 shadow-sm transition-all"><Icon name="edit-3" /></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {selectedTrip && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-6 animate-fade-in">
                            <div className="bg-white w-full max-w-[1700px] h-[95vh] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden">
                                <div className="px-10 py-6 bg-slate-900 text-white flex justify-between items-center shrink-0">
                                    <div className="flex gap-6 items-center">
                                        <input className="bg-transparent text-2xl font-black italic outline-none w-64" value={selectedTrip.client} onChange={(e)=>updateTrip({...selectedTrip, client: e.target.value})} />
                                        <div className="flex gap-2 items-center text-sm">
                                            <input type="date" className="bg-slate-800 border border-slate-600 rounded px-2 py-1 outline-none" value={selectedTrip.startDate} onChange={(e)=>updateTrip({...selectedTrip, startDate: e.target.value})} />
                                            <span>~</span>
                                            <input type="date" className="bg-slate-800 border border-slate-600 rounded px-2 py-1 outline-none" value={selectedTrip.endDate} onChange={(e)=>updateTrip({...selectedTrip, endDate: e.target.value})} />
                                        </div>
                                    </div>
                                    
                                    {userRole === 'admin' && (
                                        <div className="flex items-center gap-6 bg-white/10 px-6 py-3 rounded-2xl border border-white/10">
                                            <div className="flex flex-col">
                                                <label className="text-[10px] text-blue-300 font-bold uppercase">Rate</label>
                                                <input type="number" className="bg-transparent border-b border-blue-400 w-20 text-lg font-black outline-none focus:border-white transition-colors" value={selectedTrip.exchangeRate} onChange={(e) => { const newTrip = {...selectedTrip, exchangeRate: parseFloat(e.target.value)}; setSelectedTrip(newTrip); }} />
                                            </div>
                                            <div className="flex flex-col">
                                                <label className="text-[10px] text-blue-300 font-bold uppercase">Currency</label>
                                                <select className="bg-slate-800 border border-slate-600 rounded text-sm font-bold px-2 py-1 outline-none" value={selectedTrip.targetCurrency} onChange={(e) => setSelectedTrip({...selectedTrip, targetCurrency: e.target.value})}>
                                                    <option value="KRW">KRW</option><option value="USD">USD</option><option value="VND">VND</option>
                                                </select>
                                            </div>
                                            <div className="text-right pl-6 border-l border-white/20">
                                                <p className="text-[10px] text-slate-400 uppercase">Total Estimate</p>
                                                <p className="text-2xl font-black text-green-400">{formatMoney(convertCurrency(calculateTotal(selectedTrip.items, 'priceVnd'), selectedTrip.exchangeRate, selectedTrip.targetCurrency), selectedTrip.targetCurrency)}</p>
                                            </div>
                                        </div>
                                    )}
                                    <div className="flex gap-2">
                                        {userRole === 'admin' && <button onClick={() => setShowCustomerQuote(true)} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 transition-all"><Icon name="printer" size={16} /> Guest View</button>}
                                        <button onClick={() => setSelectedTrip(null)} className="p-3 hover:bg-white/10 rounded-full transition-colors"><Icon name="x" size={24} /></button>
                                    </div>
                                </div>

                                <div className="bg-slate-800 px-10 py-4 flex gap-8 border-t border-white/5 shrink-0">
                                    <div className="flex-1 bg-white/5 p-4 rounded-3xl border border-white/5 flex gap-4 items-center">
                                        <span className="text-[10px] font-black text-blue-400 uppercase tracking-widest italic w-16">IN</span>
                                        <input className="bg-transparent border-b border-white/20 text-white font-black outline-none w-20 text-center" value={selectedTrip.flightInfo.in.route} onChange={(e)=>updateFlightInfo('in', 'route', e.target.value)} placeholder="구간" />
                                        <input className="bg-transparent border-b border-white/20 text-white font-black outline-none w-20 text-center" value={selectedTrip.flightInfo.in.flight} onChange={(e)=>updateFlightInfo('in', 'flight', e.target.value)} placeholder="편명" />
                                        <input className="bg-transparent border-b border-white/20 text-white font-black outline-none w-16 text-center" value={selectedTrip.flightInfo.in.depTime} onChange={(e)=>updateFlightInfo('in', 'depTime', e.target.value)} placeholder="출발" />
                                        <Icon name="arrow-right" size={14} className="text-slate-600" />
                                        <input className="bg-transparent border-b border-white/20 text-white font-black outline-none w-16 text-center" value={selectedTrip.flightInfo.in.arrTime} onChange={(e)=>updateFlightInfo('in', 'arrTime', e.target.value)} placeholder="도착" />
                                    </div>
                                    <div className="flex-1 bg-white/5 p-4 rounded-3xl border border-white/5 flex gap-4 items-center">
                                        <span className="text-[10px] font-black text-orange-400 uppercase tracking-widest italic w-16">OUT</span>
                                        <input className="bg-transparent border-b border-white/20 text-white font-black outline-none w-20 text-center" value={selectedTrip.flightInfo.out.route} onChange={(e)=>updateFlightInfo('out', 'route', e.target.value)} placeholder="구간" />
                                        <input className="bg-transparent border-b border-white/20 text-white font-black outline-none w-20 text-center" value={selectedTrip.flightInfo.out.flight} onChange={(e)=>updateFlightInfo('out', 'flight', e.target.value)} placeholder="편명" />
                                        <input className="bg-transparent border-b border-white/20 text-white font-black outline-none w-16 text-center" value={selectedTrip.flightInfo.out.depTime} onChange={(e)=>updateFlightInfo('out', 'depTime', e.target.value)} placeholder="출발" />
                                        <Icon name="arrow-right" size={14} className="text-slate-600" />
                                        <input className="bg-transparent border-b border-white/20 text-white font-black outline-none w-16 text-center" value={selectedTrip.flightInfo.out.arrTime} onChange={(e)=>updateFlightInfo('out', 'arrTime', e.target.value)} placeholder="도착" />
                                    </div>
                                </div>

                                <div className="flex-1 overflow-auto bg-white p-8">
                                    <table className="w-full text-sm border-collapse">
                                        <thead className="sticky-header text-xs text-slate-500 uppercase tracking-wider font-bold">
                                            <tr>
                                                <th className="p-3 text-left w-28">Date</th>
                                                <th className="p-3 text-center w-20">Time</th>
                                                <th className="p-3 w-24">Type</th>
                                                <th className="p-3 w-[25%]">Itinerary & Description</th>
                                                <th className="p-3 text-center w-16">Qty</th>
                                                <th className="p-3 text-center w-16">Unit</th>
                                                {userRole === 'admin' ? (
                                                    <>
                                                        <th className="p-3 text-right bg-red-50/50 w-32">Cost (VND)</th>
                                                        <th className="p-3 text-right bg-blue-50/50 w-32">Price (VND)</th>
                                                        <th className="p-3 text-right w-20">Margin</th>
                                                    </>
                                                ) : null}
                                                <th className="p-3 text-center w-24">Booking</th>
                                                <th className="p-3 text-left">Staff Memo</th>
                                                <th className="p-3 text-center w-12"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-medium text-slate-700">
                                            {selectedTrip.items.map((item, idx) => (
                                                <tr key={item.id} className="group hover:bg-slate-50 border-b border-slate-100">
                                                    <td className="p-2"><input className="excel-input font-bold text-slate-800" value={item.date} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].date = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /><div className="text-[10px] text-slate-400 pl-2">{getDayOfWeek(item.date)}</div></td>
                                                    <td className="p-2"><input className="excel-input text-center text-blue-600 font-bold" value={item.time} placeholder="00:00" onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].time = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input className="excel-input text-center text-slate-500 text-xs" value={item.category} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].category = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input className="excel-input font-bold text-slate-800" value={item.content} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].content = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input type="number" className="excel-input text-center" value={item.qty} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].qty = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input className="excel-input text-center text-slate-400" value={item.unit} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].unit = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    {userRole === 'admin' ? (
                                                        <>
                                                            <td className="p-2 bg-red-50/30"><input type="number" className="excel-input text-right text-red-400 font-bold" value={item.costVnd} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].costVnd = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                            <td className="p-2 bg-blue-50/30"><input type="number" className="excel-input text-right text-blue-600 font-black" value={item.priceVnd} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].priceVnd = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                            <td className="p-3 text-right text-xs font-bold text-slate-400">{item.priceVnd > 0 ? Math.round(((item.priceVnd - item.costVnd)/item.priceVnd)*100) + '%' : '-'}</td>
                                                        </>
                                                    ) : null}
                                                    <td className="p-2 text-center">
                                                        <select className={`text-xs font-bold px-2 py-1 rounded border outline-none cursor-pointer w-full text-center ${item.booking === '확정' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`} value={item.booking} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].booking = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }}>
                                                            <option>미정</option><option>대기</option><option>확정</option>
                                                        </select>
                                                    </td>
                                                    <td className="p-2"><input className="excel-input text-xs text-slate-500" value={item.note} placeholder="메모..." onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].note = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2 text-center">{userRole === 'admin' && <button onClick={()=>{ const newItems = selectedTrip.items.filter(i => i.id !== item.id); setSelectedTrip({...selectedTrip, items: newItems}); }} className="text-slate-300 hover:text-red-500"><Icon name="trash-2" size={16} /></button>}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                        {userRole === 'admin' && (
                                            <tfoot>
                                                <tr className="bg-slate-50 border-t-2 border-slate-200">
                                                    <td colSpan="3" className="p-4 text-center">
                                                        <button onClick={()=>{ const newId = Date.now(); setSelectedTrip({...selectedTrip, items: [...selectedTrip.items, { id: newId, date: selectedTrip.startDate, time: '', category: '', content: '', qty: 1, unit: '', costVnd: 0, priceVnd: 0, booking: '미정', note: '' }]}); }} className="text-xs font-bold bg-white border border-slate-300 px-4 py-2 rounded-lg hover:bg-blue-50 transition-all flex items-center gap-2 mx-auto"><Icon name="plus" size={14} /> 행 추가</button>
                                                    </td>
                                                    <td colSpan="3" className="p-4 text-right font-black text-slate-500 uppercase text-xs tracking-widest">TOTAL (VND)</td>
                                                    <td className="p-4 text-right font-bold text-slate-400">{formatMoney(calculateTotal(selectedTrip.items, 'costVnd'), 'VND')}</td>
                                                    <td className="p-4 text-right font-black text-blue-600 text-lg">{formatMoney(calculateTotal(selectedTrip.items, 'priceVnd'), 'VND')}</td>
                                                    <td colSpan="4"></td>
                                                </tr>
                                            </tfoot>
                                        )}
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [authState, setAuthState] = useState({ isLoggedIn: false, role: null });
            const login = (role) => setAuthState({ isLoggedIn: true, role });
            const logout = () => setAuthState({ isLoggedIn: false, role: null });
            return authState.isLoggedIn ? <MainApp userRole={authState.role} onLogout={logout} /> : <LoginPage onLogin={login} />;
        };

        const LoginPage = ({ onLogin }) => {
            const [id, setId] = useState('');
            const [pw, setPw] = useState('');
            const [error, setError] = useState('');
            const handleLogin = (e) => {
                e.preventDefault();
                if (id === 'admin' && pw === '1234') onLogin('admin');
                else if (id === 'staff1' && pw === '1111') onLogin('staff1');
                else if (id === 'staff2' && pw === '2222') onLogin('staff2');
                else setError('ID 또는 암호 오류');
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-[#f1f5f9] p-6">
                    <div className="bg-white p-16 rounded-[3rem] shadow-2xl w-full max-w-md border border-slate-200">
                        <div className="flex justify-center mb-10"><KosviLogo /></div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <input type="text" className="w-full px-8 py-5 bg-slate-50 border border-slate-200 rounded-[2rem] outline-none font-bold text-center" placeholder="ID (admin/staff1/staff2)" value={id} onChange={(e) => setId(e.target.value)} />
                            <input type="password" className="w-full px-8 py-5 bg-slate-50 border border-slate-200 rounded-[2rem] outline-none font-bold text-center" placeholder="PASSWORD" value={pw} onChange={(e) => setPw(e.target.value)} />
                            {error && <p className="text-red-500 text-xs font-bold text-center">{error}</p>}
                            <button type="submit" className="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black shadow-xl hover:bg-blue-700 transition-all">LOGIN</button>
                        </form>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
