<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Travel Manager - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .ceo-card { background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%); color: white; }
        .login-bg { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#f1f5f9]">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE - Gemini 전용 기억 저장소]
         * ---------------------------------------------------------
         * 1. 사용자 정보: 허창수 법인장 (CEO, KOSVI Travel)
         * 2. 프로젝트: KOSVI 여행사 통합 관리 시스템 (v6.0 - 로그인 및 권한 분리 강화)
         * 3. 핵심 규칙:
         * - 보안: 로그인 페이지를 통한 접속 (CEO: admin/1234, Staff: staff/5678).
         * - 통화: 모든 금액은 베트남 동 (VND) 기준.
         * - 기능: 일자별 일정(Itinerary)과 견적(Quote) 관리. CEO 전용 금융 정보 노출.
         * 4. 배포 정보: kosvi-travel / FIREBASE_SERVICE_ACCOUNT_KOSVI_TRAVEL
         * ---------------------------------------------------------
         */

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const KosviLogo = ({ className = "" }) => (
            <div className={`flex items-center gap-3 ${className}`}>
                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/40">
                    <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 20L80 80M80 20L20 80" stroke="white" strokeWidth="12" strokeLinecap="round"/>
                        <circle cx="50" cy="50" r="15" fill="#f8fafc" stroke="white" strokeWidth="4"/>
                    </svg>
                </div>
                <div className="flex flex-col">
                    <span className="text-xl font-black text-slate-800 leading-none">KOSVI</span>
                    <span className="text-[10px] font-extrabold text-blue-600 tracking-[0.25em] leading-tight uppercase">Travel & Logistics</span>
                </div>
            </div>
        );

        // 초기 데이터
        const INITIAL_TRIPS = [
            { 
                id: 1, 
                title: '임창호 님 호치민 3박 4일 패키지', 
                client: '임창호 님', 
                pax: 3, 
                date: '2024-03-13 ~ 03-16',
                flightIn: 'KE469 (ICN-SGN) 12:40 도착',
                flightOut: 'KE470 (SGN-ICN) 13:55 출발',
                exchangeRate: 5.5386, 
                status: '견적완료',
                bookingStatus: '확정',
                itinerary: [
                    { day: 1, title: '호치민 입국 및 중식', activities: ['공항 픽업 및 미팅', '신밧드케밥 중식', '호텔 체크인'] },
                    { day: 2, title: '트윈도브스 골프 라운딩', activities: ['조식 후 골프장 이동', '트윈도브스 18홀', '석식 및 자유시간'] },
                    { day: 3, title: '시내 투어 및 마사지', activities: ['전쟁박물관 투어', '머드스파 90분', '선상 디너 크루즈'] },
                    { day: 4, title: '쇼핑 및 출국', activities: ['사이공스퀘어 쇼핑', '공항 샌딩'] }
                ],
                quoteItems: [
                    { name: 'S2 차량 (6일분)', cost: 3354600, price: 6300000, qty: 6, unit: '회' },
                    { name: 'Twin Doves Golf', cost: 6300000, price: 8500000, qty: 2, unit: '명' },
                    { name: 'Hotel (Landmark Plus)', cost: 10950000, price: 13687500, qty: 3, unit: '박' }
                ],
                staffNote: '트윈도브스 예약 확정. 대한항공 수하물 확인 필.'
            }
        ];

        // 로그인 화면 컴포넌트
        const LoginPage = ({ onLogin }) => {
            const [id, setId] = useState('');
            const [pw, setPw] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (id === 'admin' && pw === '1234') {
                    onLogin('ceo');
                } else if (id === 'staff' && pw === '5678') {
                    onLogin('staff');
                } else {
                    setError('아이디 또는 비밀번호가 일치하지 않습니다.');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center login-bg p-6">
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md animate-fade-in border border-slate-200">
                        <div className="text-center mb-10">
                            <KosviLogo className="justify-center mb-6" />
                            <h2 className="text-2xl font-black text-slate-800 tracking-tighter">통합 관리 시스템 로그인</h2>
                            <p className="text-slate-400 text-sm font-bold mt-2 uppercase tracking-widest">Management v6.0</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <div className="space-y-2">
                                <label className="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Access ID</label>
                                <input 
                                    type="text" 
                                    className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 transition-all font-bold"
                                    placeholder="아이디를 입력하세요"
                                    value={id}
                                    onChange={(e) => setId(e.target.value)}
                                />
                            </div>
                            <div className="space-y-2">
                                <label className="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Password</label>
                                <input 
                                    type="password" 
                                    className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 transition-all font-bold"
                                    placeholder="비밀번호를 입력하세요"
                                    value={pw}
                                    onChange={(e) => setPw(e.target.value)}
                                />
                            </div>
                            {error && <p className="text-red-500 text-xs font-bold text-center">{error}</p>}
                            <button 
                                type="submit" 
                                className="w-full bg-blue-600 text-white py-5 rounded-2xl font-black shadow-xl shadow-blue-500/20 hover:bg-blue-700 active:scale-95 transition-all text-lg"
                            >
                                접속하기
                            </button>
                        </form>
                        <div className="mt-8 text-center text-slate-300 text-[10px] font-bold tracking-widest uppercase">
                            © 2026 KOSVI Travel & Logistics
                        </div>
                    </div>
                </div>
            );
        };

        const MainApp = ({ userRole, onLogout }) => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedTrip, setSelectedTrip] = useState(null);
            const [modalView, setModalView] = useState('itinerary');

            const formatVND = (val) => val.toLocaleString() + ' ₫';

            const filteredTrips = trips.filter(trip => trip.client.includes(searchTerm) || trip.title.includes(searchTerm));

            const summary = useMemo(() => {
                let rev = 0, cost = 0;
                trips.forEach(t => t.quoteItems.forEach(i => { rev += i.price; cost += i.cost; }));
                return { rev, cost, profit: rev - cost };
            }, [trips]);

            return (
                <div className="flex h-screen bg-[#f1f5f9] text-slate-900 overflow-hidden animate-fade-in">
                    {/* 사이드바 */}
                    <aside className="w-80 sidebar-gradient text-white flex flex-col shrink-0 z-30 shadow-2xl">
                        <div className="p-8 bg-white mb-6 shadow-md"><KosviLogo /></div>
                        
                        <nav className="flex-1 px-4 space-y-1">
                            <NavItem active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon="layout-dashboard" label="비즈니스 요약" />
                            <NavItem active={activeTab === 'trips'} onClick={() => setActiveTab('trips')} icon="briefcase" label="일정 및 예약 관리" />
                            {userRole === 'ceo' && <NavItem active={activeTab === 'finance'} onClick={() => setActiveTab('finance')} icon="pie-chart" label="전체 수익 통계" />}
                        </nav>
                        
                        <div className="p-6 border-t border-slate-800">
                            <div className="p-4 bg-slate-800/40 rounded-2xl border border-slate-700 flex flex-col gap-3">
                                <div className="flex items-center gap-3">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-white ${userRole === 'ceo' ? 'bg-blue-600' : 'bg-green-600'}`}>
                                        {userRole === 'ceo' ? 'H' : 'ST'}
                                    </div>
                                    <div className="overflow-hidden">
                                        <p className="text-sm font-black truncate">{userRole === 'ceo' ? '허창수 법인장' : 'VND 예약담당'}</p>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">{userRole === 'ceo' ? 'CEO' : 'Staff'}</p>
                                    </div>
                                </div>
                                <button 
                                    onClick={onLogout}
                                    className="w-full py-2 bg-slate-700 hover:bg-red-900/40 hover:text-red-400 text-slate-400 rounded-xl text-xs font-black transition-all"
                                >
                                    로그아웃
                                </button>
                            </div>
                        </div>
                    </aside>

                    {/* 메인 섹션 */}
                    <main className="flex-1 overflow-y-auto flex flex-col">
                        <header className="glass-panel sticky top-0 px-10 py-6 flex justify-between items-center z-20 shadow-sm">
                            <div>
                                <h2 className="text-2xl font-black text-slate-800 tracking-tight italic">
                                    {userRole === 'ceo' ? 'Administrator Console' : 'Staff Workspace'}
                                </h2>
                                <p className="text-[10px] text-blue-600 font-bold tracking-widest uppercase mt-1">Status: Active Service (VND)</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="relative">
                                    <Icon name="search" size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input 
                                        type="text" 
                                        placeholder="고객명 검색..." 
                                        className="pl-12 pr-6 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-4 focus:ring-blue-500/10 outline-none w-72 shadow-inner"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                            </div>
                        </header>

                        <div className="p-10 space-y-8 max-w-7xl mx-auto w-full">
                            {activeTab === 'dashboard' && (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {userRole === 'ceo' ? (
                                        <div className="ceo-card p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                                            <p className="text-blue-100 text-xs font-bold uppercase tracking-widest">Monthly Revenue</p>
                                            <h3 className="text-3xl font-black mt-2">{formatVND(summary.rev)}</h3>
                                            <Icon name="trending-up" className="absolute -bottom-4 -right-4 text-white/10" size={120} />
                                        </div>
                                    ) : (
                                        <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm flex items-center justify-center">
                                            <p className="text-slate-400 text-sm font-bold italic tracking-wider">매출 정보 열람 권한 없음</p>
                                        </div>
                                    )}
                                    <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm relative overflow-hidden">
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Active Bookings</p>
                                        <h3 className="text-3xl font-black mt-2 text-slate-800">{trips.length} Teams</h3>
                                        <Icon name="briefcase" className="absolute -bottom-4 -right-4 text-slate-50" size={120} />
                                    </div>
                                    {userRole === 'ceo' ? (
                                        <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm relative overflow-hidden">
                                            <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Net Profit (Target)</p>
                                            <h3 className="text-3xl font-black mt-2 text-green-600">{formatVND(summary.profit)}</h3>
                                            <Icon name="dollar-sign" className="absolute -bottom-4 -right-4 text-slate-50" size={120} />
                                        </div>
                                    ) : (
                                        <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm flex items-center justify-center">
                                            <p className="text-slate-400 text-sm font-bold italic tracking-wider">보안 사항 (CEO 전용)</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* 리스트 테이블 */}
                            <div className="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="px-10 py-7 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                    <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">
                                        <div className="w-1 h-5 bg-blue-600 rounded-full"></div>
                                        KOSVI Booking Master List
                                    </h3>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm font-bold">
                                        <thead>
                                            <tr className="text-slate-400 text-[11px] font-black uppercase tracking-widest border-b border-slate-100">
                                                <th className="px-10 py-6">Customer Name</th>
                                                <th className="px-10 py-6">Flight Schedule</th>
                                                <th className="px-10 py-6 text-center">Status</th>
                                                {userRole === 'ceo' && <th className="px-10 py-6 text-right">Total VND</th>}
                                                <th className="px-10 py-6 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {filteredTrips.map(trip => (
                                                <tr key={trip.id} className="group hover:bg-slate-50 transition-all">
                                                    <td className="px-10 py-8">
                                                        <p className="font-black text-slate-900 text-lg leading-tight">{trip.client}</p>
                                                        <p className="text-[10px] text-blue-600 font-bold mt-1 uppercase tracking-wider">{trip.date} · {trip.pax} Pax</p>
                                                    </td>
                                                    <td className="px-10 py-8">
                                                        <div className="text-[10px] font-bold text-slate-600 bg-blue-50 px-2.5 py-1 rounded-lg w-fit mb-1">{trip.flightIn}</div>
                                                        <div className="text-[10px] font-bold text-slate-400 px-2.5 py-1">{trip.flightOut}</div>
                                                    </td>
                                                    <td className="px-10 py-8 text-center">
                                                        <span className={`inline-block px-4 py-1.5 rounded-full text-[10px] font-black tracking-widest ${
                                                            trip.bookingStatus === '확정' ? 'bg-green-100 text-green-700 shadow-sm shadow-green-100' : 'bg-orange-100 text-orange-700 shadow-sm shadow-orange-100'
                                                        }`}>{trip.bookingStatus}</span>
                                                    </td>
                                                    {userRole === 'ceo' && (
                                                        <td className="px-10 py-8 text-right font-black text-slate-800 text-lg italic tracking-tighter">
                                                            {formatVND(trip.quoteItems.reduce((a,b)=>a+b.price,0))}
                                                        </td>
                                                    )}
                                                    <td className="px-10 py-8 text-right">
                                                        <button 
                                                            onClick={() => { setSelectedTrip(trip); setModalView('itinerary'); }}
                                                            className="p-3 bg-white border border-slate-200 rounded-2xl hover:bg-blue-600 hover:text-white transition-all shadow-sm active:scale-90"
                                                        >
                                                            <Icon name="file-text" size={20} />
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* 통합 모달 */}
                    {selectedTrip && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-end bg-slate-900/50 backdrop-blur-sm animate-in fade-in duration-300">
                            <div className="bg-white w-[900px] h-full shadow-2xl p-0 flex flex-col animate-in slide-in-from-right duration-500 overflow-hidden">
                                <div className="p-10 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                    <div>
                                        <h3 className="text-3xl font-black text-slate-900 tracking-tighter">{selectedTrip.client} 일정/관리</h3>
                                        <p className="text-blue-600 text-[11px] font-bold mt-1 uppercase tracking-widest italic">{selectedTrip.date}</p>
                                    </div>
                                    <button onClick={() => setSelectedTrip(null)} className="p-4 bg-slate-100 rounded-2xl hover:bg-slate-200 transition-all">
                                        <Icon name="x" size={24} />
                                    </button>
                                </div>

                                <div className="flex px-10 py-4 bg-white border-b border-slate-100 gap-8">
                                    <button 
                                        onClick={() => setModalView('itinerary')}
                                        className={`text-[11px] font-black pb-2 tracking-widest transition-all ${modalView === 'itinerary' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-300 hover:text-slate-500'}`}
                                    >TRAVEL ITINERARY</button>
                                    <button 
                                        onClick={() => setModalView('quote')}
                                        className={`text-[11px] font-black pb-2 tracking-widest transition-all ${modalView === 'quote' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-300 hover:text-slate-500'}`}
                                    >COST QUOTATION (VND)</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-10 space-y-10">
                                    {modalView === 'itinerary' ? (
                                        <div className="space-y-8 animate-in fade-in duration-500">
                                            {selectedTrip.itinerary.map((day, idx) => (
                                                <div key={idx} className="flex gap-6">
                                                    <div className="w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center font-black text-xs shrink-0 shadow-lg">D-{day.day}</div>
                                                    <div className="flex-1 bg-slate-50 p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                                                        <h4 className="font-black text-slate-800 text-lg mb-4">{day.title}</h4>
                                                        <div className="grid grid-cols-1 gap-3">
                                                            {day.activities.map((act, i) => (
                                                                <div key={i} className="flex items-center gap-3 text-sm text-slate-600 font-bold bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                                                                    <div className="w-2 h-2 bg-blue-600 rounded-full animate-pulse"></div>
                                                                    {act}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="space-y-8 animate-in fade-in duration-500">
                                            {userRole === 'ceo' ? (
                                                <div className="bg-slate-900 rounded-[2.5rem] p-10 text-white shadow-2xl relative overflow-hidden border border-slate-800">
                                                    <div className="absolute top-0 right-0 p-6"><Icon name="shield-check" className="text-blue-500/30" size={80} /></div>
                                                    <div className="flex justify-between items-end mb-10 border-b border-slate-800 pb-6">
                                                        <h4 className="text-xl font-black italic tracking-tight">CEO Financial Report</h4>
                                                        <span className="text-[10px] font-bold text-slate-500 tracking-[0.2em] uppercase underline decoration-blue-500 decoration-2 underline-offset-4">Exchange Rate: {selectedTrip.exchangeRate}</span>
                                                    </div>
                                                    <table className="w-full text-sm">
                                                        <thead>
                                                            <tr className="text-slate-500 font-bold border-b border-slate-800 text-[10px] uppercase tracking-widest">
                                                                <th className="py-4 text-left">Description</th>
                                                                <th className="py-4 text-right">Qty</th>
                                                                <th className="py-4 text-right">Cost (VND)</th>
                                                                <th className="py-4 text-right text-blue-400">Quote (VND)</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-800 font-bold">
                                                            {selectedTrip.quoteItems.map((item, i) => (
                                                                <tr key={i} className="hover:bg-white/5 transition-colors">
                                                                    <td className="py-6">{item.name}</td>
                                                                    <td className="py-6 text-right text-slate-400">{item.qty} {item.unit}</td>
                                                                    <td className="py-6 text-right text-slate-400">{formatVND(item.cost)}</td>
                                                                    <td className="py-6 text-right text-blue-400 font-black">{formatVND(item.price)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                        <tfoot>
                                                            <tr className="border-t border-slate-700 bg-white/5">
                                                                <td colSpan="3" className="py-8 px-4 text-right text-slate-400 font-black uppercase text-xs tracking-widest">Grand Total Profit Check</td>
                                                                <td className="py-8 pr-4 text-right text-3xl font-black text-white italic tracking-tighter">{formatVND(selectedTrip.quoteItems.reduce((a,b)=>a+b.price,0))}</td>
                                                            </tr>
                                                        </tfoot>
                                                    </table>
                                                </div>
                                            ) : (
                                                <div className="p-16 bg-white rounded-[2.5rem] text-center border-2 border-dashed border-slate-100 flex flex-col items-center">
                                                    <div className="p-6 bg-slate-50 rounded-full mb-6"><Icon name="lock" size={60} className="text-slate-200" /></div>
                                                    <h4 className="text-xl font-black text-slate-800 tracking-tight italic uppercase tracking-widest">Security Access Restricted</h4>
                                                    <p className="text-slate-400 font-bold text-sm mt-3 max-w-sm">견적 금액 및 마진 정보는 허창수 법인장님 고유 권한입니다. 예약 정보 및 메모만 확인해 주세요.</p>
                                                </div>
                                            )}

                                            <div className="p-10 bg-slate-50 rounded-[2.5rem] border border-slate-200 shadow-sm space-y-6">
                                                <h4 className="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                                                    <Icon name="message-square" size={16} /> Reservation Master Note
                                                </h4>
                                                <textarea 
                                                    className="w-full bg-white border border-slate-200 rounded-3xl p-6 text-sm font-bold outline-none focus:ring-4 focus:ring-blue-500/10 min-h-[160px] shadow-inner transition-all"
                                                    defaultValue={selectedTrip.staffNote}
                                                    placeholder="가이드 배정 여부, 차량 준비 상태 등을 상세히 입력하세요..."
                                                ></textarea>
                                                <button className="w-full bg-slate-900 text-white py-6 rounded-3xl font-black text-lg shadow-xl shadow-slate-200 active:scale-95 transition-all flex items-center justify-center gap-3">
                                                    <Icon name="save" size={20} />
                                                    업데이트 사항 저장
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [authState, setAuthState] = useState({ isLoggedIn: false, role: null });

            const login = (role) => setAuthState({ isLoggedIn: true, role });
            const logout = () => setAuthState({ isLoggedIn: false, role: null });

            return authState.isLoggedIn ? (
                <MainApp userRole={authState.role} onLogout={logout} />
            ) : (
                <LoginPage onLogin={login} />
            );
        };

        const NavItem = ({ active, icon, label, onClick }) => (
            <button
                onClick={onClick}
                className={`w-full flex items-center gap-4 px-8 py-5 rounded-[2rem] transition-all duration-300 ${
                    active ? 'bg-blue-600 text-white shadow-2xl shadow-blue-600/30 font-black scale-105' : 'text-slate-400 hover:text-slate-100 hover:bg-white/5 font-bold'
                }`}
            >
                <Icon name={icon} size={20} />
                <span className="text-[13px] tracking-tight">{label}</span>
                {active && <div className="ml-auto w-1.5 h-1.5 bg-white rounded-full animate-ping"></div>}
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
