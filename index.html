<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Travel Manager - Integrated System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .excel-input { background: transparent; border: 1px solid transparent; width: 100%; padding: 4px; border-radius: 4px; transition: all 0.2s; }
        .excel-input:hover { border-color: #cbd5e1; background: #f8fafc; }
        .excel-input:focus { border-color: #3b82f6; background: #ffffff; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        .sticky-header th { position: sticky; top: 0; background: #f8fafc; z-index: 10; border-bottom: 2px solid #e2e8f0; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .calendar-day { min-height: 120px; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; }
        }
    </style>
</head>
<body class="bg-[#f1f5f9]">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE]
         * 1. 사용자: 허창수 법인장 (KOSVI)
         * 2. 계정: admin(1234), staff1(1111), staff2(2222)
         * 3. 신규기능:
         * - 캘린더 전용 메뉴 및 클릭 시 일정 이동
         * - 항목별 '예약증빙' 및 '송금증빙' 업로드 (미리보기 지원)
         * - 고객 결제 상태(미입금/완납) 관리
         */

        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const KosviLogo = ({ dark = false }) => (
            <div className="flex items-center gap-3">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center shadow-lg ${dark ? 'bg-slate-900' : 'bg-blue-600'}`}>
                    <svg width="24" height="24" viewBox="0 0 100 100" fill="none">
                        <path d="M20 20L80 80M80 20L20 80" stroke="white" strokeWidth="14" strokeLinecap="round"/>
                        <circle cx="50" cy="50" r="18" fill={dark ? "#1e293b" : "#f8fafc"} stroke="white" strokeWidth="4"/>
                    </svg>
                </div>
                <div className="flex flex-col">
                    <span className={`text-xl font-black leading-none italic ${dark ? 'text-slate-900' : 'text-slate-800'}`}>KOSVI</span>
                    <span className="text-[10px] font-bold text-blue-600 tracking-widest uppercase">Vietnam Travel</span>
                </div>
            </div>
        );

        const getDayOfWeek = (dateString) => {
            if (!dateString) return '';
            const days = ['일(CN)', '월(T2)', '화(T3)', '수(T4)', '목(T5)', '금(T6)', '토(T7)'];
            const date = new Date(dateString);
            return isNaN(date) ? '' : days[date.getDay()];
        };

        const INITIAL_TRIPS = [
            { 
                id: 1, 
                title: '임창호 님 호치민 3박 4일', 
                client: '임창호 님', 
                pax: 3, 
                startDate: '2026-01-13',
                endDate: '2026-01-16',
                exchangeRate: 5.54, 
                targetCurrency: 'KRW',
                status: '진행중',
                paymentStatus: '예약금완납', // 고객 결제 상태
                flightInfo: {
                    in: { flight: 'KE469', route: 'ICN-SGN', depTime: '09:05', arrTime: '12:40' },
                    out: { flight: 'KE470', route: 'SGN-ICN', depTime: '13:55', arrTime: '21:15' }
                },
                items: [
                    { id: 1, date: '2026-01-13', time: '12:40', category: '차량', content: '공항 픽업 및 미팅 (S2)', qty: 1, unit: '회', costVnd: 500000, priceVnd: 800000, booking: '확정', note: '기사 배정 완료', bookingFile: null, paymentFile: null },
                    { id: 2, date: '2026-01-13', time: '15:00', category: '호텔', content: '호텔 체크인 (랜드마크)', qty: 3, unit: '박', costVnd: 3650000, priceVnd: 4500000, booking: '대기', note: '바우처 대기중', bookingFile: null, paymentFile: null },
                    { id: 3, date: '2026-01-14', time: '08:30', category: '골프', content: '트윈도브스 18홀 라운딩', qty: 3, unit: '명', costVnd: 3150000, priceVnd: 4200000, booking: '확정', note: '', bookingFile: null, paymentFile: null }
                ]
            }
        ];

        // 파일 미리보기 모달
        const FilePreview = ({ file, onClose }) => (
            <div className="fixed inset-0 z-[300] bg-black/80 flex items-center justify-center p-10" onClick={onClose}>
                <div className="bg-white rounded-2xl overflow-hidden max-w-4xl max-h-[90vh] relative" onClick={e => e.stopPropagation()}>
                    <button onClick={onClose} className="absolute top-4 right-4 bg-black/50 text-white p-2 rounded-full hover:bg-black/70"><Icon name="x" /></button>
                    {file.type.startsWith('image/') ? (
                        <img src={file.url} alt="Preview" className="max-w-full max-h-[85vh] object-contain" />
                    ) : (
                        <div className="p-20 text-center">
                            <Icon name="file-text" size={64} className="mx-auto text-slate-400 mb-4" />
                            <p className="text-xl font-bold text-slate-700">{file.name}</p>
                            <p className="text-slate-500 mt-2">미리보기가 지원되지 않는 형식입니다.</p>
                        </div>
                    )}
                    <div className="p-4 bg-slate-100 text-center font-bold text-slate-600">
                        {file.name}
                    </div>
                </div>
            </div>
        );

        const MainApp = ({ userRole, onLogout }) => {
            const [viewMode, setViewMode] = useState('list'); 
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [selectedTrip, setSelectedTrip] = useState(null);
            const [showCustomerQuote, setShowCustomerQuote] = useState(false); 
            const [previewFile, setPreviewFile] = useState(null);

            // 환율 계산 함수
            const calculateTotal = (items, type) => items.reduce((acc, item) => acc + (item[type] * item.qty), 0);
            
            const convertCurrency = (vndAmount, rate, currency) => {
                if (currency === 'VND') return vndAmount;
                if (currency === 'USD') return vndAmount / 23500; 
                return vndAmount / rate; 
            };

            const formatMoney = (amount, currency) => {
                return Math.round(amount).toLocaleString(undefined, { maximumFractionDigits: 0 }) + (currency === 'VND' ? ' ₫' : currency === 'KRW' ? ' 원' : ' $');
            };

            const handleAddTrip = () => {
                const newId = Date.now();
                const newTrip = {
                    id: newId,
                    title: '신규 여행 일정',
                    client: '새 고객님',
                    pax: 1,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: new Date().toISOString().split('T')[0],
                    exchangeRate: 1,
                    targetCurrency: 'VND',
                    status: '견적중',
                    paymentStatus: '미입금',
                    flightInfo: { in: { flight: '', route: '', depTime: '', arrTime: '' }, out: { flight: '', route: '', depTime: '', arrTime: '' } },
                    items: [
                        { id: 1, date: new Date().toISOString().split('T')[0], time: '', category: '', content: '', qty: 1, unit: '', costVnd: 0, priceVnd: 0, booking: '미정', note: '', bookingFile: null, paymentFile: null }
                    ]
                };
                setTrips([newTrip, ...trips]);
                setSelectedTrip(newTrip);
            };

            const updateTrip = (updatedTrip) => {
                setTrips(trips.map(t => t.id === updatedTrip.id ? updatedTrip : t));
                setSelectedTrip(updatedTrip);
            };

            const updateFlightInfo = (type, field, value) => {
                setSelectedTrip(prev => ({
                    ...prev,
                    flightInfo: { ...prev.flightInfo, [type]: { ...prev.flightInfo[type], [field]: value } }
                }));
            };

            const handleFileUpload = (itemId, fileType, file) => {
                if (!file) return;
                const fileUrl = URL.createObjectURL(file);
                const fileData = { name: file.name, url: fileUrl, type: file.type };
                
                const newItems = selectedTrip.items.map(item => {
                    if (item.id === itemId) {
                        return { ...item, [fileType]: fileData };
                    }
                    return item;
                });
                updateTrip({ ...selectedTrip, items: newItems });
            };

            // 캘린더 렌더링
            const renderCalendar = () => {
                const year = 2026; const month = 0; // 1월
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();
                const cells = Array(firstDay).fill(null).concat(Array.from({length: daysInMonth}, (_, i) => i + 1));

                return (
                    <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden h-full flex flex-col">
                        <div className="p-6 bg-slate-900 text-white flex justify-between items-center">
                            <h3 className="text-2xl font-black italic">SCHEDULE CALENDAR - JAN 2026</h3>
                            <div className="flex gap-2">
                                <button onClick={() => setViewMode('list')} className="px-4 py-2 bg-white/20 rounded-lg text-sm font-bold hover:bg-white/30">리스트 보기</button>
                            </div>
                        </div>
                        <div className="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-center py-2 text-slate-500 font-bold text-xs">
                            <div className="text-red-500">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div className="text-blue-500">SAT</div>
                        </div>
                        <div className="grid grid-cols-7 flex-1 bg-white overflow-y-auto">
                            {cells.map((day, idx) => {
                                if (!day) return <div key={idx} className="calendar-day bg-slate-50/30"></div>;
                                const dateStr = `2026-01-${String(day).padStart(2, '0')}`;
                                const dayTrips = trips.filter(t => t.startDate <= dateStr && t.endDate >= dateStr);
                                return (
                                    <div key={idx} className="calendar-day p-2 hover:bg-blue-50 transition-colors relative">
                                        <span className={`text-xs font-bold ${idx % 7 === 0 ? 'text-red-400' : idx % 7 === 6 ? 'text-blue-400' : 'text-slate-300'}`}>{day}</span>
                                        <div className="mt-1 space-y-1">
                                            {dayTrips.map(t => (
                                                <div key={t.id} onClick={() => setSelectedTrip({...t})} 
                                                     className={`text-[10px] px-1.5 py-1 rounded font-bold truncate cursor-pointer shadow-sm hover:scale-105 transition-all ${t.status === '확정' ? 'bg-blue-600 text-white' : 'bg-green-500 text-white'}`}>
                                                    {t.client} ({t.pax}명)
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // 손님용 견적서 렌더링 (이전 코드 유지, 생략)
            if (showCustomerQuote && selectedTrip) { /* ... 견적서 코드 ... */ return <div className="fixed inset-0 z-[200] bg-white p-10 overflow-auto"><button onClick={()=>setShowCustomerQuote(false)} className="fixed top-4 right-4 bg-slate-200 px-4 py-2 rounded">닫기</button><div className="text-center font-black text-2xl mt-10">견적서 미리보기 (인쇄 모드)</div></div>; }

            return (
                <div className="flex h-screen bg-[#f1f5f9] text-slate-900 overflow-hidden animate-fade-in no-print">
                    <aside className="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl">
                        <div className="p-6 bg-white"><KosviLogo /></div>
                        <div className="p-6">
                            <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700">
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Signed in as</p>
                                <span className="font-bold text-lg text-blue-400">{userRole.toUpperCase()}</span>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            <button onClick={() => setViewMode('list')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold shadow-lg transition-all ${viewMode === 'list' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}><Icon name="layout-dashboard" /> 현황 리스트</button>
                            <button onClick={() => setViewMode('calendar')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold shadow-lg transition-all ${viewMode === 'calendar' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}><Icon name="calendar" /> 운영 캘린더</button>
                        </nav>
                        <div className="p-6">
                            <button onClick={onLogout} className="w-full py-3 bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2"><Icon name="log-out" size={14} /> 로그아웃</button>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto flex flex-col">
                        <header className="glass-panel sticky top-0 px-8 py-5 flex justify-between items-center z-20 shadow-sm">
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">KOSVI Manager v17.0</h2>
                            {userRole === 'admin' && <button onClick={handleAddTrip} className="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg flex items-center gap-2 hover:bg-slate-800 transition-all"><Icon name="plus" size={16} /> 신규 일정</button>}
                        </header>

                        <div className="p-6 w-full h-full">
                            {viewMode === 'calendar' ? renderCalendar() : (
                                <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden h-full">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left font-bold">
                                            <thead>
                                                <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                                    <th className="px-8 py-5">고객명</th>
                                                    <th className="px-8 py-5">일정 및 항공</th>
                                                    <th className="px-8 py-5 text-center">결제상태</th>
                                                    {userRole === 'admin' && <th className="px-8 py-5 text-right">총 견적</th>}
                                                    <th className="px-8 py-5 text-right">관리</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {trips.map(trip => (
                                                    <tr key={trip.id} className="hover:bg-slate-50 transition-colors">
                                                        <td className="px-8 py-6">
                                                            <p className="text-lg text-slate-800">{trip.client}</p>
                                                            <p className="text-xs text-slate-400">({trip.pax}명)</p>
                                                        </td>
                                                        <td className="px-8 py-6">
                                                            <div className="text-slate-800 text-sm mb-2">{trip.title}</div>
                                                            <div className="flex flex-col gap-1 text-[11px] text-slate-500">
                                                                <div className="flex gap-2"><span className="font-black text-blue-600">IN</span> {trip.flightInfo.in.route} | {trip.flightInfo.in.flight} ({trip.flightInfo.in.arrTime})</div>
                                                                <div className="flex gap-2"><span className="font-black text-orange-600">OUT</span> {trip.flightInfo.out.route} | {trip.flightInfo.out.flight} ({trip.flightInfo.out.depTime})</div>
                                                            </div>
                                                        </td>
                                                        <td className="px-8 py-6 text-center">
                                                            <span className={`px-3 py-1 rounded-full text-xs text-white ${trip.paymentStatus === '완납' ? 'bg-blue-500' : trip.paymentStatus === '예약금완납' ? 'bg-orange-400' : 'bg-red-400'}`}>{trip.paymentStatus}</span>
                                                        </td>
                                                        {userRole === 'admin' && <td className="px-8 py-6 text-right font-black text-lg">{formatMoney(convertCurrency(calculateTotal(trip.items, 'priceVnd'), trip.exchangeRate, trip.targetCurrency), trip.targetCurrency)}</td>}
                                                        <td className="px-8 py-6 text-right"><button onClick={() => setSelectedTrip({...trip})} className="p-3 bg-white border rounded-xl hover:border-blue-500"><Icon name="edit-3" /></button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* 통합 워크시트 모달 */}
                    {selectedTrip && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4 animate-fade-in">
                            <div className="bg-white w-full max-w-[1700px] h-[95vh] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden">
                                <div className="px-10 py-6 bg-slate-900 text-white flex justify-between items-center shrink-0">
                                    <div className="flex gap-6 items-center">
                                        <input className="bg-transparent text-2xl font-black italic outline-none w-64" value={selectedTrip.client} onChange={(e)=>updateTrip({...selectedTrip, client: e.target.value})} />
                                        
                                        {/* 고객 결제 상태 관리 */}
                                        <div className="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-xl">
                                            <span className="text-xs font-bold text-slate-300">고객 결제:</span>
                                            <select className="bg-slate-800 text-sm font-bold border-none outline-none text-white cursor-pointer" value={selectedTrip.paymentStatus} onChange={(e)=>updateTrip({...selectedTrip, paymentStatus: e.target.value})}>
                                                <option value="미입금">미입금 (Unpaid)</option>
                                                <option value="예약금완납">예약금 (Deposit)</option>
                                                <option value="완납">완납 (Paid)</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    {/* 환율 설정 (Admin Only) */}
                                    {userRole === 'admin' && (
                                        <div className="flex items-center gap-4 bg-white/10 px-4 py-2 rounded-xl">
                                            <input type="number" className="bg-transparent border-b w-16 text-center font-bold outline-none" value={selectedTrip.exchangeRate} onChange={(e) => { const newTrip = {...selectedTrip, exchangeRate: parseFloat(e.target.value)}; setSelectedTrip(newTrip); }} />
                                            <select className="bg-slate-800 text-sm font-bold outline-none" value={selectedTrip.targetCurrency} onChange={(e) => setSelectedTrip({...selectedTrip, targetCurrency: e.target.value})}><option value="KRW">KRW</option><option value="USD">USD</option><option value="VND">VND</option></select>
                                            <span className="font-black text-green-400 text-xl ml-4">{formatMoney(convertCurrency(calculateTotal(selectedTrip.items, 'priceVnd'), selectedTrip.exchangeRate, selectedTrip.targetCurrency), selectedTrip.targetCurrency)}</span>
                                        </div>
                                    )}
                                    <div className="flex gap-2">
                                        {userRole === 'admin' && <button onClick={() => setShowCustomerQuote(true)} className="bg-green-600 px-4 py-2 rounded-xl font-bold text-xs flex gap-2"><Icon name="printer" /> 견적서</button>}
                                        <button onClick={() => setSelectedTrip(null)} className="p-2 hover:bg-white/10 rounded-full"><Icon name="x" /></button>
                                    </div>
                                </div>

                                {/* 항공 정보 (생략 - 이전 버전과 동일) */}
                                <div className="bg-slate-800 px-10 py-4 flex gap-8 border-t border-white/5 shrink-0">
                                    <div className="flex gap-4 items-center text-white text-sm w-full">
                                        <span className="text-blue-400 font-bold">IN:</span>
                                        <input className="bg-transparent border-b border-slate-600 w-20 text-center" value={selectedTrip.flightInfo.in.route} onChange={(e)=>updateFlightInfo('in', 'route', e.target.value)} placeholder="ICN-SGN" />
                                        <input className="bg-transparent border-b border-slate-600 w-20 text-center" value={selectedTrip.flightInfo.in.flight} onChange={(e)=>updateFlightInfo('in', 'flight', e.target.value)} placeholder="편명" />
                                        <input className="bg-transparent border-b border-slate-600 w-16 text-center" value={selectedTrip.flightInfo.in.depTime} onChange={(e)=>updateFlightInfo('in', 'depTime', e.target.value)} placeholder="00:00" />
                                        <span>→</span>
                                        <input className="bg-transparent border-b border-slate-600 w-16 text-center" value={selectedTrip.flightInfo.in.arrTime} onChange={(e)=>updateFlightInfo('in', 'arrTime', e.target.value)} placeholder="00:00" />
                                    </div>
                                </div>

                                {/* 통합 엑셀 테이블 */}
                                <div className="flex-1 overflow-auto bg-white p-8">
                                    <table className="w-full text-sm border-collapse">
                                        <thead className="sticky-header text-xs text-slate-500 uppercase tracking-wider font-bold">
                                            <tr>
                                                <th className="p-3 w-28">Date</th>
                                                <th className="p-3 w-20 text-center">Time</th>
                                                <th className="p-3 w-24">Type</th>
                                                <th className="p-3 w-[25%]">Description</th>
                                                <th className="p-3 w-16 text-center">Qty</th>
                                                <th className="p-3 w-16 text-center">Unit</th>
                                                {userRole === 'admin' && <th className="p-3 text-right bg-red-50/50 w-28">Cost(VND)</th>}
                                                {userRole === 'admin' && <th className="p-3 text-right bg-blue-50/50 w-28">Price(VND)</th>}
                                                <th className="p-3 w-24 text-center">Booking</th>
                                                <th className="p-3 w-32 text-center">Evidence</th>
                                                <th className="p-3">Memo</th>
                                                <th className="p-3 w-10"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-bold text-slate-700">
                                            {selectedTrip.items.map((item, idx) => (
                                                <tr key={item.id} className="group hover:bg-slate-50 border-b border-slate-100">
                                                    <td className="p-2"><input className="excel-input" value={item.date} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].date = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input className="excel-input text-center text-blue-600" value={item.time} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].time = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input className="excel-input text-center text-slate-500" value={item.category} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].category = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input className="excel-input" value={item.content} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].content = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input type="number" className="excel-input text-center" value={item.qty} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].qty = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2"><input className="excel-input text-center" value={item.unit} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].unit = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    
                                                    {userRole === 'admin' && (
                                                        <>
                                                            <td className="p-2 bg-red-50/30"><input type="number" className="excel-input text-right text-red-500" value={item.costVnd} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].costVnd = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                            <td className="p-2 bg-blue-50/30"><input type="number" className="excel-input text-right text-blue-600" value={item.priceVnd} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].priceVnd = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                        </>
                                                    )}

                                                    <td className="p-2 text-center">
                                                        <select className="text-[10px] font-black px-2 py-1 rounded border outline-none" value={item.booking} onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].booking = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }}>
                                                            <option>미정</option><option>대기</option><option>확정</option>
                                                        </select>
                                                    </td>

                                                    {/* 증빙 업로드 버튼 (예약/송금) */}
                                                    <td className="p-2 flex justify-center gap-2">
                                                        <label className={`cursor-pointer p-1.5 rounded hover:bg-slate-200 ${item.bookingFile ? 'text-green-500' : 'text-slate-300'}`} title="예약 확정서 업로드">
                                                            <Icon name="file-check" size={16} />
                                                            <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(item.id, 'bookingFile', e.target.files[0])} />
                                                        </label>
                                                        {item.bookingFile && <button onClick={() => setPreviewFile(item.bookingFile)} className="text-xs text-blue-500 underline">보기</button>}
                                                        
                                                        <div className="w-px bg-slate-300 mx-1"></div>

                                                        <label className={`cursor-pointer p-1.5 rounded hover:bg-slate-200 ${item.paymentFile ? 'text-blue-500' : 'text-slate-300'}`} title="송금 확인증 업로드">
                                                            <Icon name="credit-card" size={16} />
                                                            <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(item.id, 'paymentFile', e.target.files[0])} />
                                                        </label>
                                                        {item.paymentFile && <button onClick={() => setPreviewFile(item.paymentFile)} className="text-xs text-blue-500 underline">보기</button>}
                                                    </td>

                                                    <td className="p-2"><input className="excel-input text-xs text-slate-500" value={item.note} placeholder="메모..." onChange={(e)=>{ const newItems = [...selectedTrip.items]; newItems[idx].note = e.target.value; setSelectedTrip({...selectedTrip, items: newItems}); }} /></td>
                                                    <td className="p-2 text-center">{userRole === 'admin' && <button onClick={()=>{ const newItems = selectedTrip.items.filter(i => i.id !== item.id); setSelectedTrip({...selectedTrip, items: newItems}); }} className="text-slate-300 hover:text-red-500"><Icon name="trash-2" size={16} /></button>}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {userRole === 'admin' && <div className="mt-4 text-center"><button onClick={()=>{ const newId=Date.now(); setSelectedTrip({...selectedTrip, items: [...selectedTrip.items, {id:newId, date: selectedTrip.startDate, time:'', category:'', content:'', qty:1, unit:'', costVnd:0, priceVnd:0, booking:'미정', note:'', bookingFile:null, paymentFile:null}]}); }} className="text-xs font-bold bg-slate-100 px-4 py-2 rounded flex items-center gap-2 mx-auto"><Icon name="plus" /> 행 추가</button></div>}
                                </div>
                            </div>
                        </div>
                    )}

                    {previewFile && <FilePreview file={previewFile} onClose={() => setPreviewFile(null)} />}
                </div>
            );
        };

        const App = () => {
            const [authState, setAuthState] = useState({ isLoggedIn: false, role: null });
            const login = (role) => setAuthState({ isLoggedIn: true, role });
            const logout = () => setAuthState({ isLoggedIn: false, role: null });
            return authState.isLoggedIn ? <MainApp userRole={authState.role} onLogout={logout} /> : <LoginPage onLogin={login} />;
        };

        const LoginPage = ({ onLogin }) => {
            const [id, setId] = useState(''); const [pw, setPw] = useState(''); const [error, setError] = useState('');
            const handleLogin = (e) => { e.preventDefault(); if(id==='admin'&&pw==='1234') onLogin('admin'); else if(id==='staff1'&&pw==='1111') onLogin('staff1'); else if(id==='staff2'&&pw==='2222') onLogin('staff2'); else setError('Login Failed'); };
            return <div className="min-h-screen flex items-center justify-center bg-[#f1f5f9]"><div className="bg-white p-12 rounded-3xl shadow-xl w-96"><KosviLogo /><form onSubmit={handleLogin} className="space-y-4 mt-8"><input className="w-full p-4 bg-slate-50 rounded-xl" placeholder="ID" value={id} onChange={e=>setId(e.target.value)} /><input type="password" className="w-full p-4 bg-slate-50 rounded-xl" placeholder="PW" value={pw} onChange={e=>setPw(e.target.value)} /><button className="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">LOGIN</button></form></div></div>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
