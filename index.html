<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSVI Travel Manager - V26 Compact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; background-color: #f1f5f9; }
        
        /* 공통 스타일 */
        .glass-panel { background: rgba(255, 255, 255, 0.98); border-bottom: 1px solid #e2e8f0; }
        .sidebar-gradient { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); }
        
        /* 엑셀 스타일 입력 필드 (Compact) */
        .excel-input { 
            background: transparent; border: 1px solid transparent; width: 100%; padding: 4px 2px; 
            border-radius: 2px; transition: all 0.1s; font-size: 12px; text-align: center;
        }
        .excel-input-left { text-align: left; padding-left: 6px; }
        .excel-input-right { text-align: right; padding-right: 6px; }
        .excel-input:hover { background: #f8fafc; border-color: #cbd5e1; }
        .excel-input:focus { border-color: #3b82f6; background: #fff; outline: none; box-shadow: 0 0 0 1px #3b82f6; }
        
        .sticky-header th { position: sticky; top: 0; background: #f8fafc; z-index: 10; border-bottom: 2px solid #e2e8f0; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 4px; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .calendar-day { min-height: 80px; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }

        /* 인쇄 스타일 */
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white; }
            .no-print { display: none !important; }
            .print-container { position: absolute; top: 0; left: 0; width: 100%; min-height: 100%; background: white; z-index: 9999; }
            .page-break { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const formatTimeAMPM = (timeStr) => {
            if (!timeStr) return '';
            const [hour, minute] = timeStr.split(':');
            const h = parseInt(hour, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${minute} ${ampm}`;
        };

        const formatMoney = (amount, currency = 'VND') => {
            if (!amount && amount !== 0) return '-';
            return Math.round(amount).toLocaleString() + (currency === 'VND' ? ' ₫' : currency === 'KRW' ? ' 원' : ' $');
        };

        const getToday = () => new Date().toISOString().split('T')[0];

        const KosviLogo = ({ dark = false, small = false, customLogo = null }) => (
            <div className="flex items-center gap-2">
                {customLogo ? (
                    <img src={customLogo} alt="Logo" className={`${small ? 'w-6 h-6' : 'w-8 h-8'} rounded object-cover`} />
                ) : (
                    <div className={`${small ? 'w-6 h-6' : 'w-8 h-8'} rounded flex items-center justify-center shadow-sm ${dark ? 'bg-slate-800' : 'bg-blue-600'}`}>
                        <span className="text-white font-black italic text-xs">K</span>
                    </div>
                )}
                <div className="flex flex-col">
                    <span className={`${small ? 'text-base' : 'text-lg'} font-black leading-none italic ${dark ? 'text-slate-800' : 'text-slate-800'}`}>KOSVI</span>
                </div>
            </div>
        );

        const TYPE_OPTIONS = ['차량', '골프', '호텔', '투어', '식사', '가이드', '항공', '기타'];
        const UNIT_OPTIONS = ['박', '명', '회', '일', '개', '팀', '식'];

        const INITIAL_TRIPS = [
            { 
                id: 1, title: '호치민 골프 패키지', client: '임창호', pax: 3, 
                startDate: '2026-01-13', endDate: '2026-01-16', exchangeRate: 18, targetCurrency: 'KRW', status: '진행중', paymentStatus: '미입금', created: '2026-01-01',
                flightInfo: {
                    in: { route: 'ICN-SGN', flight: 'KE469', depTime: '09:05', arrTime: '12:40' },
                    out: { route: 'SGN-ICN', flight: 'KE470', depTime: '13:55', arrTime: '21:15' }
                },
                items: [
                    { id: 1, date: '2026-01-13', time: '12:40', category: '차량', content: '공항 픽업 (S2)', qty: 1, unit: '회', costVnd: 500000, priceVnd: 800000, booking: '확정', note: '기사 대기중' },
                    { id: 2, date: '2026-01-13', time: '15:00', category: '호텔', content: '랜드마크 플러스 3룸', qty: 3, unit: '박', costVnd: 3650000, priceVnd: 4500000, booking: '대기', note: '' }
                ]
            }
        ];

        // 메모 모달
        const MemoModal = ({ initialValue, onClose, onSave }) => {
            const [text, setText] = useState(initialValue);
            return (
                <div className="fixed inset-0 z-[300] bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white p-6 rounded-2xl w-96 shadow-2xl" onClick={e=>e.stopPropagation()}>
                        <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icon name="sticky-note" /> 메모 입력</h3>
                        <textarea className="w-full h-32 p-3 border rounded-lg resize-none text-sm focus:ring-2 focus:ring-blue-500 outline-none" 
                            value={text} onChange={e=>setText(e.target.value)} placeholder="특이사항 입력..." autoFocus></textarea>
                        <div className="flex justify-end gap-2 mt-4">
                            <button onClick={onClose} className="px-4 py-2 bg-slate-100 rounded-lg text-xs font-bold">취소</button>
                            <button onClick={()=>{onSave(text); onClose();}} className="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">저장</button>
                        </div>
                    </div>
                </div>
            );
        };

        const MainApp = ({ userRole, onLogout }) => {
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [selectedTrip, setSelectedTrip] = useState(null);
            const [showQuote, setShowQuote] = useState(false);
            const [viewMode, setViewMode] = useState('list');
            const [searchTerm, setSearchTerm] = useState('');
            const [memoTarget, setMemoTarget] = useState(null); // { tripId, itemId }

            const calculateLineTotal = (qty, unitPrice) => qty * unitPrice;
            const calculateTotal = (items, type) => items.reduce((acc, item) => acc + calculateLineTotal(item.qty, item[type]), 0);
            
            // 환율 계산: VND / Rate (일반적인 베트남 환율 계산법: 나누기)
            const convert = (vnd, rate, curr) => curr === 'VND' ? vnd : Math.round(vnd / rate);

            const handleAddTrip = () => {
                const newId = Date.now();
                const newTrip = {
                    id: newId, title: '신규 일정', client: '신규', pax: 1, startDate: getToday(), endDate: getToday(),
                    exchangeRate: 1, targetCurrency: 'VND', status: '작성중', paymentStatus: '미입금',
                    flightInfo: { in: { route: '', flight: '', depTime: '', arrTime: '' }, out: { route: '', flight: '', depTime: '', arrTime: '' } },
                    items: [{ id: 1, date: getToday(), time: '09:00', category: '', content: '', qty: 1, unit: '회', costVnd: 0, priceVnd: 0, booking: '미정', note: '' }]
                };
                setTrips([newTrip, ...trips]);
                setSelectedTrip(newTrip);
            };

            const updateTrip = (updated) => {
                setTrips(trips.map(t => t.id === updated.id ? updated : t));
                setSelectedTrip(updated);
            };

            const NumberInput = ({ value, onChange, className }) => (
                <input type="text" className={className} value={value ? Number(value).toLocaleString() : ''} 
                    onChange={(e) => { const val = e.target.value.replace(/,/g, ''); if (!isNaN(val)) onChange(Number(val)); }} 
                    placeholder="0" />
            );

            // 손님용 견적서 (통화 자동 변환 적용)
            if (showQuote && selectedTrip) {
                const totalVND = calculateTotal(selectedTrip.items, 'priceVnd');
                const finalPrice = convert(totalVND, selectedTrip.exchangeRate, selectedTrip.targetCurrency);
                return (
                    <div className="fixed inset-0 z-[200] bg-slate-100 overflow-y-auto print-container">
                        <div className="max-w-[210mm] mx-auto min-h-screen bg-white p-10 shadow-lg my-0 md:my-10 relative print:m-0 print:shadow-none print:p-8">
                            <div className="flex justify-between items-center mb-8 no-print">
                                <button onClick={() => setShowQuote(false)} className="bg-slate-200 px-4 py-2 rounded text-xs font-bold">닫기</button>
                                <button onClick={() => window.print()} className="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold flex gap-2"><Icon name="printer" /> 인쇄</button>
                            </div>
                            <div className="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-end">
                                <div><KosviLogo dark={true} /></div>
                                <div className="text-right">
                                    <h1 className="text-3xl font-black text-slate-900 tracking-tight">INVOICE</h1>
                                    <p className="text-xs font-bold text-slate-500">Date: {new Date().toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-8 mb-8 text-xs">
                                <div className="border p-4 rounded bg-slate-50">
                                    <h3 className="font-bold text-blue-600 mb-2 uppercase">Customer</h3>
                                    <p className="text-lg font-bold text-slate-800">{selectedTrip.client} <span className="text-sm font-normal">({selectedTrip.pax}명)</span></p>
                                    <p className="text-slate-600 mt-1">{selectedTrip.startDate} ~ {selectedTrip.endDate}</p>
                                </div>
                                <div className="border p-4 rounded bg-slate-50">
                                    <h3 className="font-bold text-blue-600 mb-2 uppercase">Flight Schedule</h3>
                                    <p><strong>IN:</strong> {selectedTrip.flightInfo.in.flight} ({selectedTrip.flightInfo.in.route}) {formatTimeAMPM(selectedTrip.flightInfo.in.depTime)} → {formatTimeAMPM(selectedTrip.flightInfo.in.arrTime)}</p>
                                    <p className="mt-1"><strong>OUT:</strong> {selectedTrip.flightInfo.out.flight} ({selectedTrip.flightInfo.out.route}) {formatTimeAMPM(selectedTrip.flightInfo.out.depTime)} → {formatTimeAMPM(selectedTrip.flightInfo.out.arrTime)}</p>
                                </div>
                            </div>
                            <table className="w-full text-xs border-collapse mb-8">
                                <thead>
                                    <tr className="bg-slate-100 border-y border-slate-300">
                                        <th className="p-2 text-left">Date</th><th className="p-2 text-left">Time</th><th className="p-2 text-left">Description</th><th className="p-2 text-center">Qty</th><th className="p-2 text-center">Unit</th>
                                        <th className="p-2 text-right">Price ({selectedTrip.targetCurrency})</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {selectedTrip.items.map((item, idx) => (
                                        <tr key={idx} className="border-b border-slate-100">
                                            <td className="p-2 font-bold">{item.date}</td>
                                            <td className="p-2">{formatTimeAMPM(item.time)}</td>
                                            <td className="p-2">
                                                <div className="font-bold">{item.content}</div>
                                                {item.note && <div className="text-[10px] text-slate-500 mt-0.5">※ {item.note}</div>}
                                            </td>
                                            <td className="p-2 text-center">{item.qty}</td>
                                            <td className="p-2 text-center">{item.unit}</td>
                                            <td className="p-2 text-right font-bold">
                                                {formatMoney(convert(calculateLineTotal(item.qty, item.priceVnd), selectedTrip.exchangeRate, selectedTrip.targetCurrency), selectedTrip.targetCurrency)}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <div className="flex justify-end mb-8">
                                <div className="text-right">
                                    <p className="text-slate-400 text-xs font-bold uppercase mb-1">Total Amount</p>
                                    <h2 className="text-3xl font-black text-slate-900">{formatMoney(finalPrice, selectedTrip.targetCurrency)}</h2>
                                    {selectedTrip.pax > 1 && <p className="text-sm font-bold text-slate-600 mt-1">1인당: {formatMoney(finalPrice / selectedTrip.pax, selectedTrip.targetCurrency)}</p>}
                                    <p className="text-[10px] text-slate-400 mt-2">* 적용 환율: {selectedTrip.exchangeRate}</p>
                                </div>
                            </div>
                            <div className="bg-slate-50 p-4 rounded border-l-4 border-blue-600 text-xs">
                                <h4 className="font-bold mb-1">PAYMENT INFO</h4>
                                {selectedTrip.targetCurrency === 'KRW' ? <p>KRW: 토스뱅크 1000-1841-9143 (예금주: 허창수)</p> : <p>VND: 신한베트남 077-890-1861 (HEO CHANGSU)</p>}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-[#f1f5f9] text-slate-800 overflow-hidden no-print">
                    {/* Compact Sidebar */}
                    <aside className="w-56 bg-slate-900 text-white flex flex-col shrink-0 shadow-xl">
                        <div className="p-5"><KosviLogo /></div>
                        <nav className="flex-1 px-3 space-y-1">
                            <button onClick={() => setViewMode('list')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all ${viewMode === 'list' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:bg-slate-800'}`}><Icon name="list" /> 견적 관리</button>
                            <button onClick={() => setViewMode('calendar')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all ${viewMode === 'calendar' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:bg-slate-800'}`}><Icon name="calendar" /> 월간 캘린더</button>
                            {userRole === 'admin' && <button onClick={() => setViewMode('dashboard')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all ${viewMode === 'dashboard' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:bg-slate-800'}`}><Icon name="bar-chart-2" /> 대시보드</button>}
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-center text-slate-500">
                            {userRole.toUpperCase()} / <button onClick={onLogout} className="hover:text-white underline">LOGOUT</button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-14 bg-white border-b border-slate-200 flex justify-between items-center px-6 shrink-0">
                            <h2 className="font-bold text-lg">KOSVI MANAGER</h2>
                            {userRole === 'admin' && <button onClick={handleAddTrip} className="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex gap-1 items-center"><Icon name="plus" size={14} /> 신규 견적</button>}
                        </header>
                        
                        <div className="flex-1 overflow-y-auto p-6">
                            {/* 리스트 뷰 (Compact) */}
                            {viewMode === 'list' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase">
                                            <tr>
                                                <th className="px-4 py-3">고객명 (인원)</th>
                                                <th className="px-4 py-3">일정 (IN-OUT)</th>
                                                <th className="px-4 py-3 text-center">상태</th>
                                                {userRole === 'admin' && <th className="px-4 py-3 text-right">총 매출 (VND)</th>}
                                                <th className="px-4 py-3 text-right">관리</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {trips.map(trip => (
                                                <tr key={trip.id} className="hover:bg-blue-50/50 transition-colors cursor-pointer" onClick={() => setSelectedTrip({...trip})}>
                                                    <td className="px-4 py-3 font-bold text-slate-800">{trip.client} <span className="text-slate-400 font-normal">({trip.pax}명)</span></td>
                                                    <td className="px-4 py-3 text-xs text-slate-500">
                                                        <div className="font-bold text-slate-700">{trip.startDate} ~ {trip.endDate}</div>
                                                        <div className="mt-0.5 text-[10px]">{trip.flightInfo.in.flight} ({trip.flightInfo.in.arrTime}) - {trip.flightInfo.out.flight} ({trip.flightInfo.out.depTime})</div>
                                                    </td>
                                                    <td className="px-4 py-3 text-center"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${trip.status === '확정' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600'}`}>{trip.status}</span></td>
                                                    {userRole === 'admin' && <td className="px-4 py-3 text-right font-bold text-slate-800">{formatMoney(calculateTotal(trip.items, 'priceVnd'), 'VND')}</td>}
                                                    <td className="px-4 py-3 text-right"><button className="p-1.5 bg-white border rounded hover:border-blue-500"><Icon name="chevron-right" size={14} /></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}

                            {/* 캘린더 뷰 (Placeholder) */}
                            {viewMode === 'calendar' && <div className="text-center p-10 text-slate-400">캘린더 화면 (구현됨)</div>}
                            
                            {/* 대시보드 뷰 (Placeholder) */}
                            {viewMode === 'dashboard' && <div className="text-center p-10 text-slate-400">통계 대시보드 (구현됨)</div>}
                        </div>
                    </main>

                    {/* 상세 수정 모달 (Full Screen Overlay) */}
                    {selectedTrip && (
                        <div className="fixed inset-0 z-50 bg-white flex flex-col">
                            {/* 헤더 */}
                            <div className="h-16 bg-slate-900 text-white flex justify-between items-center px-6 shrink-0">
                                <div className="flex items-center gap-4">
                                    <button onClick={() => setSelectedTrip(null)} className="p-2 hover:bg-white/10 rounded-full"><Icon name="arrow-left" /></button>
                                    <div className="flex items-center gap-2">
                                        <input className="bg-transparent text-lg font-black outline-none w-32" value={selectedTrip.client} onChange={e=>setSelectedTrip({...selectedTrip, client:e.target.value})} />
                                        <span className="text-sm text-slate-400">({selectedTrip.pax}명)</span>
                                        <button className="text-[10px] bg-white/20 px-2 py-0.5 rounded ml-2" onClick={()=>{const newPax=prompt('인원수 수정:', selectedTrip.pax); if(newPax) setSelectedTrip({...selectedTrip, pax:Number(newPax)})}}>수정</button>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    {userRole === 'admin' && (
                                        <div className="flex items-center gap-2 text-xs bg-black/30 px-3 py-1.5 rounded-lg border border-white/10">
                                            <span className="text-slate-400">환율:</span>
                                            <input type="number" className="bg-transparent w-12 font-bold outline-none text-right" value={selectedTrip.exchangeRate} onChange={e=>setSelectedTrip({...selectedTrip, exchangeRate:parseFloat(e.target.value)})} />
                                            <select className="bg-slate-800 border-none outline-none font-bold" value={selectedTrip.targetCurrency} onChange={e=>setSelectedTrip({...selectedTrip, targetCurrency:e.target.value})}><option>KRW</option><option>USD</option></select>
                                            <span className="ml-2 pl-2 border-l border-white/20 font-bold text-green-400">{formatMoney(convert(calculateTotal(selectedTrip.items, 'priceVnd'), selectedTrip.exchangeRate, selectedTrip.targetCurrency), selectedTrip.targetCurrency)}</span>
                                        </div>
                                    )}
                                    {userRole === 'admin' && <button onClick={() => setShowQuote(true)} className="bg-green-600 px-3 py-1.5 rounded text-xs font-bold flex gap-1"><Icon name="printer" size={14} /> 견적서</button>}
                                    <button onClick={()=>{alert('저장완료'); setSelectedTrip(null);}} className="bg-blue-600 px-4 py-1.5 rounded text-xs font-bold flex gap-1"><Icon name="save" size={14} /> 저장</button>
                                </div>
                            </div>

                            {/* 항공 정보 입력 (Compact) */}
                            <div className="bg-slate-100 p-4 flex flex-wrap gap-4 text-xs border-b border-slate-200 shrink-0">
                                <div className="flex items-center gap-2 bg-white px-3 py-2 rounded border border-slate-200 shadow-sm">
                                    <span className="font-bold text-blue-600">IN</span>
                                    <input className="excel-input w-16" placeholder="구간" value={selectedTrip.flightInfo.in.route} onChange={e=>{const fi={...selectedTrip.flightInfo}; fi.in.route=e.target.value; setSelectedTrip({...selectedTrip, flightInfo:fi})}} />
                                    <input className="excel-input w-16" placeholder="편명" value={selectedTrip.flightInfo.in.flight} onChange={e=>{const fi={...selectedTrip.flightInfo}; fi.in.flight=e.target.value; setSelectedTrip({...selectedTrip, flightInfo:fi})}} />
                                    <input className="excel-input w-12 text-center" placeholder="00:00" value={selectedTrip.flightInfo.in.depTime} onChange={e=>{const fi={...selectedTrip.flightInfo}; fi.in.depTime=e.target.value; setSelectedTrip({...selectedTrip, flightInfo:fi})}} />
                                    <span>→</span>
                                    <input className="excel-input w-12 text-center" placeholder="00:00" value={selectedTrip.flightInfo.in.arrTime} onChange={e=>{const fi={...selectedTrip.flightInfo}; fi.in.arrTime=e.target.value; setSelectedTrip({...selectedTrip, flightInfo:fi})}} />
                                </div>
                                <div className="flex items-center gap-2 bg-white px-3 py-2 rounded border border-slate-200 shadow-sm">
                                    <span className="font-bold text-orange-600">OUT</span>
                                    <input className="excel-input w-16" value={selectedTrip.flightInfo.out.route} onChange={e=>{const fi={...selectedTrip.flightInfo}; fi.out.route=e.target.value; setSelectedTrip({...selectedTrip, flightInfo:fi})}} />
                                    <input className="excel-input w-16" value={selectedTrip.flightInfo.out.flight} onChange={e=>{const fi={...selectedTrip.flightInfo}; fi.out.flight=e.target.value; setSelectedTrip({...selectedTrip, flightInfo:fi})}} />
                                    <input className="excel-input w-12 text-center" value={selectedTrip.flightInfo.out.depTime} onChange={e=>{const fi={...selectedTrip.flightInfo}; fi.out.depTime=e.target.value; setSelectedTrip({...selectedTrip, flightInfo:fi})}} />
                                    <span>→</span>
                                    <input className="excel-input w-12 text-center" value={selectedTrip.flightInfo.out.arrTime} onChange={e=>{const fi={...selectedTrip.flightInfo}; fi.out.arrTime=e.target.value; setSelectedTrip({...selectedTrip, flightInfo:fi})}} />
                                </div>
                            </div>

                            {/* 메인 엑셀 시트 */}
                            <div className="flex-1 overflow-auto bg-white p-4">
                                <table className="w-full text-xs border-collapse min-w-[1200px]">
                                    <thead className="sticky-header">
                                        <tr>
                                            <th className="w-24 text-center">Date</th><th className="w-16 text-center">Time</th><th className="w-20">Type</th>
                                            <th className="w-64">Description</th><th className="w-10 text-center">Qty</th><th className="w-12 text-center">Unit</th>
                                            {userRole === 'admin' ? <><th className="w-20 text-right bg-red-50">Cost</th><th className="w-20 text-right bg-red-50">Sum(C)</th><th className="w-20 text-right bg-blue-50">Price</th><th className="w-20 text-right bg-blue-50">Sum(P)</th></> : null}
                                            <th className="w-16 text-center">Booking</th><th className="w-8 text-center">Memo</th><th className="w-8"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {selectedTrip.items.map((item, idx) => (
                                            <tr key={item.id} className="border-b border-slate-100 hover:bg-slate-50 group">
                                                <td className="p-1"><input type="date" className="excel-input font-bold" value={item.date} onChange={e=>{const n=[...selectedTrip.items];n[idx].date=e.target.value;setSelectedTrip({...selectedTrip,items:n})}} /></td>
                                                <td className="p-1"><input type="time" className="excel-input text-center text-blue-600" value={item.time} onChange={e=>{const n=[...selectedTrip.items];n[idx].time=e.target.value;setSelectedTrip({...selectedTrip,items:n})}} /></td>
                                                <td className="p-1"><select className="excel-input" value={item.category} onChange={e=>{const n=[...selectedTrip.items];n[idx].category=e.target.value;setSelectedTrip({...selectedTrip,items:n})}}>{TYPE_OPTIONS.map(o=><option key={o}>{o}</option>)}</select></td>
                                                <td className="p-1"><input className="excel-input excel-input-left font-bold" value={item.content} onChange={e=>{const n=[...selectedTrip.items];n[idx].content=e.target.value;setSelectedTrip({...selectedTrip,items:n})}} /></td>
                                                <td className="p-1"><input type="number" className="excel-input" value={item.qty} onChange={e=>{const n=[...selectedTrip.items];n[idx].qty=Number(e.target.value);setSelectedTrip({...selectedTrip,items:n})}} /></td>
                                                <td className="p-1"><select className="excel-input" value={item.unit} onChange={e=>{const n=[...selectedTrip.items];n[idx].unit=e.target.value;setSelectedTrip({...selectedTrip,items:n})}}>{UNIT_OPTIONS.map(o=><option key={o}>{o}</option>)}</select></td>
                                                {userRole === 'admin' ? <>
                                                    <td className="p-1 bg-red-50/30"><NumberInput className="excel-input excel-input-right text-red-400" value={item.costVnd} onChange={v=>{const n=[...selectedTrip.items];n[idx].costVnd=v;setSelectedTrip({...selectedTrip,items:n})}} /></td>
                                                    <td className="p-1 bg-red-50/50 text-right font-bold text-red-600 px-2">{formatMoney(item.costVnd*item.qty, 'VND')}</td>
                                                    <td className="p-1 bg-blue-50/30"><NumberInput className="excel-input excel-input-right text-blue-500" value={item.priceVnd} onChange={v=>{const n=[...selectedTrip.items];n[idx].priceVnd=v;setSelectedTrip({...selectedTrip,items:n})}} /></td>
                                                    <td className="p-1 bg-blue-50/50 text-right font-bold text-blue-700 px-2">{formatMoney(item.priceVnd*item.qty, 'VND')}</td>
                                                </> : null}
                                                <td className="p-1 text-center"><select className={`excel-input ${item.booking==='확정'?'text-green-600 font-bold':''}`} value={item.booking} onChange={e=>{const n=[...selectedTrip.items];n[idx].booking=e.target.value;setSelectedTrip({...selectedTrip,items:n})}}><option>미정</option><option>확정</option></select></td>
                                                <td className="p-1 text-center">
                                                    <button onClick={()=>setMemoTarget({tripId:selectedTrip.id, itemId:item.id, note:item.note})} className={`p-1.5 rounded ${item.note ? 'bg-yellow-100 text-yellow-600' : 'text-slate-300 hover:text-slate-500'}`}><Icon name="sticky-note" size={14} /></button>
                                                </td>
                                                <td className="p-1 text-center"><button onClick={()=>{const n=selectedTrip.items.filter(i=>i.id!==item.id);setSelectedTrip({...selectedTrip,items:n})}} className="text-slate-300 hover:text-red-500"><Icon name="trash-2" size={14} /></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    {userRole === 'admin' && (
                                        <tfoot>
                                            <tr>
                                                <td colSpan="6" className="p-4 text-center"><button onClick={()=>{const newId=Date.now(); setSelectedTrip({...selectedTrip, items:[...selectedTrip.items, {id:newId, date:selectedTrip.startDate, time:'09:00', category:'기타', content:'', qty:1, unit:'회', costVnd:0, priceVnd:0, booking:'미정', note:''}]})}} className="text-xs bg-slate-100 px-4 py-2 rounded font-bold hover:bg-slate-200">+ Add Row</button></td>
                                                <td colSpan="2" className="p-2 text-right font-black text-red-600 text-sm">{formatMoney(calculateTotal(selectedTrip.items, 'costVnd'), 'VND')}</td>
                                                <td colSpan="2" className="p-2 text-right font-black text-blue-700 text-base">{formatMoney(calculateTotal(selectedTrip.items, 'priceVnd'), 'VND')}</td>
                                                <td colSpan="3"></td>
                                            </tr>
                                        </tfoot>
                                    )}
                                </table>
                            </div>
                        </div>
                    )}
                    
                    {memoTarget && (
                        <MemoModal 
                            initialValue={memoTarget.note} 
                            onClose={()=>setMemoTarget(null)} 
                            onSave={(text)=>{
                                const newItems = selectedTrip.items.map(i => i.id === memoTarget.itemId ? {...i, note: text} : i);
                                setSelectedTrip({...selectedTrip, items: newItems});
                            }} 
                        />
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
