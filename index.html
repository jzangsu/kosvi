<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Travel Manager - Vietnam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .ceo-card { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f4f7fa]">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE - Gemini 전용 기억 저장소]
         * ---------------------------------------------------------
         * 1. 사용자 정보: 허창수 법인장 (CEO, KOSVI Travel)
         * 2. 프로젝트: KOSVI 여행사 통합 관리 시스템 (v4.0 - 엑셀 데이터 완전 반영)
         * 3. 핵심 규칙:
         * - 반드시 '루트 폴더'의 index.html 하나로만 배포함.
         * - 권한 분리: 법인장(CEO)은 원가/환율/수익 확인, 직원(Staff)은 항공/예약 현황만 관리.
         * - 데이터 구조: 엑셀 양식(KE469/470, 환율 5.5386, Twin Doves Golf 등) 반영.
         * 4. 배포 정보: kosvi-travel / FIREBASE_SERVICE_ACCOUNT_KOSVI_TRAVEL
         * ---------------------------------------------------------
         */

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // KOSVI 공식 스타일 로고
        const KosviLogo = ({ className = "" }) => (
            <div className={`flex items-center gap-3 ${className}`}>
                <div className="relative">
                    <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/40">
                        <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 20L80 80M80 20L20 80" stroke="white" strokeWidth="12" strokeLinecap="round"/>
                            <circle cx="50" cy="50" r="15" fill="#f8fafc" stroke="white" strokeWidth="4"/>
                        </svg>
                    </div>
                </div>
                <div className="flex flex-col">
                    <span className="text-xl font-black text-slate-800 leading-none">KOSVI</span>
                    <span className="text-[10px] font-extrabold text-blue-600 tracking-[0.25em] leading-tight uppercase">Travel & Logistics</span>
                </div>
            </div>
        );

        // 엑셀 자료 데이터 반영
        const INITIAL_TRIPS = [
            { 
                id: 1, 
                title: '임창호 님 호치민 3박 4일 패키지', 
                client: '임창호 님', 
                pax: 3, 
                date: '2024-03-13 ~ 03-16',
                flightIn: 'KE469 (ICN-SGN) 12:40 도착',
                flightOut: 'KE470 (SGN-ICN) 13:55 출발',
                exchangeRate: 5.5386, 
                items: [
                    { name: 'S2 차량 (6일분)', cost: 3354600, price: 6300000, qty: 6 },
                    { name: 'Twin Doves Golf', cost: 6300000, price: 8500000, qty: 2 },
                    { name: 'Hotel (Landmark Plus)', cost: 10950000, price: 13687500, qty: 3 }
                ],
                status: '견적완료',
                bookingStatus: '확정',
                staffNote: '대한항공 KE469편 수하물 확인 완료. 트윈도브스 골프 예약 확정.'
            }
        ];

        const App = () => {
            const [userRole, setUserRole] = useState('ceo'); 
            const [activeTab, setActiveTab] = useState('dashboard');
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedTrip, setSelectedTrip] = useState(null);

            const summary = useMemo(() => {
                let rev = 0, cost = 0;
                trips.forEach(t => t.items.forEach(i => { rev += i.price; cost += i.cost; }));
                return { rev, cost, profit: rev - cost };
            }, [trips]);

            return (
                <div className="flex h-screen bg-[#f8fafc] text-slate-900 overflow-hidden">
                    <aside className="w-80 sidebar-gradient text-white flex flex-col shrink-0 z-30 shadow-2xl">
                        <div className="p-8 bg-white mb-4"><KosviLogo /></div>
                        <div className="px-6 py-4">
                            <div className="flex p-1 bg-slate-800 rounded-2xl border border-slate-700">
                                <button onClick={() => setUserRole('ceo')} className={`flex-1 py-2 text-xs font-black rounded-xl ${userRole === 'ceo' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>CEO</button>
                                <button onClick={() => setUserRole('staff')} className={`flex-1 py-2 text-xs font-black rounded-xl ${userRole === 'staff' ? 'bg-green-600 text-white' : 'text-slate-500'}`}>Staff</button>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 py-4 space-y-1">
                            <NavItem active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon="layout-dashboard" label="비즈니스 요약" />
                            <NavItem active={activeTab === 'trips'} onClick={() => setActiveTab('trips')} icon="briefcase" label="예약 및 일정 관리" />
                        </nav>
                        <div className="p-6 border-t border-slate-800 text-center">
                            <p className="text-xs text-slate-500 font-bold tracking-widest uppercase">Admin: {userRole === 'ceo' ? '허창수 법인장' : '예약 담당자'}</p>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto flex flex-col">
                        <header className="glass-panel sticky top-0 px-10 py-6 flex justify-between items-center z-20">
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">KOSVI Manager Dashboard</h2>
                            <div className="flex items-center gap-4">
                                <input 
                                    type="text" 
                                    placeholder="고객명 검색..." 
                                    className="pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm outline-none w-64"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                                <button className="bg-slate-900 text-white p-2 rounded-xl"><Icon name="plus" /></button>
                            </div>
                        </header>

                        <div className="p-10 space-y-10 max-w-7xl mx-auto w-full">
                            {activeTab === 'dashboard' && (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="ceo-card p-8 rounded-[2.5rem] shadow-xl">
                                        <p className="text-blue-100 text-xs font-bold uppercase tracking-widest">Total Revenue</p>
                                        <h3 className="text-4xl font-black mt-2">{userRole === 'ceo' ? `₩${(summary.rev / 10000).toLocaleString()}만` : '₩**,***,***'}</h3>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Active Trips</p>
                                        <h3 className="text-4xl font-black mt-2 text-slate-800">{trips.length}팀</h3>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Profit Margin</p>
                                        <h3 className="text-4xl font-black mt-2 text-green-600">{userRole === 'ceo' ? `₩${(summary.profit / 10000).toLocaleString()}만` : '보안'}</h3>
                                    </div>
                                </div>
                            )}

                            <div className="bg-white rounded-[3rem] border border-slate-200 shadow-sm overflow-hidden">
                                <div className="px-10 py-8 border-b border-slate-100 flex justify-between items-center">
                                    <h3 className="text-xl font-black text-slate-800 tracking-tight italic underline decoration-blue-500 underline-offset-8">Reservation List</h3>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="text-slate-400 text-[11px] font-black uppercase tracking-widest border-b border-slate-100">
                                                <th className="px-10 py-6">Customer & Schedule</th>
                                                <th className="px-10 py-6">Flight Details</th>
                                                <th className="px-10 py-6 text-center">Status</th>
                                                <th className="px-10 py-6 text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {trips.map(trip => (
                                                <tr key={trip.id} className="group hover:bg-slate-50 transition-all">
                                                    <td className="px-10 py-8 font-black text-slate-900 text-lg">
                                                        {trip.client} <span className="text-xs font-bold text-slate-400">({trip.pax}인)</span>
                                                        <p className="text-xs text-blue-600 font-bold mt-1 uppercase tracking-wider">{trip.date}</p>
                                                    </td>
                                                    <td className="px-10 py-8">
                                                        <div className="text-xs font-bold text-slate-600 bg-blue-50 px-2 py-1 rounded-lg w-fit mb-1">{trip.flightIn}</div>
                                                        <div className="text-xs font-bold text-slate-400 px-2 py-1">{trip.flightOut}</div>
                                                    </td>
                                                    <td className="px-10 py-8 text-center">
                                                        <span className="bg-green-100 text-green-700 px-4 py-1.5 rounded-full text-[11px] font-black tracking-wider">{trip.bookingStatus}</span>
                                                    </td>
                                                    <td className="px-10 py-8 text-right">
                                                        <button onClick={() => setSelectedTrip(trip)} className="p-3 bg-slate-100 rounded-2xl hover:bg-blue-600 hover:text-white transition-all"><Icon name="settings-2" /></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>

                    {selectedTrip && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-end bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white w-[800px] h-full shadow-2xl p-12 overflow-y-auto animate-in slide-in-from-right duration-500">
                                <div className="flex justify-between items-center mb-10">
                                    <h3 className="text-3xl font-black text-slate-900">{selectedTrip.client} Detail</h3>
                                    <button onClick={() => setSelectedTrip(null)} className="p-4 bg-slate-100 rounded-2xl"><Icon name="x" /></button>
                                </div>

                                <div className="space-y-12">
                                    {userRole === 'ceo' ? (
                                        <div className="space-y-6">
                                            <h4 className="text-lg font-black text-slate-800">Cost Breakdown (Rate: {selectedTrip.exchangeRate})</h4>
                                            <div className="bg-slate-900 rounded-[2rem] p-8 text-white">
                                                <table className="w-full text-sm">
                                                    <thead className="text-slate-500 border-b border-slate-800">
                                                        <tr><th className="py-4 text-left">항목</th><th className="py-4 text-right">원가</th><th className="py-4 text-right">견적</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-800 font-bold">
                                                        {selectedTrip.items.map((i, idx) => (
                                                            <tr key={idx}><td className="py-5">{i.name}</td><td className="py-5 text-right">₩{(i.cost/10000).toLocaleString()}만</td><td className="py-5 text-right text-blue-400">₩{(i.price/10000).toLocaleString()}만</td></tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="p-10 bg-blue-50 rounded-[2rem] text-center font-bold text-blue-600">금액 정보는 법인장님만 열람 가능합니다.</div>
                                    )}

                                    <div className="space-y-6">
                                        <h4 className="text-lg font-black text-slate-800">Reservation Notes (Staff Update)</h4>
                                        <textarea className="w-full p-6 bg-slate-50 border border-slate-200 rounded-[2rem] text-sm font-bold h-40 outline-none" defaultValue={selectedTrip.staffNote}></textarea>
                                        <button onClick={() => setSelectedTrip(null)} className="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black text-lg">Update Records</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const NavItem = ({ active, icon, label, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-4 px-8 py-5 rounded-[1.5rem] transition-all ${active ? 'bg-blue-600 text-white shadow-xl' : 'text-slate-400 hover:bg-white/5'}`}>
                <Icon name={icon} /> <span className="text-sm font-bold tracking-tight">{label}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
