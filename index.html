<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Travel Manager - Vietnam Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 엑셀 스타일 입력 필드 */
        .excel-input { 
            background: transparent; 
            border: 1px solid transparent; 
            width: 100%; 
            padding: 6px; 
            border-radius: 4px; 
            transition: all 0.2s;
        }
        .excel-input:hover { border-color: #cbd5e1; background: #f8fafc; }
        .excel-input:focus { border-color: #3b82f6; background: #ffffff; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        .sticky-header th { position: sticky; top: 0; background: #f8fafc; z-index: 10; border-bottom: 2px solid #e2e8f0; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .calendar-day { min-height: 100px; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        
        /* 인쇄 전용 스타일 */
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { 
                position: fixed; 
                top: 0; 
                left: 0; 
                width: 100%; 
                height: 100%; 
                background: white; 
                z-index: 9999; 
                overflow: visible;
            }
        }
    </style>
</head>
<body class="bg-[#f1f5f9]">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE]
         * 1. 사용자: 허창수 법인장 (KOSVI)
         * 2. 계정: admin(1234), staff1(1111), staff2(2222)
         * 3. 핵심: 일정+견적 통합, 천단위 콤마, 검색, 대시보드, 리마인더
         */

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const KosviLogo = ({ dark = false }) => (
            <div className="flex items-center gap-3">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center shadow-lg ${dark ? 'bg-slate-900' : 'bg-blue-600'}`}>
                    <svg width="24" height="24" viewBox="0 0 100 100" fill="none">
                        <path d="M20 20L80 80M80 20L20 80" stroke="white" strokeWidth="14" strokeLinecap="round"/>
                        <circle cx="50" cy="50" r="18" fill={dark ? "#1e293b" : "#f8fafc"} stroke="white" strokeWidth="4"/>
                    </svg>
                </div>
                <div className="flex flex-col">
                    <span className={`text-xl font-black leading-none italic ${dark ? 'text-slate-900' : 'text-slate-800'}`}>KOSVI</span>
                    <span className="text-[10px] font-bold text-blue-600 tracking-widest uppercase">Vietnam Travel</span>
                </div>
            </div>
        );

        // 숫자 콤마 포맷터 컴포넌트
        const NumberInput = ({ value, onChange, className, placeholder, readOnly }) => {
            const handleChange = (e) => {
                const rawValue = e.target.value.replace(/,/g, '');
                if (!isNaN(rawValue)) {
                    onChange(rawValue === '' ? 0 : Number(rawValue));
                }
            };
            return (
                <input
                    type="text"
                    className={className}
                    value={value ? Number(value).toLocaleString() : ''}
                    onChange={handleChange}
                    placeholder={placeholder}
                    readOnly={readOnly}
                />
            );
        };

        const getDayOfWeek = (dateString) => {
            if (!dateString) return '';
            const days = ['일(CN)', '월(T2)', '화(T3)', '수(T4)', '목(T5)', '금(T6)', '토(T7)'];
            const date = new Date(dateString);
            return isNaN(date) ? '' : days[date.getDay()];
        };

        const INITIAL_TRIPS = [
            { 
                id: 1, 
                title: '임창호 님 호치민 3박 4일', 
                client: '임창호 님', 
                pax: 3, 
                startDate: '2026-01-13',
                endDate: '2026-01-16',
                exchangeRate: 5.54, 
                targetCurrency: 'KRW',
                status: '진행중',
                paymentStatus: '미입금', // 고객 미입금 상태 (리마인더용)
                flightInfo: {
                    in: { flight: 'KE469', route: 'ICN-SGN', depTime: '09:05', arrTime: '12:40' },
                    out: { flight: 'KE470', route: 'SGN-ICN', depTime: '13:55', arrTime: '21:15' }
                },
                items: [
                    { id: 1, date: '2026-01-13', time: '12:40', category: '차량', content: '공항 픽업 및 미팅 (S2)', qty: 1, unit: '회', costVnd: 500000, priceVnd: 800000, booking: '확정', supplierStatus: '미지급', note: '기사 배정 완료', bookingFile: null, paymentFile: null },
                    { id: 2, date: '2026-01-13', time: '15:00', category: '호텔', content: '호텔 체크인 (랜드마크)', qty: 3, unit: '박', costVnd: 3650000, priceVnd: 4500000, booking: '대기', supplierStatus: '미지급', note: '바우처 대기중', bookingFile: null, paymentFile: null },
                    { id: 3, date: '2026-01-14', time: '08:30', category: '골프', content: '트윈도브스 18홀 라운딩', qty: 3, unit: '명', costVnd: 3150000, priceVnd: 4200000, booking: '확정', supplierStatus: '지급완료', note: '', bookingFile: null, paymentFile: null }
                ]
            }
        ];

        const MainApp = ({ userRole, onLogout }) => {
            const [viewMode, setViewMode] = useState('list'); // list, calendar, dashboard
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [selectedTrip, setSelectedTrip] = useState(null);
            const [showCustomerQuote, setShowCustomerQuote] = useState(false); 
            const [previewFile, setPreviewFile] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            // 통계 및 리마인더 계산
            const stats = useMemo(() => {
                let totalRev = 0;
                let pendingPaymentCount = 0; // 고객 미입금
                let pendingSupplierCount = 0; // 매입처 미지급

                trips.forEach(trip => {
                    const tripRev = trip.items.reduce((acc, i) => acc + (i.priceVnd * i.qty), 0);
                    totalRev += tripRev;
                    if (trip.paymentStatus !== '완납') pendingPaymentCount++;
                    trip.items.forEach(item => {
                        if (item.costVnd > 0 && item.supplierStatus !== '지급완료') pendingSupplierCount++;
                    });
                });

                return { totalRev, pendingPaymentCount, pendingSupplierCount, totalTrips: trips.length };
            }, [trips]);

            // 검색 필터링
            const filteredTrips = trips.filter(trip => 
                trip.client.includes(searchTerm) || trip.title.includes(searchTerm)
            );

            // 환율 계산 함수
            const calculateTotal = (items, type) => items.reduce((acc, item) => acc + (item[type] * item.qty), 0);
            const convertCurrency = (vndAmount, rate, currency) => {
                if (currency === 'VND') return vndAmount;
                if (currency === 'USD') return vndAmount / 23500; 
                return vndAmount / rate; 
            };
            const formatMoney = (amount, currency) => {
                return Math.round(amount).toLocaleString(undefined, { maximumFractionDigits: 0 }) + (currency === 'VND' ? ' ₫' : currency === 'KRW' ? ' 원' : ' $');
            };

            const handleAddTrip = () => {
                const newId = Date.now();
                const newTrip = {
                    id: newId,
                    title: '신규 일정',
                    client: '신규 고객',
                    pax: 1,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: new Date().toISOString().split('T')[0],
                    exchangeRate: 1,
                    targetCurrency: 'VND',
                    status: '견적중',
                    paymentStatus: '미입금',
                    flightInfo: { in: { flight: '', route: '', depTime: '', arrTime: '' }, out: { flight: '', route: '', depTime: '', arrTime: '' } },
                    items: [
                        { id: 1, date: new Date().toISOString().split('T')[0], time: '', category: '', content: '', qty: 1, unit: '', costVnd: 0, priceVnd: 0, booking: '미정', supplierStatus: '미지급', note: '', bookingFile: null, paymentFile: null }
                    ]
                };
                setTrips([newTrip, ...trips]);
                setSelectedTrip(newTrip);
            };

            const updateTrip = (updatedTrip) => {
                setTrips(trips.map(t => t.id === updatedTrip.id ? updatedTrip : t));
                setSelectedTrip(updatedTrip);
            };

            const updateFlightInfo = (type, field, value) => {
                setSelectedTrip(prev => ({
                    ...prev,
                    flightInfo: { ...prev.flightInfo, [type]: { ...prev.flightInfo[type], [field]: value } }
                }));
            };

            const handleFileUpload = (itemId, fileType, file) => {
                if (!file) return;
                const fileUrl = URL.createObjectURL(file);
                const fileData = { name: file.name, url: fileUrl, type: file.type };
                
                const newItems = selectedTrip.items.map(item => {
                    if (item.id === itemId) return { ...item, [fileType]: fileData };
                    return item;
                });
                updateTrip({ ...selectedTrip, items: newItems });
            };

            // 대시보드 뷰
            const renderDashboard = () => (
                <div className="space-y-8 animate-fade-in">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="ceo-card p-8 rounded-[2.5rem] shadow-xl relative overflow-hidden">
                            <p className="text-blue-100 text-xs font-bold uppercase tracking-widest">Total Active Revenue</p>
                            <h3 className="text-3xl font-black mt-2 text-white">{userRole === 'admin' ? stats.totalRev.toLocaleString() + ' ₫' : '***'}</h3>
                            <Icon name="trending-up" className="absolute -bottom-4 -right-4 text-white/10" size={100} />
                        </div>
                        <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                            <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Total Trips</p>
                            <h3 className="text-3xl font-black mt-2 text-slate-800">{stats.totalTrips} 건</h3>
                        </div>
                        <div className={`p-8 rounded-[2.5rem] shadow-sm border ${stats.pendingPaymentCount > 0 ? 'bg-red-50 border-red-100' : 'bg-white border-slate-200'}`}>
                            <p className={`${stats.pendingPaymentCount > 0 ? 'text-red-500' : 'text-slate-400'} text-xs font-bold uppercase tracking-widest flex items-center gap-2`}>
                                {stats.pendingPaymentCount > 0 && <Icon name="alert-circle" size={14} />} 고객 미입금 (Reminder)
                            </p>
                            <h3 className={`text-3xl font-black mt-2 ${stats.pendingPaymentCount > 0 ? 'text-red-600' : 'text-slate-800'}`}>{stats.pendingPaymentCount} 건</h3>
                        </div>
                        <div className={`p-8 rounded-[2.5rem] shadow-sm border ${stats.pendingSupplierCount > 0 ? 'bg-orange-50 border-orange-100' : 'bg-white border-slate-200'}`}>
                            <p className={`${stats.pendingSupplierCount > 0 ? 'text-orange-500' : 'text-slate-400'} text-xs font-bold uppercase tracking-widest flex items-center gap-2`}>
                                {stats.pendingSupplierCount > 0 && <Icon name="alert-triangle" size={14} />} 매입처 미송금 (Reminder)
                            </p>
                            <h3 className={`text-3xl font-black mt-2 ${stats.pendingSupplierCount > 0 ? 'text-orange-600' : 'text-slate-800'}`}>{stats.pendingSupplierCount} 건</h3>
                        </div>
                    </div>

                    {/* 리마인더 리스트 */}
                    {(stats.pendingPaymentCount > 0 || stats.pendingSupplierCount > 0) && (
                        <div className="bg-white rounded-[2rem] border border-red-100 shadow-lg p-8">
                            <h4 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                                <Icon name="bell" className="text-red-500" /> Action Required (Reminders)
                            </h4>
                            <div className="space-y-2">
                                {trips.filter(t => t.paymentStatus !== '완납').map(t => (
                                    <div key={t.id} onClick={() => setSelectedTrip(t)} className="flex items-center justify-between p-4 bg-red-50 rounded-xl cursor-pointer hover:bg-red-100 transition-colors">
                                        <div className="flex items-center gap-3">
                                            <span className="bg-red-200 text-red-700 px-2 py-1 rounded text-xs font-black">고객 미수금</span>
                                            <span className="font-bold text-slate-700">{t.client}</span>
                                            <span className="text-xs text-slate-500">({t.title})</span>
                                        </div>
                                        <span className="text-red-600 font-bold text-xs">결제상태: {t.paymentStatus} &gt;</span>
                                    </div>
                                ))}
                                {trips.filter(t => t.items.some(i => i.costVnd > 0 && i.supplierStatus !== '지급완료')).map(t => (
                                    <div key={t.id + '_sup'} onClick={() => setSelectedTrip(t)} className="flex items-center justify-between p-4 bg-orange-50 rounded-xl cursor-pointer hover:bg-orange-100 transition-colors">
                                        <div className="flex items-center gap-3">
                                            <span className="bg-orange-200 text-orange-700 px-2 py-1 rounded text-xs font-black">매입처 미지급</span>
                                            <span className="font-bold text-slate-700">{t.client}</span>
                                            <span className="text-xs text-slate-500">({t.items.filter(i => i.supplierStatus !== '지급완료').length}건 미지급)</span>
                                        </div>
                                        <span className="text-orange-600 font-bold text-xs">확인하기 &gt;</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );

            // 캘린더 렌더링
            const renderCalendar = () => {
                const year = 2026; const month = 0; // 1월
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();
                const cells = Array(firstDay).fill(null).concat(Array.from({length: daysInMonth}, (_, i) => i + 1));

                return (
                    <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden h-full flex flex-col">
                        <div className="p-6 bg-slate-900 text-white flex justify-between items-center">
                            <h3 className="text-2xl font-black italic">SCHEDULE CALENDAR - JAN 2026</h3>
                        </div>
                        <div className="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-center py-2 text-slate-500 font-bold text-xs">
                            <div className="text-red-500">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div className="text-blue-500">SAT</div>
                        </div>
                        <div className="grid grid-cols-7 flex-1 bg-white overflow-y-auto">
                            {cells.map((day, idx) => {
                                if (!day) return <div key={idx} className="calendar-day bg-slate-50/30"></div>;
                                const dateStr = `2026-01-${String(day).padStart(2, '0')}`;
                                const dayTrips = trips.filter(t => t.startDate <= dateStr && t.endDate >= dateStr);
                                return (
                                    <div key={idx} className="calendar-day p-2 hover:bg-blue-50 transition-colors relative">
                                        <span className={`text-xs font-bold ${idx % 7 === 0 ? 'text-red-400' : idx % 7 === 6 ? 'text-blue-400' : 'text-slate-300'}`}>{day}</span>
                                        <div className="mt-1 space-y-1">
                                            {dayTrips.map(t => (
                                                <div key={t.id} onClick={() => setSelectedTrip({...t})} 
                                                     className={`text-[10px] px-1.5 py-1 rounded font-bold truncate cursor-pointer shadow-sm hover:scale-105 transition-all ${t.status === '확정' ? 'bg-blue-600 text-white' : 'bg-green-500 text-white'}`}>
                                                    {t.client} ({t.pax}명)
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // 손님용 견적서 렌더링
            if (showCustomerQuote && selectedTrip) {
                const totalVND = calculateTotal(selectedTrip.items, 'priceVnd');
                const finalPrice = convertCurrency(totalVND, selectedTrip.exchangeRate, selectedTrip.targetCurrency);
                
                return (
                    <div className="fixed inset-0 z-[200] bg-white overflow-y-auto print-container animate-fade-in">
                        <div className="max-w-[210mm] mx-auto min-h-screen bg-white p-12 shadow-2xl my-10 relative print:shadow-none print:m-0 print:p-0">
                            <div className="absolute top-4 right-4 flex gap-2 no-print">
                                <button onClick={() => window.print()} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-lg"><Icon name="printer" /> 인쇄/PDF 저장</button>
                                <button onClick={() => setShowCustomerQuote(false)} className="bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-200">닫기</button>
                            </div>

                            <div className="flex justify-between items-end border-b-4 border-blue-600 pb-8 mb-10">
                                <div><KosviLogo dark={true} /><p className="text-slate-500 text-sm font-medium mt-2">여행 견적서 (Quotation)</p></div>
                                <div className="text-right">
                                    <h1 className="text-4xl font-black text-slate-800 uppercase tracking-tighter mb-1">INVOICE & ITINERARY</h1>
                                    <p className="text-sm font-bold text-slate-500">Date: {new Date().toLocaleDateString()}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-8 mb-12">
                                <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                    <h3 className="text-blue-600 font-black text-xs uppercase tracking-widest mb-4">Customer Details</h3>
                                    <div className="space-y-3 text-sm font-bold text-slate-700">
                                        <div className="flex justify-between border-b border-slate-200 pb-2"><span>고객명 (Client)</span> <span>{selectedTrip.client} 님 (외 {selectedTrip.pax - 1}명)</span></div>
                                        <div className="flex justify-between border-b border-slate-200 pb-2"><span>기간 (Period)</span> <span>{selectedTrip.startDate} ~ {selectedTrip.endDate}</span></div>
                                        <div className="flex justify-between"><span>인원 (Pax)</span> <span>{selectedTrip.pax} 명</span></div>
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                    <h3 className="text-blue-600 font-black text-xs uppercase tracking-widest mb-4">Flight Information</h3>
                                    <div className="space-y-3 text-sm font-bold text-slate-700">
                                        <div className="flex justify-between border-b border-slate-200 pb-2">
                                            <span className="bg-blue-100 text-blue-600 px-2 py-0.5 rounded text-xs mr-2">IN</span>
                                            <span>{selectedTrip.flightInfo.in.route} | {selectedTrip.flightInfo.in.flight} ({selectedTrip.flightInfo.in.arrTime} 도착)</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="bg-orange-100 text-orange-600 px-2 py-0.5 rounded text-xs mr-2">OUT</span>
                                            <span>{selectedTrip.flightInfo.out.route} | {selectedTrip.flightInfo.out.flight} ({selectedTrip.flightInfo.out.depTime} 출발)</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="mb-12">
                                <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-2"><Icon name="calendar-days" size={20} className="text-blue-600" /> 상세 일정 및 포함 내역</h3>
                                <table className="w-full text-sm text-left border-collapse rounded-2xl shadow-sm border border-slate-200">
                                    <thead>
                                        <tr className="bg-slate-900 text-white uppercase text-[11px] font-black tracking-widest">
                                            <th className="p-4 w-32">Date</th>
                                            <th className="p-4 w-20 text-center">Time</th>
                                            <th className="p-4">Description (Itinerary)</th>
                                            <th className="p-4 text-center w-16">Qty</th>
                                            <th className="p-4 text-center w-16">Unit</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-slate-700 font-bold">
                                        {selectedTrip.items.map((item, idx) => (
                                            <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50">
                                                <td className="p-4 bg-slate-50/50">
                                                    <div className="text-slate-900">{item.date}</div>
                                                    <div className="text-[10px] text-slate-400 font-medium">({getDayOfWeek(item.date)})</div>
                                                </td>
                                                <td className="p-4 text-center text-blue-600 font-black">{item.time || '-'}</td>
                                                <td className="p-4"><span className="text-slate-800">{item.content}</span><span className="ml-2 text-[10px] bg-slate-200 px-2 py-0.5 rounded text-slate-500 uppercase">{item.category}</span></td>
                                                <td className="p-4 text-center">{item.qty}</td>
                                                <td className="p-4 text-center text-slate-400">{item.unit}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <div className="flex justify-end mb-16">
                                <div className="w-1/2 bg-blue-600 text-white p-10 rounded-[3rem] shadow-2xl text-right relative overflow-hidden">
                                    <div className="absolute top-0 left-0 p-8 opacity-10"><Icon name="check-circle-2" size={120} /></div>
                                    <p className="text-blue-200 text-xs font-black uppercase tracking-widest mb-2">Final Total Amount (VAT Included)</p>
                                    <h2 className="text-5xl font-black tracking-tighter underline underline-offset-8 decoration-white/20 italic">{formatMoney(finalPrice, selectedTrip.targetCurrency)}</h2>
