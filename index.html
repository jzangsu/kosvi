<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSVI Travel Manager - V26 (Auto Save)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; background-color: #f8fafc; }
        
        /* 모바일 최적화 및 공통 스타일 */
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #334155 100%); }
        
        /* 엑셀 스타일 입력 필드 */
        .excel-input { 
            background: transparent; border: 1px solid transparent; width: 100%; padding: 6px 8px; 
            border-radius: 4px; transition: all 0.2s; font-size: 13px;
        }
        .excel-input:hover { border-color: #e2e8f0; background: #f8fafc; }
        .excel-input:focus { border-color: #3b82f6; background: #ffffff; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        .excel-textarea { resize: none; overflow: hidden; min-height: 34px; }

        /* 테이블 스타일 */
        .sticky-header th { position: sticky; top: 0; background: #f8fafc; z-index: 20; border-bottom: 2px solid #cbd5e1; }
        .table-row-hover:hover td { background-color: #f1f5f9; }

        /* 캘린더 스타일 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #e2e8f0; }
        .calendar-day { min-height: 100px; background: white; padding: 4px; position: relative; }
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; background: #f1f5f9; padding: 10px 0; }
        .trip-bar { font-size: 10px; padding: 2px 4px; margin-bottom: 2px; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

        /* 플로팅 버튼 (모바일용) */
        .fab-button { position: fixed; bottom: 24px; right: 24px; z-index: 50; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }

        /* 인쇄 전용 스타일 - 견적서 */
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-area { position: absolute; top: 0; left: 0; width: 100%; min-height: 100%; background: white; z-index: 9999; }
            
            /* 청구서 디자인 */
            .invoice-container { max-width: 100%; padding: 0; }
            .invoice-header { border-bottom: 2px solid #2563eb; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: end; }
            .invoice-title { font-size: 32pt; font-weight: 900; color: #1e293b; letter-spacing: -1px; line-height: 1; }
            .invoice-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            .invoice-table th { background-color: #f1f5f9 !important; color: #334155 !important; font-weight: 800; padding: 12px; border-bottom: 2px solid #cbd5e1; text-align: left; font-size: 11pt; }
            .invoice-table td { border-bottom: 1px solid #e2e8f0; padding: 12px; font-size: 10pt; }
            .invoice-total { margin-top: 30px; text-align: right; font-size: 14pt; }
            .invoice-footer { margin-top: 50px; text-align: center; font-size: 9pt; color: #64748b; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- [아이콘 컴포넌트] ---
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // --- [유틸리티 함수] ---
        const formatMoneySimple = (amount, currency = 'VND') => {
            if (!amount && amount !== 0) return '-';
            return Math.round(amount).toLocaleString() + (currency === 'VND' ? ' ₫' : currency === 'KRW' ? ' 원' : ' $');
        };

        const formatMoneyDual = (amountVnd, currency, rate) => {
            if (!amountVnd && amountVnd !== 0) return '-';
            const vndStr = Math.round(amountVnd).toLocaleString() + ' ₫';
            if (currency === 'VND') return vndStr;
            
            // 환율 계산 (허창수 법인장님 로직: KRW = VND / Rate)
            // 예: 10,000,000 VND / 18 = 555,555 KRW
            const convertedVal = currency === 'USD' ? amountVnd / 24000 : amountVnd / rate; 
            const convertedStr = Math.round(convertedVal).toLocaleString() + (currency === 'KRW' ? ' 원' : ' $');

            return (
                <span>
                    {vndStr} <span className="text-[10px] text-slate-400 block sm:inline font-normal">({convertedStr})</span>
                </span>
            );
        };

        const getToday = () => new Date().toISOString().split('T')[0];

        // --- [공통 컴포넌트] ---
        const KosviLogo = ({ dark = false, small = false, customLogo = null }) => (
            <div className="flex items-center gap-3">
                {customLogo ? (
                    <img src={customLogo} alt="Logo" className={`${small ? 'w-8 h-8' : 'w-10 h-10'} rounded-lg object-cover shadow-lg`} />
                ) : (
                    <div className={`${small ? 'w-8 h-8' : 'w-10 h-10'} rounded-lg flex items-center justify-center shadow-lg ${dark ? 'bg-slate-900' : 'bg-blue-600'}`}>
                        <span className="text-white font-black italic text-sm">K</span>
                    </div>
                )}
                <div className="flex flex-col">
                    <span className={`${small ? 'text-lg' : 'text-xl'} font-black leading-none italic ${dark ? 'text-slate-900' : 'text-slate-800'}`}>KOSVI</span>
                    <span className="text-[8px] font-bold text-blue-600 tracking-widest uppercase">Vietnam Travel</span>
                </div>
            </div>
        );

        const ImagePreview = ({ file, onClose }) => {
            if (!file) return null;
            return (
                <div className="fixed inset-0 z-[300] bg-black/80 flex items-center justify-center p-4" onClick={onClose}>
                    <div className="relative max-w-4xl max-h-[90vh] overflow-auto bg-white rounded-lg p-2" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 right-4 bg-black/50 text-white rounded-full p-2 hover:bg-black"><Icon name="x" /></button>
                        <img src={file.url} alt="Preview" className="max-w-full h-auto rounded" />
                        <div className="text-center mt-2 font-bold text-slate-700">{file.name}</div>
                    </div>
                </div>
            );
        };

        // --- [메인 데이터 및 상수] ---
        const TYPE_OPTIONS = ['차량', '골프', '호텔', '투어', '식사', '가이드', '항공', '기타'];
        const UNIT_OPTIONS = ['박', '명', '회', '일', '개', '팀', '식'];
        
        const INITIAL_TRIP_TEMPLATE = { 
            title: '신규 여행 일정', client: '신규 고객', pax: 1, 
            startDate: getToday(), endDate: getToday(), 
            exchangeRate: 18, targetCurrency: 'KRW', 
            status: '견적중', paymentStatus: '미입금', created: getToday(),
            flightInfo: {
                in: { route: '', flight: '', depTime: '', arrTime: '' },
                out: { route: '', flight: '', depTime: '', arrTime: '' }
            },
            items: [
                { id: 1, date: getToday(), time: '09:00', category: '', content: '', qty: 1, unit: '명', costVnd: 0, priceVnd: 0, booking: '미정', note: '' }
            ]
        };

        // --- [메인 앱] ---
        const MainApp = ({ userRole, onLogout }) => {
            // State
            const [trips, setTrips] = useState([]);
            const [selectedTrip, setSelectedTrip] = useState(null);
            const [showQuote, setShowQuote] = useState(false);
            const [viewMode, setViewMode] = useState('dashboard'); 
            const [searchTerm, setSearchTerm] = useState('');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [previewFile, setPreviewFile] = useState(null);
            const [customLogo, setCustomLogo] = useState(null);
            const [sortOption, setSortOption] = useState('date');
            const [listStyle, setListStyle] = useState('list');
            const [reminderModal, setReminderModal] = useState(null);

            // 초기 로딩 (로컬 스토리지)
            useEffect(() => {
                const savedTrips = localStorage.getItem('kosvi_trips_v26');
                if (savedTrips) {
                    setTrips(JSON.parse(savedTrips));
                } else {
                    // 데모 데이터
                    const demoTrip = { 
                        ...INITIAL_TRIP_TEMPLATE,
                        id: 1704092233123,
                        client: '임창호', pax: 3, title: '호치민 3박 4일 골프',
                        startDate: '2026-01-13', endDate: '2026-01-16',
                        flightInfo: {
                            in: { route: 'ICN-SGN', flight: 'KE469', depTime: '09:05', arrTime: '12:40' },
                            out: { route: 'SGN-ICN', flight: 'KE470', depTime: '13:55', arrTime: '21:15' }
                        },
                        items: [
                            { id: 1, date: '2026-01-13', time: '12:40', category: '차량', content: '공항 픽업 (16인승)', qty: 1, unit: '회', costVnd: 500000, priceVnd: 800000, booking: '확정', note: '기사 대기중' },
                            { id: 2, date: '2026-01-13', time: '14:00', category: '호텔', content: '랜드마크 플러스 (3BR)', qty: 3, unit: '박', costVnd: 3650000, priceVnd: 4500000, booking: '대기', note: '' }
                        ]
                    };
                    setTrips([demoTrip]);
                }
            }, []);

            // 변경 시 자동 저장
            useEffect(() => {
                if (trips.length > 0) {
                    localStorage.setItem('kosvi_trips_v26', JSON.stringify(trips));
                }
            }, [trips]);

            // CRUD Logic
            const calculateTotal = (items, type) => items.reduce((acc, item) => acc + (item[type] * item.qty), 0);

            const handleAddTrip = () => {
                const newTrip = { ...INITIAL_TRIP_TEMPLATE, id: Date.now() };
                setTrips([newTrip, ...trips]);
                setSelectedTrip(newTrip);
                setViewMode('list');
            };

            const updateTrip = (updated) => {
                // selectedTrip 업데이트는 UI 입력을 위해 바로 반영
                setSelectedTrip(updated);
            };

            const saveTrip = () => {
                if (!selectedTrip) return;
                setTrips(trips.map(t => t.id === selectedTrip.id ? selectedTrip : t));
                alert('저장되었습니다.');
            };

            const deleteTrip = () => {
                if(confirm('정말 삭제하시겠습니까?')) {
                    setTrips(trips.filter(t => t.id !== selectedTrip.id));
                    setSelectedTrip(null);
                }
            };

            const updateFlightInfo = (type, field, value) => {
                setSelectedTrip(prev => ({ 
                    ...prev, 
                    flightInfo: { ...prev.flightInfo, [type]: { ...prev.flightInfo[type], [field]: value } } 
                }));
            };

            const handleFileUpload = (itemId, fileType, file) => {
                if (!file) return;
                const fileData = { name: file.name, url: URL.createObjectURL(file), type: file.type };
                const newItems = selectedTrip.items.map(item => item.id === itemId ? { ...item, [fileType]: fileData } : item);
                setSelectedTrip({ ...selectedTrip, items: newItems });
            };

            const handleLogoUpload = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setCustomLogo(URL.createObjectURL(e.target.files[0]));
                }
            };

            // Input Components
            const NumberInput = ({ value, onChange, className, readOnly, placeholder }) => (
                <input
                    type="text" className={className}
                    value={value ? Number(value).toLocaleString() : ''}
                    onChange={(e) => {
                        const val = e.target.value.replace(/,/g, '');
                        if (!isNaN(val)) onChange(Number(val));
                    }}
                    placeholder={placeholder || "0"} readOnly={readOnly}
                />
            );

            const AutoResizeTextarea = ({ value, onChange, className, placeholder }) => {
                const textareaRef = useRef(null);
                useEffect(() => { 
                    if (textareaRef.current) { 
                        textareaRef.current.style.height = 'auto'; 
                        textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px'; 
                    } 
                }, [value]);
                return <textarea ref={textareaRef} className={`${className} excel-textarea`} rows={1} value={value} onChange={onChange} placeholder={placeholder} />;
            };

            // --- [Views] ---

            // 1. Dashboard
            const DashboardView = () => {
                const pendingPayments = trips.filter(t => t.paymentStatus !== '완납');
                const pendingSuppliers = trips.filter(t => t.items.some(i => i.costVnd > 0 && i.booking !== '확정'));
                const totalRevenue = trips.reduce((acc, t) => acc + calculateTotal(t.items, 'priceVnd'), 0);

                return (
                    <div className="p-4 md:p-8 space-y-6 animate-fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h3 className="text-slate-400 text-xs font-bold uppercase tracking-widest">Total Trips</h3>
                                <p className="text-3xl font-black text-slate-800 mt-2">{trips.length} <span className="text-base text-slate-400 font-normal">건</span></p>
                            </div>
                            <div onClick={() => setReminderModal('payment')} className="bg-red-50 p-6 rounded-2xl shadow-sm border border-red-100 cursor-pointer hover:shadow-md transition-shadow">
                                <h3 className="text-red-400 text-xs font-bold uppercase tracking-widest flex items-center gap-2"><Icon name="bell" size={14} /> 미입금 (Click)</h3>
                                <p className="text-3xl font-black text-red-600 mt-2">{pendingPayments.length} <span className="text-base text-red-300 font-normal">건</span></p>
                            </div>
                            <div onClick={() => setReminderModal('supplier')} className="bg-orange-50 p-6 rounded-2xl shadow-sm border border-orange-100 cursor-pointer hover:shadow-md transition-shadow">
                                <h3 className="text-orange-400 text-xs font-bold uppercase tracking-widest flex items-center gap-2"><Icon name="alert-triangle" size={14} /> 미예약 (Click)</h3>
                                <p className="text-3xl font-black text-orange-600 mt-2">{pendingSuppliers.length} <span className="text-base text-orange-300 font-normal">건</span></p>
                            </div>
                            {userRole === 'admin' && (
                                <div className="bg-blue-600 p-6 rounded-2xl shadow-lg text-white">
                                    <h3 className="text-blue-200 text-xs font-bold uppercase tracking-widest">Total Revenue</h3>
                                    <p className="text-2xl font-black mt-2">{totalRevenue.toLocaleString()} ₫</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // 2. Calendar View
            const CalendarView = () => {
                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
                
                // 간단한 달력 로직
                const getTripsForDay = (day) => {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                    return trips.filter(t => t.startDate <= dateStr && t.endDate >= dateStr);
                };

                return (
                    <div className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm min-h-[600px]">
                        <h2 className="text-xl font-bold mb-4 text-center">{year}년 {month + 1}월</h2>
                        <div className="calendar-header rounded-t-lg">
                            <div className="text-red-500">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div className="text-blue-500">SAT</div>
                        </div>
                        <div className="calendar-grid border-l border-t border-slate-200">
                            {Array(firstDay).fill(null).map((_, i) => <div key={`empty-${i}`} className="calendar-day bg-slate-50"></div>)}
                            {days.map(day => {
                                const dayTrips = getTripsForDay(day);
                                return (
                                    <div key={day} className="calendar-day hover:bg-slate-50 transition-colors">
                                        <div className={`text-xs font-bold mb-1 ${new Date(year, month, day).getDay()===0?'text-red-500':''}`}>{day}</div>
                                        <div className="flex flex-col gap-1">
                                            {dayTrips.map(t => (
                                                <div key={t.id} onClick={() => setSelectedTrip(t)} 
                                                    className={`trip-bar text-white text-[10px] px-1 rounded truncate ${t.paymentStatus === '완납' ? 'bg-blue-500' : 'bg-orange-400'}`}>
                                                    {t.client} ({t.pax})
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // 3. Settings View
            const SettingsView = () => (
                <div className="p-8 space-y-8 max-w-2xl mx-auto">
                    <h2 className="text-2xl font-black text-slate-800">Settings</h2>
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icon name="image" size={20} /> 회사 로고 변경</h3>
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 bg-slate-100 rounded-lg flex items-center justify-center overflow-hidden border border-slate-200">
                                {customLogo ? <img src={customLogo} alt="Logo" className="w-full h-full object-cover" /> : <span className="text-xs text-slate-400">No Logo</span>}
                            </div>
                            <label className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold cursor-pointer hover:bg-blue-700 transition-all">
                                이미지 업로드 <input type="file" className="hidden" accept="image/*" onChange={handleLogoUpload} />
                            </label>
                        </div>
                    </div>
                </div>
            );

            // 4. Quote (Print) View - Modal Overlay
            const QuoteView = () => {
                if (!showQuote || !selectedTrip) return null;
                const totalVnd = calculateTotal(selectedTrip.items, 'priceVnd');
                const totalConverted = selectedTrip.targetCurrency === 'KRW' ? totalVnd / selectedTrip.exchangeRate : totalVnd / 24000;

                return (
                    <div className="fixed inset-0 z-[200] bg-slate-900/50 flex justify-center overflow-y-auto">
                        <div className="bg-white w-[210mm] min-h-[297mm] m-8 p-[10mm] shadow-2xl relative print-area animate-fade-in">
                            {/* 인쇄용 버튼 (화면 표시용) */}
                            <div className="absolute top-4 right-4 flex gap-2 no-print">
                                <button onClick={() => window.print()} className="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">인쇄 / PDF 저장</button>
                                <button onClick={() => setShowQuote(false)} className="bg-slate-500 text-white px-4 py-2 rounded font-bold hover:bg-slate-600">닫기</button>
                            </div>

                            {/* 견적서 내용 */}
                            <div className="invoice-container">
                                <div className="invoice-header">
                                    <div>
                                        <KosviLogo small />
                                        <div className="mt-4 text-sm text-slate-500">
                                            <p>Ho Chi Minh City, Vietnam</p>
                                            <p>Tel: 077 890 1861 (법인장 허창수)</p>
                                            <p>Email: admin@daewoongvina.com</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <h1 className="invoice-title text-blue-600">INVOICE</h1>
                                        <p className="text-slate-500 mt-2">Date: {getToday()}</p>
                                        <p className="text-slate-800 font-bold mt-1 text-lg">{selectedTrip.client} 귀하</p>
                                    </div>
                                </div>

                                <div className="mb-6 p-4 bg-slate-50 rounded-lg border border-slate-100">
                                    <h3 className="font-bold text-slate-700 mb-2 border-b border-slate-200 pb-1">Flight Information</h3>
                                    <div className="grid grid-cols-2 gap-4 text-sm">
                                        <div><span className="font-bold text-blue-600 w-10 inline-block">IN:</span> {selectedTrip.flightInfo.in.route} | {selectedTrip.flightInfo.in.flight} | {formatTimeAMPM(selectedTrip.flightInfo.in.depTime)} - {formatTimeAMPM(selectedTrip.flightInfo.in.arrTime)}</div>
                                        <div><span className="font-bold text-orange-500 w-10 inline-block">OUT:</span> {selectedTrip.flightInfo.out.route} | {selectedTrip.flightInfo.out.flight} | {formatTimeAMPM(selectedTrip.flightInfo.out.depTime)} - {formatTimeAMPM(selectedTrip.flightInfo.out.arrTime)}</div>
                                    </div>
                                </div>

                                <table className="invoice-table">
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Type</th>
                                            <th>Description</th>
                                            <th className="text-center">Qty</th>
                                            <th className="text-right">Price ({selectedTrip.targetCurrency})</th>
                                            <th className="text-right">Total ({selectedTrip.targetCurrency})</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {selectedTrip.items.map((item, idx) => {
                                            const unitPrice = selectedTrip.targetCurrency === 'VND' ? item.priceVnd : (item.priceVnd / selectedTrip.exchangeRate);
                                            return (
                                                <tr key={idx}>
                                                    <td>{item.date.substring(5)}</td>
                                                    <td className="font-bold text-slate-600">{item.category}</td>
                                                    <td>{item.content}</td>
                                                    <td className="text-center">{item.qty} {item.unit}</td>
                                                    <td className="text-right">{formatMoneySimple(unitPrice, selectedTrip.targetCurrency)}</td>
                                                    <td className="text-right font-bold">{formatMoneySimple(unitPrice * item.qty, selectedTrip.targetCurrency)}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>

                                <div className="invoice-total">
                                    <div className="inline-block bg-slate-50 p-6 rounded-xl border border-slate-200 min-w-[300px]">
                                        <div className="flex justify-between mb-2 text-slate-500 text-sm">

        const App = () => {
            const [authState, setAuthState] = useState({ isLoggedIn: false, role: null });
            const login = (role) => setAuthState({ isLoggedIn: true, role });
            const logout = () => setAuthState({ isLoggedIn: false, role: null });
            return authState.isLoggedIn ? <MainApp userRole={authState.role} onLogout={logout} /> : <LoginPage onLogin={login} />;
        };

        const LoginPage = ({ onLogin }) => {
            const [id, setId] = useState(''); const [pw, setPw] = useState('');
            const handleLogin = (e) => { e.preventDefault(); if(id==='admin'&&pw==='1234') onLogin('admin'); else if((id==='staff1'&&pw==='1111')||(id==='staff2'&&pw==='2222')) onLogin(id); else alert('ID 또는 비밀번호가 틀렸습니다.'); };
            return <div className="min-h-screen flex items-center justify-center bg-[#f1f5f9] p-4"><div className="bg-white p-10 rounded-3xl shadow-xl w-full max-w-sm"><div className="flex justify-center mb-8"><KosviLogo /></div><form onSubmit={handleLogin} className="space-y-4"><input className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none font-bold text-center" placeholder="ID" value={id} onChange={e=>setId(e.target.value)} /><input type="password" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none font-bold text-center" placeholder="PW" value={pw} onChange={e=>setPw(e.target.value)} /><button className="w-full bg-blue-600 text-white p-4 rounded-xl font-bold shadow-lg">LOGIN</button></form></div></div>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
