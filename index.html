<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Travel Manager - Vietnam</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE - Gemini 전용 기억 저장소]
         * ---------------------------------------------------------
         * 1. 사용자 정보: 허창수 법인장 (CEO, KOSVI Travel)
         * 2. 프로젝트: KOSVI 여행사 통합 관리 시스템 (v3.0 - 권한 분리형)
         * 3. 핵심 규칙:
         * - 반드시 '루트 폴더'의 index.html 하나로만 배포함.
         * - 권한 분리: 법인장(CEO)은 견적/금액 확인 가능, 직원(Staff)은 예약 현황만 관리 가능.
         * - 베트남 현지 특화: 견적서 및 일정 관리 중심.
         * 4. 배포 정보:
         * - Firebase Project: kosvi-travel
         * - GitHub Secret: FIREBASE_SERVICE_ACCOUNT_KOSVI_TRAVEL
         * ---------------------------------------------------------
         */

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // KOSVI 로고 컴포넌트 (SVG 디자인)
        const KosviLogo = ({ className = "" }) => (
            <div className={`flex items-center gap-2 ${className}`}>
                <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" rx="20" fill="#2563eb"/>
                    <path d="M30 30L50 50L70 30" stroke="white" strokeWidth="8" strokeLinecap="round"/>
                    <path d="M30 70L50 50L70 70" stroke="white" strokeWidth="8" strokeLinecap="round"/>
                    <circle cx="50" cy="50" r="12" fill="white"/>
                </svg>
                <div className="flex flex-col">
                    <span className="text-xl font-black tracking-tighter text-slate-900 leading-none">KOSVI</span>
                    <span className="text-[10px] font-bold text-blue-600 tracking-[0.2em] leading-none uppercase">Vietnam</span>
                </div>
            </div>
        );

        // 초기 데이터 세팅
        const INITIAL_TRIPS = [
            { id: 1, title: '호치민-무이네 3박 4일 투어', client: '홍길동 님', date: '2026-02-10', status: '견적완료', bookingStatus: '대기', price: 1500000, cost: 1100000, category: '패키지', staffNote: '' },
            { id: 2, title: '다낭 골프 3일 프리미엄', client: '이철수 부장님', date: '2026-02-15', status: '예약진행', bookingStatus: '확정', price: 2800000, cost: 2200000, category: '골프', staffNote: '그린피 입금 확인됨' },
            { id: 3, title: '나트랑 빈펄 리조트 가족 여행', client: '박미영 님', date: '2026-03-01', status: '견적중', bookingStatus: '미정', price: 3200000, cost: 2600000, category: '자유여행', staffNote: '' }
        ];

        const App = () => {
            // 권한 모드: 'ceo' (법인장) 또는 'staff' (직원)
            const [userRole, setUserRole] = useState('ceo'); 
            const [activeTab, setActiveTab] = useState('dashboard');
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [searchTerm, setSearchTerm] = useState('');
            const [isEditModalOpen, setEditModalOpen] = useState(false);
            const [selectedTrip, setSelectedTrip] = useState(null);

            // 필터링
            const filteredTrips = trips.filter(trip => 
                trip.title.includes(searchTerm) || trip.client.includes(searchTerm)
            );

            // 수익 계산 (CEO만 가능)
            const stats = useMemo(() => {
                const totalRevenue = trips.reduce((acc, curr) => acc + curr.price, 0);
                const totalProfit = trips.reduce((acc, curr) => acc + (curr.price - curr.cost), 0);
                return { totalRevenue, totalProfit };
            }, [trips]);

            // 직원용 상태 업데이트 함수
            const updateBooking = (id, status, note) => {
                setTrips(prev => prev.map(t => t.id === id ? { ...t, bookingStatus: status, staffNote: note } : t));
                setEditModalOpen(false);
            };

            return (
                <div className="flex h-screen bg-[#f1f5f9] text-slate-900 overflow-hidden">
                    {/* 사이드바 */}
                    <aside className="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0 shadow-sm z-20">
                        <div className="p-8">
                            <KosviLogo />
                        </div>

                        {/* 권한 스위처 (테스트용) */}
                        <div className="px-6 mb-4">
                            <div className="flex p-1 bg-slate-100 rounded-xl">
                                <button 
                                    onClick={() => setUserRole('ceo')}
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${userRole === 'ceo' ? 'bg-white shadow text-blue-600' : 'text-slate-400'}`}
                                >법인장 모드</button>
                                <button 
                                    onClick={() => setUserRole('staff')}
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${userRole === 'staff' ? 'bg-white shadow text-blue-600' : 'text-slate-400'}`}
                                >직원 모드</button>
                            </div>
                        </div>

                        <nav className="flex-1 px-4 space-y-1">
                            <NavItem active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon="layout-dashboard" label="대시보드" />
                            <NavItem active={activeTab === 'trips'} onClick={() => setActiveTab('trips')} icon="map" label="여행 일정 관리" />
                            {userRole === 'ceo' && (
                                <NavItem active={activeTab === 'finance'} onClick={() => setActiveTab('finance')} icon="pie-chart" label="견적 및 수익 관리" />
                            )}
                            <NavItem active={activeTab === 'clients'} onClick={() => setActiveTab('clients')} icon="users" label="고객 명단" />
                        </nav>

                        <div className="p-6 border-t border-slate-100">
                            <div className="flex items-center gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shadow-md ${userRole === 'ceo' ? 'bg-blue-600' : 'bg-green-600'}`}>
                                    {userRole === 'ceo' ? 'CEO' : 'ST'}
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-sm font-bold truncate">{userRole === 'ceo' ? '허창수 법인장' : '예약 담당 직원'}</p>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">{userRole === 'ceo' ? 'Administrator' : 'Staff Member'}</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* 메인 콘텐츠 */}
                    <main className="flex-1 overflow-y-auto flex flex-col relative">
                        <header className="glass-effect border-b border-slate-200 px-10 py-5 flex justify-between items-center sticky top-0 z-10">
                            <div className="flex items-center gap-4">
                                <h2 className="text-xl font-bold text-slate-800">
                                    {activeTab === 'dashboard' ? '실시간 현황 대시보드' : activeTab === 'trips' ? '여행 일정 및 예약 관리' : '상세 관리'}
                                </h2>
                            </div>
                            <div className="flex items-center gap-3">
                                <div className="relative">
                                    <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input 
                                        type="text" 
                                        placeholder="고객명, 상품명 검색..." 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none w-64 shadow-sm"
                                    />
                                </div>
                                <button className="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 hover:bg-blue-700 transition-all flex items-center gap-2">
                                    <Icon name="plus" size={18} />
                                    <span>신규 등록</span>
                                </button>
                            </div>
                        </header>

                        <div className="p-10 max-w-7xl mx-auto w-full space-y-8">
                            {/* 상단 통계 - 법인장 모드에서만 금액 노출 */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-start">
                                        <div className="p-3 bg-blue-50 text-blue-600 rounded-2xl"><Icon name="calendar" size={24} /></div>
                                        <span className="text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded-full uppercase">Today</span>
                                    </div>
                                    <h4 className="mt-4 text-slate-400 text-xs font-bold uppercase tracking-wider">활성 예약 건수</h4>
                                    <p className="text-3xl font-black text-slate-800 mt-1">{trips.length}건</p>
                                </div>
                                
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-start">
                                        <div className="p-3 bg-green-50 text-green-600 rounded-2xl"><Icon name="trending-up" size={24} /></div>
                                    </div>
                                    <h4 className="mt-4 text-slate-400 text-xs font-bold uppercase tracking-wider">전체 매출 현황</h4>
                                    <p className="text-3xl font-black text-slate-800 mt-1">
                                        {userRole === 'ceo' ? `₩${(stats.totalRevenue / 10000).toLocaleString()}만` : '***,***'}
                                    </p>
                                </div>

                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-start">
                                        <div className="p-3 bg-purple-50 text-purple-600 rounded-2xl"><Icon name="dollar-sign" size={24} /></div>
                                    </div>
                                    <h4 className="mt-4 text-slate-400 text-xs font-bold uppercase tracking-wider">추정 순이익</h4>
                                    <p className="text-3xl font-black text-slate-800 mt-1 text-blue-600">
                                        {userRole === 'ceo' ? `₩${(stats.totalProfit / 10000).toLocaleString()}만` : '***,***'}
                                    </p>
                                </div>
                            </div>

                            {/* 메인 리스트 */}
                            <div className="bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden">
                                <div className="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                    <h3 className="font-black text-slate-800 flex items-center gap-2">
                                        <div className="w-2 h-6 bg-blue-600 rounded-full"></div>
                                        진행 중인 여행 일정
                                    </h3>
                                    <span className="text-xs font-bold text-slate-400">{userRole === 'ceo' ? '전체 권한' : '예약 관리 권한'}</span>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead>
                                            <tr className="text-slate-400 font-bold border-b border-slate-100 uppercase text-[11px] tracking-widest">
                                                <th className="px-8 py-5">여행 상품 및 일정</th>
                                                <th className="px-8 py-5">한국 고객명</th>
                                                <th className="px-8 py-5">예약 상태</th>
                                                {userRole === 'ceo' && <th className="px-8 py-5 text-right">견적 금액</th>}
                                                <th className="px-8 py-5 text-right">액션</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {filteredTrips.map(trip => (
                                                <tr key={trip.id} className="group hover:bg-slate-50/80 transition-all">
                                                    <td className="px-8 py-6">
                                                        <div className="flex items-center gap-4">
                                                            <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                                                <Icon name="map-pin" size={20} />
                                                            </div>
                                                            <div>
                                                                <p className="font-bold text-slate-800">{trip.title}</p>
                                                                <p className="text-[11px] text-slate-400 font-medium">{trip.date} 출발 · {trip.category}</p>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="px-8 py-6 font-bold text-slate-600">{trip.client}</td>
                                                    <td className="px-8 py-6">
                                                        <div className="flex flex-col gap-1">
                                                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black w-fit border ${
                                                                trip.bookingStatus === '확정' ? 'bg-green-50 text-green-700 border-green-200' : 
                                                                trip.bookingStatus === '대기' ? 'bg-orange-50 text-orange-700 border-orange-200' : 
                                                                'bg-slate-100 text-slate-500 border-slate-200'
                                                            }`}>
                                                                {trip.bookingStatus}
                                                            </span>
                                                            {trip.staffNote && <p className="text-[10px] text-slate-400 truncate max-w-[150px] italic">"{trip.staffNote}"</p>}
                                                        </div>
                                                    </td>
                                                    {userRole === 'ceo' && (
                                                        <td className="px-8 py-6 text-right">
                                                            <p className="font-black text-slate-800">₩{(trip.price / 10000).toLocaleString()}만</p>
                                                            <p className="text-[10px] text-green-600 font-bold">수익 ₩{((trip.price - trip.cost) / 10000).toLocaleString()}만</p>
                                                        </td>
                                                    )}
                                                    <td className="px-8 py-6 text-right">
                                                        <button 
                                                            onClick={() => { setSelectedTrip(trip); setEditModalOpen(true); }}
                                                            className="p-2 text-slate-300 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
                                                        >
                                                            <Icon name="edit-3" size={18} />
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* 예약 상태 업데이트 모달 */}
                    {isEditModalOpen && selectedTrip && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                            <div className="bg-white w-full max-w-md rounded-[2rem] shadow-2xl p-8 animate-in zoom-in-95 duration-200 border border-slate-100">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h3 className="text-xl font-black text-slate-900">예약 현황 업데이트</h3>
                                        <p className="text-xs text-slate-400 mt-1">{selectedTrip.title} - {selectedTrip.client}</p>
                                    </div>
                                    <button onClick={() => setEditModalOpen(false)} className="text-slate-300 hover:text-slate-600 transition-colors">
                                        <Icon name="x" size={24} />
                                    </button>
                                </div>

                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">예약 상태 선택</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['미정', '대기', '확정'].map(s => (
                                                <button 
                                                    key={s}
                                                    onClick={() => setSelectedTrip({...selectedTrip, bookingStatus: s})}
                                                    className={`py-3 rounded-xl text-xs font-bold border transition-all ${selectedTrip.bookingStatus === s ? 'bg-blue-600 border-blue-600 text-white shadow-lg shadow-blue-500/30' : 'bg-white border-slate-200 text-slate-500 hover:border-slate-300'}`}
                                                >
                                                    {s}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">예약 특이사항 및 메모</label>
                                        <textarea 
                                            className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 outline-none h-32 resize-none"
                                            placeholder="예: 입금 확인 필요, 호텔 확정됨 등"
                                            value={selectedTrip.staffNote}
                                            onChange={(e) => setSelectedTrip({...selectedTrip, staffNote: e.target.value})}
                                        ></textarea>
                                    </div>

                                    <button 
                                        onClick={() => updateBooking(selectedTrip.id, selectedTrip.bookingStatus, selectedTrip.staffNote)}
                                        className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-sm shadow-xl hover:bg-slate-800 transition-all active:scale-[0.98]"
                                    >
                                        업데이트 저장하기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const NavItem = ({ active, icon, label, onClick }) => (
            <button
                onClick={onClick}
                className={`w-full flex items-center gap-3 px-6 py-4 rounded-2xl transition-all ${
                    active ? 'bg-blue-600 text-white shadow-xl shadow-blue-500/20' : 'text-slate-400 hover:bg-slate-50 hover:text-slate-600'
                }`}
            >
                <Icon name={icon} size={20} className={active ? 'text-white' : 'text-slate-300'} />
                <span className="font-bold text-sm tracking-tight">{label}</span>
                {active && <div className="ml-auto w-1.5 h-1.5 bg-white rounded-full"></div>}
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
