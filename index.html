<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Travel Manager - Integrated Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .ceo-card { background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%); color: white; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 엑셀 스타일 입력 필드 */
        .excel-input { 
            background: transparent; 
            border: 1px solid transparent; 
            width: 100%; 
            padding: 6px; 
            border-radius: 4px; 
            transition: all 0.2s;
        }
        .excel-input:hover { border-color: #cbd5e1; background: #f8fafc; }
        .excel-input:focus { border-color: #3b82f6; background: #ffffff; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        /* 테이블 헤더 고정 */
        .sticky-header th { position: sticky; top: 0; background: #f8fafc; z-index: 10; border-bottom: 2px solid #e2e8f0; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-[#f1f5f9]">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE]
         * 1. 사용자: 허창수 법인장 (KOSVI)
         * 2. 계정: admin(1234), staff1(1111), staff2(2222)
         * 3. 핵심: 일정+견적(원가/매출) 한 줄 통합, 변동 환율, 한-베 병기
         */

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const KosviLogo = () => (
            <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                    <svg width="24" height="24" viewBox="0 0 100 100" fill="none">
                        <path d="M20 20L80 80M80 20L20 80" stroke="white" strokeWidth="14" strokeLinecap="round"/>
                        <circle cx="50" cy="50" r="18" fill="#f8fafc" stroke="white" strokeWidth="4"/>
                    </svg>
                </div>
                <div className="flex flex-col">
                    <span className="text-xl font-black text-slate-800 leading-none italic">KOSVI</span>
                    <span className="text-[10px] font-bold text-blue-600 tracking-widest uppercase">Vietnam Travel</span>
                </div>
            </div>
        );

        const getDayOfWeek = (dateString) => {
            const days = ['일(CN)', '월(T2)', '화(T3)', '수(T4)', '목(T5)', '금(T6)', '토(T7)'];
            return days[new Date(dateString).getDay()];
        };

        const INITIAL_TRIPS = [
            { 
                id: 1, 
                title: '임창호 님 호치민 3박 4일', 
                client: '임창호 님', 
                pax: 3, 
                startDate: '2026-01-13',
                endDate: '2026-01-16',
                exchangeRate: 5.54, 
                targetCurrency: 'KRW',
                status: '진행중',
                // 통합된 데이터 구조 (일정 + 견적)
                items: [
                    { id: 1, date: '2026-01-13', time: '12:40', category: '차량', content: '공항 픽업 및 미팅 (S2)', qty: 1, unit: '회', costVnd: 500000, priceVnd: 800000, booking: '확정', note: '기사 배정 완료' },
                    { id: 2, date: '2026-01-13', time: '15:00', category: '호텔', content: '호텔 체크인 (랜드마크)', qty: 3, unit: '박', costVnd: 3650000, priceVnd: 4500000, booking: '대기', note: '바우처 대기중' },
                    { id: 3, date: '2026-01-14', time: '08:30', category: '골프', content: '트윈도브스 18홀 라운딩', qty: 3, unit: '명', costVnd: 3150000, priceVnd: 4200000, booking: '확정', note: '' },
                    { id: 4, date: '2026-01-14', time: '18:00', category: '식사', content: '석식 (한솔식당)', qty: 3, unit: '인', costVnd: 300000, priceVnd: 500000, booking: '미정', note: '' },
                ]
            }
        ];

        const MainApp = ({ userRole, onLogout }) => {
            const [viewMode, setViewMode] = useState('list'); 
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [selectedTrip, setSelectedTrip] = useState(null);

            // 환율 계산 함수
            const calculateTotal = (items, type) => items.reduce((acc, item) => acc + (item[type] * item.qty), 0);
            
            const convertCurrency = (vndAmount, rate, currency) => {
                if (currency === 'VND') return vndAmount;
                if (currency === 'USD') return vndAmount / 23500; // 대략적인 USD 환율 (고정값 예시, 필요시 이것도 변수로)
                return vndAmount / rate; // KRW 등은 입력된 환율로 나눔
            };

            const formatMoney = (amount, currency) => {
                return Math.round(amount).toLocaleString(undefined, { maximumFractionDigits: 0 }) + (currency === 'VND' ? ' ₫' : currency === 'KRW' ? ' 원' : ' $');
            };

            const updateTrip = (updatedTrip) => {
                setTrips(trips.map(t => t.id === updatedTrip.id ? updatedTrip : t));
                setSelectedTrip(updatedTrip);
            };

            return (
                <div className="flex h-screen bg-[#f1f5f9] text-slate-900 overflow-hidden animate-fade-in">
                    {/* 사이드바 */}
                    <aside className="w-72 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl">
                        <div className="p-6 bg-white"><KosviLogo /></div>
                        <div className="p-6">
                            <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700">
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Signed in as</p>
                                <div className="flex items-center gap-2">
                                    <div className={`w-2 h-2 rounded-full ${userRole === 'admin' ? 'bg-blue-500' : 'bg-green-500'}`}></div>
                                    <span className="font-bold text-lg">{userRole === 'admin' ? '허창수 법인장' : userRole === 'staff1' ? '직원 1 (Staff)' : '직원 2 (Staff)'}</span>
                                </div>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            <button className="w-full flex items-center gap-4 px-6 py-4 bg-blue-600 rounded-2xl text-white font-bold shadow-lg"><Icon name="layout-dashboard" /> 현황 / Dashboard</button>
                            <button className="w-full flex items-center gap-4 px-6 py-4 text-slate-400 hover:bg-slate-800 rounded-2xl transition-all font-medium"><Icon name="calendar" /> 일정 / Lịch trình</button>
                        </nav>
                        <div className="p-6">
                            <button onClick={onLogout} className="w-full py-3 bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                                <Icon name="log-out" size={14} /> 로그아웃 (Đăng xuất)
                            </button>
                        </div>
                    </aside>

                    {/* 메인 콘텐츠 */}
                    <main className="flex-1 overflow-y-auto flex flex-col">
                        <header className="glass-panel sticky top-0 px-8 py-5 flex justify-between items-center z-20 shadow-sm">
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">KOSVI Integrated Manager</h2>
                            <button className="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg flex items-center gap-2 hover:bg-slate-800 transition-all">
                                <Icon name="plus" size={16} /> 새 견적 생성 (Tạo mới)
                            </button>
                        </header>

                        <div className="p-8 max-w-[1600px] mx-auto w-full">
                            {/* 리스트 뷰 */}
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
                                <table className="w-full text-left font-bold">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                            <th className="px-8 py-5">고객명 (Khách hàng)</th>
                                            <th className="px-8 py-5">일정 (Lịch trình)</th>
                                            <th className="px-8 py-5 text-center">상태 (Trạng thái)</th>
                                            {userRole === 'admin' && <th className="px-8 py-5 text-right">총 견적 (Tổng giá)</th>}
                                            <th className="px-8 py-5 text-right">관리 (Quản lý)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {trips.map(trip => (
                                            <tr key={trip.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-8 py-6 text-lg text-slate-800">{trip.client}</td>
                                                <td className="px-8 py-6 text-slate-500 text-sm">{trip.title} <span className="text-blue-500 font-bold">({trip.pax}명)</span></td>
                                                <td className="px-8 py-6 text-center"><span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs">{trip.status}</span></td>
                                                {userRole === 'admin' && (
                                                    <td className="px-8 py-6 text-right font-black text-slate-800 text-lg">
                                                        {formatMoney(convertCurrency(calculateTotal(trip.items, 'priceVnd'), trip.exchangeRate, trip.targetCurrency), trip.targetCurrency)}
                                                    </td>
                                                )}
                                                <td className="px-8 py-6 text-right">
                                                    <button onClick={() => setSelectedTrip({...trip})} className="p-3 bg-white border border-slate-200 rounded-xl hover:border-blue-500 hover:text-blue-600 shadow-sm transition-all">
                                                        <Icon name="edit-3" />
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {/* 통합 워크시트 모달 (엑셀형) */}
                    {selectedTrip && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-6 animate-fade-in">
                            <div className="bg-white w-full max-w-[1700px] h-[95vh] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden">
                                {/* 모달 헤더: 환율 설정 및 요약 */}
                                <div className="px-10 py-6 bg-slate-900 text-white flex justify-between items-center shrink-0">
                                    <div>
                                        <h3 className="text-2xl font-black italic">{selectedTrip.client} 통합 워크시트</h3>
                                        <p className="text-slate-400 text-xs mt-1 font-medium">{selectedTrip.startDate} ~ {selectedTrip.endDate} (PAX: {selectedTrip.pax})</p>
                                    </div>
                                    
                                    {userRole === 'admin' && (
                                        <div className="flex items-center gap-6 bg-white/10 px-6 py-3 rounded-2xl border border-white/10">
                                            <div className="flex flex-col">
                                                <label className="text-[10px] text-blue-300 font-bold uppercase">적용 환율 (Rate)</label>
                                                <input 
                                                    type="number" 
                                                    className="bg-transparent border-b border-blue-400 w-20 text-lg font-black outline-none focus:border-white transition-colors"
                                                    value={selectedTrip.exchangeRate}
                                                    onChange={(e) => {
                                                        const newTrip = {...selectedTrip, exchangeRate: parseFloat(e.target.value)};
                                                        setSelectedTrip(newTrip);
                                                        // Note: In real app, also update 'trips' state
                                                    }}
                                                />
                                            </div>
                                            <div className="flex flex-col">
                                                <label className="text-[10px] text-blue-300 font-bold uppercase">견적 통화 (Tiền tệ)</label>
                                                <select 
                                                    className="bg-slate-800 border border-slate-600 rounded text-sm font-bold px-2 py-1 outline-none"
                                                    value={selectedTrip.targetCurrency}
                                                    onChange={(e) => setSelectedTrip({...selectedTrip, targetCurrency: e.target.value})}
                                                >
                                                    <option value="KRW">KRW (원)</option>
                                                    <option value="USD">USD ($)</option>
                                                    <option value="VND">VND (동)</option>
                                                </select>
                                            </div>
                                            <div className="text-right pl-6 border-l border-white/20">
                                                <p className="text-[10px] text-slate-400 uppercase">Total Estimate</p>
                                                <p className="text-2xl font-black text-green-400">
                                                    {formatMoney(convertCurrency(calculateTotal(selectedTrip.items, 'priceVnd'), selectedTrip.exchangeRate, selectedTrip.targetCurrency), selectedTrip.targetCurrency)}
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={() => setSelectedTrip(null)} className="p-3 hover:bg-white/10 rounded-full transition-colors"><Icon name="x" size={24} /></button>
                                </div>

                                {/* 메인 엑셀 시트 영역 */}
                                <div className="flex-1 overflow-auto bg-white p-8">
                                    <table className="w-full text-sm border-collapse">
                                        <thead className="sticky-header text-xs text-slate-500 uppercase tracking-wider font-bold">
                                            <tr>
                                                <th className="p-3 text-left w-28">날짜<br/><span className="text-[10px]">Ngày</span></th>
                                                <th className="p-3 text-center w-20">시간<br/><span className="text-[10px]">Giờ</span></th>
                                                <th className="p-3 w-24">분류<br/><span className="text-[10px]">Loại</span></th>
                                                <th className="p-3 w-[25%]">일정 및 내용<br/><span className="text-[10px]">Nội dung</span></th>
                                                <th className="p-3 text-center w-16">수량<br/><span className="text-[10px]">SL</span></th>
                                                <th className="p-3 text-center w-16">단위<br/><span className="text-[10px]">ĐV</span></th>
                                                
                                                {/* 관리자 전용: 원가/매출 입력 */}
                                                {userRole === 'admin' ? (
                                                    <>
                                                        <th className="p-3 text-right bg-red-50/50 w-32">원가 (Cost)<br/><span className="text-[10px]">VND</span></th>
                                                        <th className="p-3 text-right bg-blue-50/50 w-32">매출 (Price)<br/><span className="text-[10px]">VND</span></th>
                                                        <th className="p-3 text-right w-20">마진<br/><span className="text-[10px]">Lãi</span></th>
                                                    </>
                                                ) : null}

                                                <th className="p-3 text-center w-24">예약<br/><span className="text-[10px]">Booking</span></th>
                                                <th className="p-3 text-left">비고 / 메모<br/><span className="text-[10px]">Ghi chú</span></th>
                                                <th className="p-3 text-center w-12"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-medium text-slate-700">
                                            {selectedTrip.items.map((item, idx) => (
                                                <tr key={item.id} className="group hover:bg-slate-50 border-b border-slate-100">
                                                    <td className="p-2">
                                                        <input className="excel-input font-bold text-slate-800" value={item.date} onChange={(e)=>{
                                                            const newItems = [...selectedTrip.items]; newItems[idx].date = e.target.value; setSelectedTrip({...selectedTrip, items: newItems});
                                                        }} />
                                                        <div className="text-[10px] text-slate-400 pl-2">{getDayOfWeek(item.date)}</div>
                                                    </td>
                                                    
                                                    <td className="p-2"><input className="excel-input text-center text-blue-600 font-bold" value={item.time} placeholder="00:00" onChange={(e)=>{
                                                        const newItems = [...selectedTrip.items]; newItems[idx].time = e.target.value; setSelectedTrip({...selectedTrip, items: newItems});
                                                    }} /></td>

                                                    <td className="p-2"><input className="excel-input text-center text-slate-500 text-xs" value={item.category} onChange={(e)=>{
                                                        const newItems = [...selectedTrip.items]; newItems[idx].category = e.target.value; setSelectedTrip({...selectedTrip, items: newItems});
                                                    }} /></td>
                                                    
                                                    <td className="p-2"><input className="excel-input font-bold text-slate-800" value={item.content} onChange={(e)=>{
                                                        const newItems = [...selectedTrip.items]; newItems[idx].content = e.target.value; setSelectedTrip({...selectedTrip, items: newItems});
                                                    }} /></td>
                                                    
                                                    <td className="p-2"><input type="number" className="excel-input text-center" value={item.qty} onChange={(e)=>{
                                                        const newItems = [...selectedTrip.items]; newItems[idx].qty = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems});
                                                    }} /></td>
                                                    
                                                    <td className="p-2"><input className="excel-input text-center text-slate-400" value={item.unit} onChange={(e)=>{
                                                        const newItems = [...selectedTrip.items]; newItems[idx].unit = e.target.value; setSelectedTrip({...selectedTrip, items: newItems});
                                                    }} /></td>

                                                    {userRole === 'admin' ? (
                                                        <>
                                                            <td className="p-2 bg-red-50/30"><input type="number" className="excel-input text-right text-red-400 font-bold" value={item.costVnd} onChange={(e)=>{
                                                                const newItems = [...selectedTrip.items]; newItems[idx].costVnd = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems});
                                                            }} /></td>
                                                            <td className="p-2 bg-blue-50/30"><input type="number" className="excel-input text-right text-blue-600 font-black" value={item.priceVnd} onChange={(e)=>{
                                                                const newItems = [...selectedTrip.items]; newItems[idx].priceVnd = Number(e.target.value); setSelectedTrip({...selectedTrip, items: newItems});
                                                            }} /></td>
                                                            <td className="p-3 text-right text-xs font-bold text-slate-400">
                                                                {item.priceVnd > 0 ? Math.round(((item.priceVnd - item.costVnd)/item.priceVnd)*100) + '%' : '-'}
                                                            </td>
                                                        </>
                                                    ) : null}

                                                    <td className="p-2 text-center">
                                                        <select 
                                                            className={`text-xs font-bold px-2 py-1 rounded border outline-none cursor-pointer w-full text-center ${item.booking === '확정' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-orange-100 text-orange-700 border-orange-200'}`}
                                                            value={item.booking}
                                                            onChange={(e)=>{
                                                                const newItems = [...selectedTrip.items]; newItems[idx].booking = e.target.value; setSelectedTrip({...selectedTrip, items: newItems});
                                                            }}
                                                        >
                                                            <option value="미정">미정 (Chưa)</option>
                                                            <option value="대기">대기 (Chờ)</option>
                                                            <option value="확정">확정 (OK)</option>
                                                        </select>
                                                    </td>

                                                    <td className="p-2 flex items-center gap-2">
                                                        <input className="excel-input text-xs text-slate-500" value={item.note} placeholder="메모 (Ghi chú)..." onChange={(e)=>{
                                                            const newItems = [...selectedTrip.items]; newItems[idx].note = e.target.value; setSelectedTrip({...selectedTrip, items: newItems});
                                                        }} />
                                                    </td>

                                                    <td className="p-2 text-center">
                                                        {userRole === 'admin' && <button onClick={()=>{
                                                            const newItems = selectedTrip.items.filter(i => i.id !== item.id);
                                                            setSelectedTrip({...selectedTrip, items: newItems});
                                                        }} className="text-slate-300 hover:text-red-500"><Icon name="trash-2" size={16} /></button>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                        {userRole === 'admin' && (
                                            <tfoot>
                                                <tr className="bg-slate-50 border-t-2 border-slate-200">
                                                    <td colSpan="3" className="p-4 text-center">
                                                        <button onClick={()=>{
                                                            const newId = Date.now();
                                                            setSelectedTrip({...selectedTrip, items: [...selectedTrip.items, { id: newId, date: selectedTrip.startDate, time: '', category: '', content: '', qty: 1, unit: '', costVnd: 0, priceVnd: 0, booking: '미정', note: '' }]});
                                                        }} className="text-xs font-bold bg-white border border-slate-300 px-4 py-2 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all shadow-sm flex items-center gap-2 mx-auto"><Icon name="plus" size={14} /> 행 추가 (Thêm dòng)</button>
                                                    </td>
                                                    <td colSpan="3" className="p-4 text-right font-black text-slate-500 uppercase text-xs tracking-widest">TOTAL (VND)</td>
                                                    <td className="p-4 text-right font-bold text-slate-400">{formatMoney(calculateTotal(selectedTrip.items, 'costVnd'), 'VND')}</td>
                                                    <td className="p-4 text-right font-black text-blue-600 text-lg">{formatMoney(calculateTotal(selectedTrip.items, 'priceVnd'), 'VND')}</td>
                                                    <td colSpan="4"></td>
                                                </tr>
                                            </tfoot>
                                        )}
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [authState, setAuthState] = useState({ isLoggedIn: false, role: null });
            const login = (role) => setAuthState({ isLoggedIn: true, role });
            const logout = () => setAuthState({ isLoggedIn: false, role: null });
            return authState.isLoggedIn ? <MainApp userRole={authState.role} onLogout={logout} /> : <LoginPage onLogin={login} />;
        };

        const LoginPage = ({ onLogin }) => {
            const [id, setId] = useState('');
            const [pw, setPw] = useState('');
            const [error, setError] = useState('');
            const handleLogin = (e) => {
                e.preventDefault();
                if (id === 'admin' && pw === '1234') onLogin('admin');
                else if (id === 'staff1' && pw === '1111') onLogin('staff1');
                else if (id === 'staff2' && pw === '2222') onLogin('staff2');
                else setError('ID hoặc Mật khẩu không đúng (정보 불일치)');
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-[#f1f5f9] p-6">
                    <div className="bg-white p-16 rounded-[3rem] shadow-2xl w-full max-w-md border border-slate-200">
                        <div className="flex justify-center mb-10"><KosviLogo /></div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <input type="text" className="w-full px-8 py-5 bg-slate-50 border border-slate-200 rounded-[2rem] outline-none font-bold text-center" placeholder="ID (admin / staff1 / staff2)" value={id} onChange={(e) => setId(e.target.value)} />
                            <input type="password" className="w-full px-8 py-5 bg-slate-50 border border-slate-200 rounded-[2rem] outline-none font-bold text-center" placeholder="PASSWORD" value={pw} onChange={(e) => setPw(e.target.value)} />
                            {error && <p className="text-red-500 text-xs font-bold text-center">{error}</p>}
                            <button type="submit" className="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black shadow-xl hover:bg-blue-700 transition-all uppercase tracking-widest">Đăng nhập (Login)</button>
                        </form>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
