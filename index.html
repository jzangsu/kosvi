<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSVI Travel Manager - Integrated System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; background-color: #f8fafc; }
        
        /* 모바일 최적화 및 공통 스타일 */
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #334155 100%); }
        .ceo-card { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; }
        
        /* 엑셀 스타일 입력 필드 */
        .excel-input { 
            background: transparent; border: 1px solid transparent; width: 100%; padding: 8px; 
            border-radius: 4px; transition: all 0.2s; font-size: 13px;
        }
        .excel-input:hover { border-color: #e2e8f0; background: #f8fafc; }
        .excel-input:focus { border-color: #3b82f6; background: #ffffff; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        
        /* 테이블 스타일 */
        .sticky-header th { position: sticky; top: 0; background: #f8fafc; z-index: 20; border-bottom: 2px solid #cbd5e1; }
        .table-row-hover:hover td { background-color: #f1f5f9; }

        /* 캘린더 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .calendar-day { min-height: 80px; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }

        /* 플로팅 버튼 (모바일용) */
        .fab-button { position: fixed; bottom: 24px; right: 24px; z-index: 50; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }

        /* 인쇄 전용 스타일 - 깔끔한 청구서 스타일 */
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { position: absolute; top: 0; left: 0; width: 100%; min-height: 100%; background: white; z-index: 9999; }
            .page-break { page-break-inside: avoid; }
            
            /* 청구서 디자인 */
            .invoice-header { border-bottom: 3px solid #2563eb; margin-bottom: 20px; padding-bottom: 10px; }
            .invoice-title { font-size: 24pt; font-weight: 900; color: #1e293b; letter-spacing: -1px; }
            .invoice-table th { background-color: #f1f5f9 !important; color: #475569 !important; font-weight: 800; border-bottom: 2px solid #cbd5e1; }
            .invoice-table td { border-bottom: 1px solid #e2e8f0; padding: 8px; }
            .invoice-total { background-color: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; padding: 15px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /**
         * [🚀 PROJECT MASTER GUIDE v20.0]
         * - 기능: PC/Mobile 반응형, 엑셀 자동계산, 달력, AM/PM, 한-베 병기, 청구서 스타일 견적서
         * - 사용자: 허창수 법인장 (KOSVI)
         * - 계정: admin(1234), staff1(1111), staff2(2222)
         */

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // AM/PM 변환기
        const formatTimeAMPM = (timeStr) => {
            if (!timeStr) return '';
            const [hour, minute] = timeStr.split(':');
            const h = parseInt(hour, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${minute} ${ampm}`;
        };

        // 화폐 포맷
        const formatMoney = (amount, currency = 'VND') => {
            if (!amount && amount !== 0) return '-';
            return Math.round(amount).toLocaleString() + (currency === 'VND' ? ' ₫' : currency === 'KRW' ? ' 원' : ' $');
        };

        // 오늘 날짜
        const getToday = () => new Date().toISOString().split('T')[0];

        // 로고
        const KosviLogo = ({ dark = false, small = false }) => (
            <div className="flex items-center gap-3">
                <div className={`${small ? 'w-8 h-8' : 'w-10 h-10'} rounded-lg flex items-center justify-center shadow-lg ${dark ? 'bg-slate-900' : 'bg-blue-600'}`}>
                    <span className="text-white font-black italic text-sm">K</span>
                </div>
                <div className="flex flex-col">
                    <span className={`${small ? 'text-lg' : 'text-xl'} font-black leading-none italic ${dark ? 'text-slate-900' : 'text-slate-800'}`}>KOSVI</span>
                    <span className="text-[8px] font-bold text-blue-600 tracking-widest uppercase">Vietnam Travel</span>
                </div>
            </div>
        );

        const INITIAL_TRIPS = [
            { 
                id: 1, 
                title: '임창호 님 호치민 3박 4일', 
                client: '임창호', 
                pax: 3, 
                startDate: '2026-01-13',
                endDate: '2026-01-16',
                exchangeRate: 5.54, 
                targetCurrency: 'KRW',
                status: '진행중',
                paymentStatus: '미입금',
                flightInfo: {
                    in: { flight: 'KE469', route: 'ICN-SGN', depTime: '09:05', arrTime: '12:40' },
                    out: { flight: 'KE470', route: 'SGN-ICN', depTime: '13:55', arrTime: '21:15' }
                },
                items: [
                    { id: 1, date: '2026-01-13', time: '12:40', category: '차량 (Xe)', content: '공항 픽업 (S2)', qty: 1, unit: '회', costVnd: 500000, priceVnd: 800000, booking: '확정', note: '기사 대기중' },
                    { id: 2, date: '2026-01-13', time: '15:00', category: '호텔 (KS)', content: '랜드마크 플러스 체크인', qty: 3, unit: '박', costVnd: 3650000, priceVnd: 4500000, booking: '대기', note: '' },
                    { id: 3, date: '2026-01-14', time: '08:30', category: '골프 (Golf)', content: '트윈도브스 18홀', qty: 3, unit: '명', costVnd: 3150000, priceVnd: 4200000, booking: '확정', note: '' }
                ]
            }
        ];

        const MainApp = ({ userRole, onLogout }) => {
            const [trips, setTrips] = useState(INITIAL_TRIPS);
            const [selectedTrip, setSelectedTrip] = useState(null);
            const [showQuote, setShowQuote] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // 계산 로직
            const calculateTotal = (items, type) => items.reduce((acc, item) => acc + (item[type] * item.qty), 0);
            const convert = (vnd, rate, curr) => curr === 'VND' ? vnd : curr === 'USD' ? vnd/24000 : vnd/rate;

            const handleAddTrip = () => {
                const newId = Date.now();
                const newTrip = {
                    id: newId,
                    title: '신규 일정',
                    client: '신규 고객',
                    pax: 1,
                    startDate: getToday(),
                    endDate: getToday(),
                    exchangeRate: 1,
                    targetCurrency: 'VND',
                    status: '견적중',
                    paymentStatus: '미입금',
                    flightInfo: { in: { flight: '', route: '', depTime: '', arrTime: '' }, out: { flight: '', route: '', depTime: '', arrTime: '' } },
                    items: [
                        { id: 1, date: getToday(), time: '09:00', category: '', content: '', qty: 1, unit: '', costVnd: 0, priceVnd: 0, booking: '미정', note: '' }
                    ]
                };
                setTrips([newTrip, ...trips]);
                setSelectedTrip(newTrip);
            };

            // 숫자 입력 핸들러 (콤마 자동)
            const NumberInput = ({ value, onChange, className, readOnly, placeholder }) => (
                <input
                    type="text"
                    className={className}
                    value={value ? Number(value).toLocaleString() : ''}
                    onChange={(e) => {
                        const val = e.target.value.replace(/,/g, '');
                        if (!isNaN(val)) onChange(Number(val));
                    }}
                    placeholder={placeholder || "0"}
                    readOnly={readOnly}
                />
            );

            // 견적서 뷰 (청구서 스타일)
            if (showQuote && selectedTrip) {
                const totalVND = calculateTotal(selectedTrip.items, 'priceVnd');
                const finalPrice = convert(totalVND, selectedTrip.exchangeRate, selectedTrip.targetCurrency);
                return (
                    <div className="fixed inset-0 z-[200] bg-slate-100 overflow-y-auto print-container">
                        <div className="max-w-[210mm] mx-auto min-h-screen bg-white p-8 md:p-12 shadow-lg my-0 md:my-10 relative print:m-0 print:shadow-none">
                            {/* 상단 툴바 */}
                            <div className="flex justify-between items-center mb-8 no-print sticky top-0 bg-white/90 backdrop-blur p-4 border-b border-slate-200 z-50">
                                <button onClick={() => setShowQuote(false)} className="text-slate-500 font-bold hover:text-slate-800 flex items-center gap-2"><Icon name="arrow-left" /> 뒤로가기</button>
                                <button onClick={() => window.print()} className="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-blue-700 flex items-center gap-2"><Icon name="printer" /> 인쇄/PDF 저장</button>
                            </div>

                            {/* 견적서 헤더 (청구서 스타일) */}
                            <div className="invoice-header flex flex-col md:flex-row justify-between items-start md:items-end">
                                <div>
                                    <KosviLogo dark={true} />
                                    <p className="text-slate-500 text-xs font-bold mt-2 tracking-widest uppercase">Travel Quotation</p>
                                </div>
                                <div className="text-left md:text-right mt-6 md:mt-0">
                                    <h1 className="invoice-title text-slate-800 uppercase tracking-tighter">ESTIMATE</h1>
                                    <p className="text-sm font-bold text-slate-500">Invoice #: {selectedTrip.id}-2026</p>
                                    <p className="text-sm font-bold text-slate-500">Date: {new Date().toLocaleDateString()}</p>
                                </div>
                            </div>

                            {/* 고객 및 항공 정보 */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 text-sm">
                                <div className="bg-slate-50 p-6 rounded-lg border border-slate-200">
                                    <h3 className="text-slate-500 font-bold text-xs uppercase mb-2">Bill To (고객 정보)</h3>
                                    <p className="text-lg font-bold text-slate-800">{selectedTrip.client} 님 <span className="text-slate-500 text-sm">({selectedTrip.pax}명)</span></p>
                                    <p className="text-slate-600 mt-1">{selectedTrip.startDate} ~ {selectedTrip.endDate}</p>
                                </div>
                                <div className="bg-slate-50 p-6 rounded-lg border border-slate-200">
                                    <h3 className="text-slate-500 font-bold text-xs uppercase mb-2">Flight Schedule (항공)</h3>
                                    <div className="space-y-2">
                                        <div className="flex justify-between border-b border-slate-200 pb-1">
                                            <span className="font-bold text-blue-600">IN</span>
                                            <span className="text-slate-700 font-medium">{selectedTrip.flightInfo.in.flight} | {formatTimeAMPM(selectedTrip.flightInfo.in.depTime)} ✈ {formatTimeAMPM(selectedTrip.flightInfo.in.arrTime)}</span>
                                        </div>
                                        <div className="flex justify-between pt-1">
                                            <span className="font-bold text-orange-600">OUT</span>
                                            <span className="text-slate-700 font-medium">{selectedTrip.flightInfo.out.flight} | {formatTimeAMPM(selectedTrip.flightInfo.out.depTime)} ✈ {formatTimeAMPM(selectedTrip.flightInfo.out.arrTime)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 상세 내역 테이블 (금액 숨김 옵션 적용 가능 - 현재는 숨김 상태) */}
                            <table className="w-full text-sm border-collapse mb-10 invoice-table">
                                <thead>
                                    <tr>
                                        <th className="p-3 text-left w-32">Date / Time</th>
                                        <th className="p-3 text-left">Description (내용)</th>
                                        <th className="p-3 text-center w-16">Qty</th>
                                        <th className="p-3 text-center w-16">Unit</th>
                                    </tr>
                                </thead>
                                <tbody className="text-slate-700">
                                    {selectedTrip.items.map((item, idx) => (
                                        <tr key={idx} className="page-break">
                                            <td className="align-top bg-slate-50/50 font-bold text-slate-700">
                                                <div>{item.date}</div>
                                                <div className="text-blue-600 text-xs mt-1">{formatTimeAMPM(item.time)}</div>
                                            </td>
                                            <td className="align-top">
                                                <div className="font-bold text-slate-800">{item.content}</div>
                                                <div className="text-xs text-slate-400 mt-1">{item.category}</div>
                                            </td>
                                            <td className="text-center align-top">{item.qty}</td>
                                            <td className="text-center align-top text-slate-500">{item.unit}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            {/* 합계 금액 (Total) */}
                            <div className="flex justify-end mb-12 page-break">
                                <div className="text-right invoice-total w-full md:w-1/2">
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-slate-500 text-sm font-bold uppercase">Subtotal</span>
                                        <span className="text-slate-700 font-bold text-lg">{formatMoney(finalPrice, selectedTrip.targetCurrency)}</span>
                                    </div>
                                    <div className="border-t border-slate-300 my-2"></div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-blue-600 text-lg font-black uppercase">Total Amount</span>
                                        <span className="text-3xl font-black text-slate-800">{formatMoney(finalPrice, selectedTrip.targetCurrency)}</span>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-3 font-medium text-right">* 환율(Rate): {selectedTrip.exchangeRate} 적용 기준</p>
                                </div>
                            </div>

                            {/* 하단 계좌 정보 */}
                            <div className="bg-slate-50 p-6 rounded-lg border-l-4 border-blue-600 page-break">
                                <div className="flex flex-col md:flex-row justify-between gap-8">
                                    <div>
                                        <h4 className="font-bold text-slate-800 mb-2 flex items-center gap-2 text-sm uppercase"><Icon name="credit-card" size={16} /> Payment Info</h4>
                                        {selectedTrip.targetCurrency === 'KRW' ? (
                                            <p className="font-medium text-slate-700">KRW: 토스뱅크 1000-1841-9143 (예금주: 허창수)</p>
                                        ) : (
                                            <p className="font-medium text-slate-700">VND: 신한베트남 077-890-1861 (HEO CHANGSU)</p>
                                        )}
                                    </div>
                                    <div className="text-right text-xs text-slate-400 space-y-1">
                                        <p className="font-bold text-slate-600">KOSVI TRAVEL CO., LTD</p>
                                        <p>Landmark Plus, Vinhomes Central Park, HCM</p>
                                        <p>Tel: 0286-270-6413 | 077-890-1861</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-[#f1f5f9] text-slate-900 overflow-hidden animate-fade-in no-print">
                    {/* 모바일 메뉴 버튼 */}
                    <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden fixed top-4 right-4 z-50 bg-slate-900 text-white p-2 rounded-lg shadow-lg">
                        <Icon name="menu" />
                    </button>

                    {/* 사이드바 (PC/Mobile 공용) */}
                    <aside className={`fixed md:relative inset-y-0 left-0 w-64 bg-slate-900 text-white flex-col shrink-0 shadow-2xl z-40 transform transition-transform duration-300 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-6 bg-white"><KosviLogo /></div>
                        <div className="p-6">
                            <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
                                <p className="text-[10px] text-slate-400 font-bold uppercase mb-1">USER</p>
                                <span className="font-bold text-blue-400">{userRole.toUpperCase()}</span>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            <button className="w-full flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-xl text-white font-bold text-sm shadow-lg"><Icon name="layout-dashboard" /> 통합 관리 (Master)</button>
                        </nav>
                        <div className="p-6"><button onClick={onLogout} className="w-full py-3 bg-slate-800 hover:bg-red-900 rounded-xl text-xs font-bold transition-all text-slate-300">LOGOUT</button></div>
                    </aside>

                    <main className="flex-1 overflow-y-auto flex flex-col w-full relative" onClick={() => setIsMobileMenuOpen(false)}>
                        {/* 헤더 */}
                        <header className="glass-panel sticky top-0 px-6 py-4 flex justify-between items-center z-20 shadow-sm">
                            <h2 className="text-xl md:text-2xl font-black text-slate-800 tracking-tight">KOSVI MASTER</h2>
                            <div className="flex items-center gap-3">
                                <div className="relative hidden md:block">
                                    <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input type="text" placeholder="Search..." className="pl-9 pr-4 py-2 rounded-xl border border-slate-200 outline-none text-sm w-48 focus:w-64 transition-all" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                </div>
                                {userRole === 'admin' && <button onClick={handleAddTrip} className="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-lg flex items-center gap-2 hover:bg-slate-800 transition-all"><Icon name="plus" size={18} /> <span className="hidden md:inline">New</span></button>}
                            </div>
                        </header>

                        <div className="p-4 md:p-8 max-w-[1600px] mx-auto w-full">
                            {/* 리스트 카드 뷰 */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                {trips.filter(t => t.client.includes(searchTerm)).map(trip => (
                                    <div key={trip.id} onClick={() => setSelectedTrip({...trip})} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl transition-all cursor-pointer group relative overflow-hidden">
                                        <div className="relative z-10">
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <h4 className="font-black text-xl text-slate-800">{trip.client} <span className="text-sm font-medium text-slate-400">({trip.pax}명)</span></h4>
                                                    <p className="text-xs text-blue-600 font-bold mt-1">{trip.startDate} ~ {trip.endDate}</p>
                                                </div>
                                                <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase ${trip.bookingStatus === '확정' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>{trip.bookingStatus}</span>
                                            </div>
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs font-medium text-slate-500 space-y-1 mb-4">
                                                <div className="flex justify-between"><span>IN: {trip.flightInfo.in.flight}</span> <span>{formatTimeAMPM(trip.flightInfo.in.arrTime)} 도착</span></div>
                                                <div className="flex justify-between"><span>OUT: {trip.flightInfo.out.flight}</span> <span>{formatTimeAMPM(trip.flightInfo.out.depTime)} 출발</span></div>
                                            </div>
                                            {userRole === 'admin' && (
                                                <div className="flex justify-between items-end border-t border-slate-100 pt-4">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase">Est. Revenue</span>
                                                    <span className="text-xl font-black text-slate-800">{formatMoney(convert(calculateTotal(trip.items, 'priceVnd'), trip.exchangeRate, trip.targetCurrency), trip.targetCurrency)}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* 통합 편집 모달 */}
                    {selectedTrip && (
                        <div className="fixed inset-0 z-[100] bg-white flex flex-col animate-fade-in">
                            {/* 모달 헤더 */}
                            <div className="px-6 py-4 bg-slate-900 text-white flex justify-between items-center shrink-0 shadow-md">
                                <div className="flex items-center gap-4">
                                    <button onClick={() => setSelectedTrip(null)} className="p-2 bg-white/10 rounded-full"><Icon name="arrow-left" /></button>
                                    <div>
                                        <h3 className="text-lg font-black">{selectedTrip.client}</h3>
                                        <p className="text-[10px] text-slate-400">{selectedTrip.startDate} ~ {selectedTrip.endDate}</p>
                                    </div>
                                </div>
                                {userRole === 'admin' && <button onClick={() => setShowCustomerQuote(true)} className="bg-green-600 px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2"><Icon name="printer" /> <span className="hidden md:inline">견적서</span></button>}
                            </div>

                            {/* 환율 및 통화 설정 (Admin Only) - 모바일 최적화 */}
                            {userRole === 'admin' && (
                                <div className="bg-slate-800 p-4 flex flex-wrap gap-4 items-center text-xs text-white border-t border-slate-700 shrink-0">
                                    <div className="flex items-center gap-2">
                                        <span className="text-slate-400 font-bold">환율:</span>
                                        <input type="number" className="bg-slate-700 border-none rounded px-2 py-1 w-16 text-center font-bold outline-none" value={selectedTrip.exchangeRate} onChange={(e) => setSelectedTrip({...selectedTrip, exchangeRate: parseFloat(e.target.value)})} />
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-slate-400 font-bold">통화:</span>
                                        <select className="bg-slate-700 border-none rounded px-2 py-1 outline-none font-bold" value={selectedTrip.targetCurrency} onChange={(e) => setSelectedTrip({...selectedTrip, targetCurrency: e.target.value})}><option value="KRW">KRW</option><option value="USD">USD</option><option value="VND">VND</option></select>
                                    </div>
                                    <div className="ml-auto text-green-400 font-black text-lg">
                                        {formatMoney(convert(calculateTotal(selectedTrip.items, 'priceVnd'), selectedTrip.exchangeRate, selectedTrip.targetCurrency), selectedTrip.targetCurrency)}
                                    </div>
                                </div>
                            )}

                            {/* 메인 엑셀 시트 (가로 스크롤 가능) */}
                            <div className="flex-1 overflow-auto bg-white p-4">
                                <div className="min-w-[1000px] md:min-w-full">
                                    <table className="w-full text-sm border-collapse">
                                        <thead className="sticky-header text-[11px] text-slate-500 uppercase tracking-wider font-bold">
                                            <tr>
                                                <th className="p-3 text-center w-32">Date (날짜)</th>
                                                <th className="p-3 text-center w-24">Time (시간)</th>
                                                <th className="p-3 w-28 text-center">Type (분류)</th>
                                                <th className="p-3 w-[25%]">Description (내용)</th>
                                                <th className="p-3 text-center w-12">Qty</th>
                                                <th className="p-3 text-center w-12">Unit</th>
                                                
                                                {userRole === 'admin' ? (
                                                    <>
                                                        <th className="p-3 text-right bg-red-50 w-24">Cost</th>
                                                        <th className="p-3 text-right bg-red-50 w-24">Sum(Cost)</th>
                                                        <th className="p-3 text-right bg-blue-50 w-24">Price</th>
                                                        <th className="p-3 text-right bg-blue-50 w-24">Sum(Price)</th>
                                                    </>
                                                ) : null}

                                                <th className="p-3 text-center w-24">Booking</th>
                                                <th className="p-3 w-40">Note (메모)</th>
                                                <th className="p-3 w-10"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-medium text-slate-700 text-xs">
                                            {selectedTrip.items.map((item, idx) => (
                                                <tr key={item.id} className="group hover:bg-slate-50 border-b border-slate-100">
                                                    <td className="p-2">
                                                        <input type="date" className="excel-input font-bold" value={item.date} onChange={(e)=> { const n=[...selectedTrip.items]; n[idx].date=e.target.value; setSelectedTrip({...selectedTrip, items:n}); }} />
                                                    </td>
                                                    <td className="p-2">
                                                        <input type="time" className="excel-input text-center text-blue-600 font-bold" value={item.time} onChange={(e)=> { const n=[...selectedTrip.items]; n[idx].time=e.target.value; setSelectedTrip({...selectedTrip, items:n}); }} />
                                                        <div className="text-[9px] text-center text-slate-400">{formatTimeAMPM(item.time)}</div>
                                                    </td>
                                                    <td className="p-2"><input className="excel-input text-center text-slate-500" value={item.category} onChange={(e)=> { const n=[...selectedTrip.items]; n[idx].category=e.target.value; setSelectedTrip({...selectedTrip, items:n}); }} /></td>
                                                    <td className="p-2"><input className="excel-input font-bold text-slate-800" value={item.content} onChange={(e)=> { const n=[...selectedTrip.items]; n[idx].content=e.target.value; setSelectedTrip({...selectedTrip, items:n}); }} /></td>
                                                    <td className="p-2"><input type="number" className="excel-input text-center" value={item.qty} onChange={(e)=> { const n=[...selectedTrip.items]; n[idx].qty=Number(e.target.value); setSelectedTrip({...selectedTrip, items:n}); }} /></td>
                                                    <td className="p-2"><input className="excel-input text-center" value={item.unit} onChange={(e)=> { const n=[...selectedTrip.items]; n[idx].unit=e.target.value; setSelectedTrip({...selectedTrip, items:n}); }} /></td>

                                                    {userRole === 'admin' ? (
                                                        <>
                                                            <td className="p-2 bg-red-50/30"><NumberInput className="excel-input text-right text-red-400" value={item.costVnd} onChange={(val)=> { const n=[...selectedTrip.items]; n[idx].costVnd=val; setSelectedTrip({...selectedTrip, items:n}); }} /></td>
                                                            <td className="p-2 bg-red-50/50 text-right font-bold text-red-600">{formatMoney(item.costVnd * item.qty, 'VND')}</td>
                                                            <td className="p-2 bg-blue-50/30"><NumberInput className="excel-input text-right text-blue-500" value={item.priceVnd} onChange={(val)=> { const n=[...selectedTrip.items]; n[idx].priceVnd=val; setSelectedTrip({...selectedTrip, items:n}); }} /></td>
                                                            <td className="p-2 bg-blue-50/50 text-right font-bold text-blue-700">{formatMoney(item.priceVnd * item.qty, 'VND')}</td>
                                                        </>
                                                    ) : null}

                                                    <td className="p-2 text-center">
                                                        <select className={`text-[10px] font-bold px-2 py-1 rounded border outline-none ${item.booking === '확정' ? 'bg-green-100 text-green-800' : 'bg-orange-100'}`} value={item.booking} onChange={(e)=> { const n=[...selectedTrip.items]; n[idx].booking=e.target.value; setSelectedTrip({...selectedTrip, items:n}); }}><option>미정</option><option>대기</option><option>확정</option></select>
                                                    </td>
                                                    <td className="p-2"><input className="excel-input text-slate-500" value={item.note} placeholder="메모..." onChange={(e)=> { const n=[...selectedTrip.items]; n[idx].note=e.target.value; setSelectedTrip({...selectedTrip, items:n}); }} /></td>
                                                    <td className="p-2 text-center">{userRole === 'admin' && <button onClick={()=>{ const n=selectedTrip.items.filter(i=>i.id!==item.id); setSelectedTrip({...selectedTrip, items:n}); }} className="text-slate-300 hover:text-red-500"><Icon name="trash-2" size={14} /></button>}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {userRole === 'admin' && (
                                        <div className="mt-8 mb-20 text-center">
                                            <button onClick={()=>{ const newId=Date.now(); setSelectedTrip({...selectedTrip, items:[...selectedTrip.items, {id:newId, date:getToday(), time:'09:00', category:'', content:'', qty:1, unit:'', costVnd:0, priceVnd:0, booking:'미정', note:''}]}); }} className="bg-slate-100 text-slate-600 px-6 py-3 rounded-full font-bold shadow-sm hover:bg-slate-200 inline-flex items-center gap-2"><Icon name="plus" /> 행 추가</button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* 플로팅 저장 버튼 (모바일/PC 공용) */}
                            <button onClick={() => { alert('저장되었습니다. (Đã lưu)'); setSelectedTrip(null); }} className="fab-button bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-2xl flex items-center justify-center transition-transform hover:scale-110 active:scale-95">
                                <Icon name="save" size={24} />
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [authState, setAuthState] = useState({ isLoggedIn: false, role: null });
            const login = (role) => setAuthState({ isLoggedIn: true, role });
            const logout = () => setAuthState({ isLoggedIn: false, role: null });
            return authState.isLoggedIn ? <MainApp userRole={authState.role} onLogout={logout} /> : <LoginPage onLogin={login} />;
        };

        const LoginPage = ({ onLogin }) => {
            const [id, setId] = useState(''); const [pw, setPw] = useState(''); const [error, setError] = useState('');
            const handleLogin = (e) => { e.preventDefault(); if(id==='admin'&&pw==='1234') onLogin('admin'); else if((id==='staff1'&&pw==='1111')||(id==='staff2'&&pw==='2222')) onLogin(id); else setError('Login Failed'); };
            return (
                <div className="min-h-screen flex items-center justify-center bg-[#f1f5f9] p-4">
                    <div className="bg-white p-10 rounded-3xl shadow-xl w-full max-w-sm">
                        <div className="flex justify-center mb-8"><KosviLogo /></div>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none font-bold text-center" placeholder="ID" value={id} onChange={e=>setId(e.target.value)} />
                            <input type="password" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none font-bold text-center" placeholder="PW" value={pw} onChange={e=>setPw(e.target.value)} />
                            {error && <p className="text-red-500 text-xs text-center font-bold">{error}</p>}
                            <button className="w-full bg-blue-600 text-white p-4 rounded-xl font-bold shadow-lg">LOGIN</button>
                        </form>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
