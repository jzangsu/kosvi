<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSVI Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .animate-slide-up { animation: slideUp 0.5s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 인쇄 시 설정 */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; height: auto; overflow: visible; }
            #content-area { padding: 0; overflow: visible; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-hidden h-screen font-sans">

    <!-- 1. 로그인/외부 접속 페이지 -->
    <div id="login-view" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-[#1E3A8A] to-[#111827] relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
            <div class="absolute top-10 left-10 w-64 h-64 bg-white rounded-full blur-3xl mix-blend-overlay"></div>
            <div class="absolute bottom-10 right-10 w-96 h-96 bg-orange-500 rounded-full blur-3xl mix-blend-overlay"></div>
        </div>

        <div class="bg-white/10 backdrop-blur-lg border border-white/20 p-8 rounded-2xl shadow-2xl w-full max-w-md mx-4 animate-slide-up relative z-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-[#F97316] rounded-2xl flex items-center justify-center shadow-lg mx-auto mb-4 transform rotate-3">
                    <span class="text-3xl font-black italic text-white">K</span>
                </div>
                <h1 class="text-2xl font-black text-white tracking-tight">KOSVI ERP</h1>
                <p class="text-blue-200 text-sm mt-1 font-medium tracking-wider">여행사 통합 관리 시스템</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div class="bg-slate-900/50 p-1 rounded-xl flex mb-4 border border-white/10">
                    <button type="button" onclick="selectRole('admin')" id="role-admin" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-[#F97316] text-white shadow-md">
                        관리자 (Admin)
                    </button>
                    <button type="button" onclick="selectRole('staff')" id="role-staff" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">
                        직원 (Staff)
                    </button>
                </div>

                <div>
                    <label class="block text-xs font-bold text-blue-200 uppercase mb-1.5 ml-1">ID (Email)</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                        <input type="email" id="input-email" value="admin@daewoongvina.com" class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#F97316] transition-all" placeholder="이메일 주소 입력">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-blue-200 uppercase mb-1.5 ml-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                        <input type="password" value="password123" class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#F97316] transition-all" placeholder="비밀번호 입력">
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 bg-[#F97316] hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg shadow-orange-900/30 transition-all transform active:scale-95 mt-6 flex items-center justify-center gap-2">
                    <span>시스템 접속</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
            
            <div class="mt-6 pt-6 border-t border-white/10 flex justify-center">
                <a href="https://kosvi-travel.web.app/" target="_blank" class="text-xs text-blue-300 hover:text-white flex items-center gap-1 transition-colors">
                    <i data-lucide="globe" class="w-3 h-3"></i> KOSVI 홈페이지로 이동
                </a>
            </div>
        </div>
    </div>

    <!-- 2. 메인 대시보드 -->
    <div id="main-view" class="hidden w-full h-full flex animate-fade-in">
        <!-- 사이드바 (인쇄시 숨김) -->
        <nav class="w-64 bg-[#1E3A8A] text-white flex flex-col shadow-2xl flex-shrink-0 no-print">
            <div class="p-6 flex items-center gap-3">
                <div class="w-10 h-10 bg-[#F97316] rounded flex items-center justify-center shadow-lg">
                    <span class="text-xl font-black italic">K</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight leading-none">KOSVI</h1>
                    <p class="text-[10px] text-orange-400 font-bold tracking-widest mt-1">TRAVEL</p>
                </div>
            </div>

            <div class="flex-1 px-4 py-4 space-y-1">
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors bg-white/10 font-bold">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> <span>대시보드</span>
                </button>
                <button onclick="switchTab('bookings')" id="btn-bookings" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors hover:bg-white/5 text-slate-300">
                    <i data-lucide="calendar-days" class="w-5 h-5"></i> <span>예약 현황</span>
                </button>
                <button onclick="switchTab('estimate')" id="btn-estimate" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors hover:bg-white/5 text-slate-300">
                    <i data-lucide="file-text" class="w-5 h-5"></i> <span>견적서 작성</span>
                </button>
            </div>

            <div class="p-6 border-t border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-700 rounded-full flex items-center justify-center text-xs font-bold border border-white/20" id="user-avatar">허</div>
                    <div class="text-xs">
                        <p class="font-bold" id="user-name">허창수 법인장</p>
                        <p class="opacity-60 text-[10px]" id="user-role">Master Admin</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="mt-3 w-full py-2 border border-white/20 rounded-lg text-[10px] text-blue-200 hover:bg-white/5 hover:text-white transition-colors flex items-center justify-center gap-1">
                    <i data-lucide="log-out" class="w-3 h-3"></i> 로그아웃
                </button>
            </div>
        </nav>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
            <!-- 헤더 (인쇄시 숨김) -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0 shadow-sm no-print">
                <div class="flex items-center gap-2">
                    <i data-lucide="map-pin" class="w-3 h-3 text-[#F97316]"></i>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Vietnam Head Office</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:block text-right">
                        <p class="text-[10px] text-slate-400 font-bold uppercase leading-none">Today</p>
                        <p class="text-xs font-bold mt-1">2026. 01. 08</p>
                    </div>
                </div>
            </header>

            <!-- 뷰포트 -->
            <div class="flex-1 overflow-y-auto p-8" id="content-area">
                <!-- 콘텐츠 주입 영역 -->
            </div>
        </main>
    </div>

    <script>
        // --- Global State ---
        let currentRole = 'admin';
        let currentTab = 'dashboard';
        
        // --- Mock Data ---
        let bookings = [
            { id: 'BK001', customer: '김철수', tour: '다낭 3박 4일 패키지', date: '2026-02-15', price: 25000000, status: 'Confirmed', payment: 'Paid' },
            { id: 'BK002', customer: '이영희', tour: '나트랑 골프 투어', date: '2026-03-01', price: 42000000, status: 'Pending', payment: 'Partial' },
            { id: 'BK003', customer: '임창호', tour: '호치민-무이네 투어', date: '2024-03-13', price: 75400000, status: 'Completed', payment: 'Paid' },
        ];

        // --- Helper Functions ---
        const formatVND = (price) => price.toLocaleString() + ' ₫';
        const formatKRW = (price) => '₩' + price.toLocaleString();

        // --- Auth Logic ---
        function selectRole(role) {
            currentRole = role;
            const adminBtn = document.getElementById('role-admin');
            const staffBtn = document.getElementById('role-staff');
            const emailInput = document.getElementById('input-email');
            
            if (role === 'admin') {
                adminBtn.className = "flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-[#F97316] text-white shadow-md";
                staffBtn.className = "flex-1 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                emailInput.value = "admin@daewoongvina.com";
            } else {
                adminBtn.className = "flex-1 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                staffBtn.className = "flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-[#F97316] text-white shadow-md";
                emailInput.value = "staff@kosvi.com";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            
            if (currentRole === 'admin') {
                document.getElementById('btn-dashboard').classList.remove('hidden');
                document.getElementById('btn-estimate').classList.remove('hidden');
                document.getElementById('user-name').innerText = "허창수 법인장";
                document.getElementById('user-role').innerText = "Master Admin";
                document.getElementById('user-avatar').innerText = "허";
                switchTab('dashboard');
            } else {
                document.getElementById('btn-dashboard').classList.add('hidden');
                document.getElementById('btn-estimate').classList.add('hidden'); // 직원에게 견적서 숨김 (선택사항)
                document.getElementById('user-name').innerText = "김직원 매니저";
                document.getElementById('user-role').innerText = "Staff";
                document.getElementById('user-avatar').innerText = "김";
                switchTab('bookings');
            }
            lucide.createIcons();
        }

        function handleLogout() {
            if(confirm('로그아웃 하시겠습니까?')) window.location.reload();
        }

        // --- Tab Rendering Logic ---
        function switchTab(tab) {
            currentTab = tab;
            
            // UI 업데이트
            ['dashboard', 'bookings', 'estimate'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if(btn) btn.className = `w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors ${tab === t ? 'bg-white/10 font-bold' : 'hover:bg-white/5 text-slate-300'}`;
            });

            const content = document.getElementById('content-area');
            
            if (tab === 'dashboard') content.innerHTML = renderDashboard();
            else if (tab === 'bookings') content.innerHTML = renderBookings();
            else if (tab === 'estimate') renderEstimate(); // 함수 내에서 innerHTML 처리
            
            lucide.createIcons();
        }

        // --- View 1: Dashboard ---
        function renderDashboard() {
            if (currentRole === 'staff') return `<div class="p-8 text-center text-slate-400">권한이 없습니다.</div>`;
            return `
                <div class="space-y-8 max-w-7xl animate-fade-in">
                    <h2 class="text-2xl font-bold text-slate-800">대시보드</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm"><p class="text-slate-400 text-xs font-bold uppercase">총 매출 (VND)</p><h3 class="text-2xl font-bold">142,400,000 ₫</h3></div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm"><p class="text-slate-400 text-xs font-bold uppercase">진행 중인 예약</p><h3 class="text-2xl font-bold">3건</h3></div>
                    </div>
                </div>`;
        }

        // --- View 2: Bookings ---
        function renderBookings() {
            return `
                <div class="space-y-6 max-w-7xl animate-fade-in">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-slate-800">예약 통합 관리</h2>
                        <button onclick="switchTab('estimate')" class="bg-[#1E3A8A] text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-blue-900 transition-colors flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> 견적서 작성 / 예약 추가
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[11px] font-bold text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                <tr><th class="px-6 py-5">ID</th><th class="px-6 py-5">고객명</th><th class="px-6 py-5">투어 상품</th><th class="px-6 py-5">출발일</th><th class="px-6 py-5">금액 (VND)</th><th class="px-6 py-5">상태</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-50 text-sm">
                                ${bookings.map(b => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="px-6 py-4 font-bold text-blue-900">${b.id}</td>
                                        <td class="px-6 py-4 font-medium">${b.customer}</td>
                                        <td class="px-6 py-4 text-slate-600">${b.tour}</td>
                                        <td class="px-6 py-4 text-slate-500">${b.date}</td>
                                        <td class="px-6 py-4 font-bold">${formatVND(b.price)}</td>
                                        <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600">${b.status}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        // --- View 3: Estimate Builder (견적서 작성) ---
        let estimateItems = [
            { type: 'HOTEL', desc: '빈펄 랜드마크 81 (3박)', unit: '박', price: 3600000, qty: 3, markup: 1.1, cost: 3200000 },
            { type: 'CAR', desc: '16인승 리무진 (전일정)', unit: '일', price: 2500000, qty: 4, markup: 1.2, cost: 2000000 },
        ];

        function renderEstimate() {
            const content = document.getElementById('content-area');
            content.innerHTML = `
                <div class="max-w-5xl mx-auto animate-fade-in pb-20">
                    <!-- 상단 컨트롤 (인쇄 시 숨김) -->
                    <div class="flex justify-between items-center mb-6 no-print">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800">견적서 작성</h2>
                            <p class="text-sm text-slate-500">엑셀 양식 기반 자동 계산 시스템</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.print()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-bold hover:bg-slate-200 transition-colors flex items-center gap-2">
                                <i data-lucide="printer" class="w-4 h-4"></i> 인쇄 / PDF 저장
                            </button>
                            <button onclick="saveEstimate()" class="px-4 py-2 bg-[#F97316] text-white rounded-lg text-sm font-bold hover:bg-orange-600 transition-colors shadow-lg flex items-center gap-2">
                                <i data-lucide="save" class="w-4 h-4"></i> 예약 저장
                            </button>
                        </div>
                    </div>

                    <!-- 견적서 본문 (A4 스타일) -->
                    <div class="bg-white p-10 shadow-2xl rounded-sm print:shadow-none print:p-0" id="estimate-paper">
                        
                        <!-- 헤더 -->
                        <div class="flex justify-between items-start border-b-2 border-slate-800 pb-6 mb-8">
                            <div>
                                <h1 class="text-3xl font-black text-[#1E3A8A] tracking-tight">ESTIMATE</h1>
                                <p class="text-sm font-bold text-slate-400 mt-1">견적서 / QUOTATION</p>
                            </div>
                            <div class="text-right">
                                <h3 class="text-lg font-black text-slate-800">KOSVI CO.,LTD</h3>
                                <p class="text-xs text-slate-500 mt-1">LP-38.OT03 Landmark Plus, Vinhomes Central Park<br>Binh Thanh Dist, HCMC</p>
                                <p class="text-xs text-slate-500">Tel: 077 890 1861 | Admin: Heo Changsu</p>
                            </div>
                        </div>

                        <!-- 고객 정보 입력 -->
                        <div class="grid grid-cols-2 gap-8 mb-8">
                            <div class="space-y-3">
                                <div class="flex items-center">
                                    <label class="w-24 text-xs font-bold text-slate-500 uppercase">고객명</label>
                                    <input type="text" value="임창호 님" class="flex-1 border-b border-slate-200 py-1 px-2 text-sm font-bold text-slate-800 focus:outline-none focus:border-blue-500 bg-transparent">
                                </div>
                                <div class="flex items-center">
                                    <label class="w-24 text-xs font-bold text-slate-500 uppercase">여행 일정</label>
                                    <input type="text" value="2024-03-13 ~ 03-16" class="flex-1 border-b border-slate-200 py-1 px-2 text-sm text-slate-800 focus:outline-none focus:border-blue-500 bg-transparent">
                                </div>
                                <div class="flex items-center">
                                    <label class="w-24 text-xs font-bold text-slate-500 uppercase">인원</label>
                                    <input type="number" value="3" class="w-20 border-b border-slate-200 py-1 px-2 text-sm text-slate-800 focus:outline-none focus:border-blue-500 bg-transparent">
                                    <span class="text-sm text-slate-500 ml-2">명</span>
                                </div>
                            </div>
                            <div class="space-y-3 bg-slate-50 p-4 rounded-lg no-print">
                                <p class="text-xs font-bold text-orange-600 mb-2 flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> 관리자 전용 (환율 설정)</p>
                                <div class="flex items-center justify-between">
                                    <label class="text-xs text-slate-500">적용 환율 (VND/KRW)</label>
                                    <input type="number" value="5.5" class="w-24 text-right border rounded px-2 py-1 text-sm font-bold">
                                </div>
                            </div>
                        </div>

                        <!-- 견적 테이블 -->
                        <div class="mb-8">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-[#1E3A8A] text-white text-xs uppercase tracking-wider">
                                        <th class="p-3 rounded-tl-lg">구분 (Type)</th>
                                        <th class="p-3">내용 (Description)</th>
                                        <th class="p-3 text-center">수량</th>
                                        <th class="p-3 text-right">단가 (VND)</th>
                                        <th class="p-3 text-right rounded-tr-lg">합계 (VND)</th>
                                        <th class="p-3 bg-orange-600 w-10 text-center no-print">삭제</th>
                                    </tr>
                                </thead>
                                <tbody id="estimate-tbody" class="text-sm text-slate-700 divide-y divide-slate-100">
                                    <!-- JS로 렌더링 -->
                                </tbody>
                                <tfoot>
                                    <tr class="bg-slate-50 font-black text-slate-800 border-t-2 border-slate-200">
                                        <td colspan="4" class="p-4 text-right">총 합계 (Total Amount)</td>
                                        <td class="p-4 text-right text-lg text-[#1E3A8A]" id="total-price-display">0 ₫</td>
                                        <td class="no-print"></td>
                                    </tr>
                                </tfoot>
                            </table>
                            <button onclick="addItem()" class="mt-4 w-full py-2 border-2 border-dashed border-slate-300 text-slate-400 rounded-lg hover:border-blue-500 hover:text-blue-500 transition-colors font-bold text-sm flex items-center justify-center gap-2 no-print">
                                <i data-lucide="plus" class="w-4 h-4"></i> 항목 추가하기
                            </button>
                        </div>

                        <!-- 포함/불포함 사항 -->
                        <div class="grid grid-cols-2 gap-6 mb-8 text-xs">
                            <div class="bg-blue-50 p-4 rounded-lg">
                                <h4 class="font-bold text-blue-800 mb-2">■ 포함사항 (Included)</h4>
                                <ul class="list-disc list-inside space-y-1 text-slate-600">
                                    <li>전 일정 전용 차량 (기사 포함)</li>
                                    <li>호텔 조식 및 일정상 식사</li>
                                    <li>관광지 입장료</li>
                                </ul>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-lg">
                                <h4 class="font-bold text-slate-600 mb-2">□ 불포함사항 (Excluded)</h4>
                                <ul class="list-disc list-inside space-y-1 text-slate-500">
                                    <li>국제선 항공권</li>
                                    <li>개인 경비 및 매너팁</li>
                                    <li>여행자 보험</li>
                                </ul>
                            </div>
                        </div>

                        <!-- 하단 계좌 정보 -->
                        <div class="border-t border-slate-200 pt-6 text-center">
                            <p class="text-sm font-bold text-slate-800 mb-1">입금 계좌 (Bank Account)</p>
                            <p class="text-sm text-slate-600">신한베트남 (Shinhan Vietnam): <span class="font-bold text-[#1E3A8A]">077 - 890 - 1861</span> (예금주: HEO CHANGSU)</p>
                        </div>
                    </div>
                    
                    <!-- 관리자용 마진 분석 (인쇄시 숨김) -->
                    <div class="mt-8 bg-slate-800 text-white p-6 rounded-xl shadow-lg no-print">
                        <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-orange-400">
                            <i data-lucide="pie-chart" class="w-5 h-5"></i> 관리자 전용 수익 분석 (Profit Analysis)
                        </h3>
                        <div class="grid grid-cols-3 gap-8 text-center">
                            <div>
                                <p class="text-slate-400 text-xs uppercase mb-1">총 원가 (Total Cost)</p>
                                <p class="text-xl font-bold" id="admin-total-cost">0 ₫</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs uppercase mb-1">총 판매가 (Selling Price)</p>
                                <p class="text-xl font-bold text-blue-300" id="admin-total-price">0 ₫</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs uppercase mb-1">예상 수익 (Profit)</p>
                                <p class="text-xl font-bold text-orange-400" id="admin-profit">0 ₫</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            renderEstimateItems();
        }

        function renderEstimateItems() {
            const tbody = document.getElementById('estimate-tbody');
            if(!tbody) return;

            let totalCost = 0;
            let totalPrice = 0;

            tbody.innerHTML = estimateItems.map((item, index) => {
                const itemTotal = item.price * item.qty;
                const itemCostTotal = item.cost * item.qty; // 원가 합계
                totalPrice += itemTotal;
                totalCost += itemCostTotal;

                return `
                <tr class="group hover:bg-slate-50">
                    <td class="p-3">
                        <select onchange="updateItem(${index}, 'type', this.value)" class="w-full bg-transparent font-bold text-slate-700 focus:outline-none">
                            <option value="HOTEL" ${item.type==='HOTEL'?'selected':''}>호텔 (Hotel)</option>
                            <option value="CAR" ${item.type==='CAR'?'selected':''}>차량 (Vehicle)</option>
                            <option value="GOLF" ${item.type==='GOLF'?'selected':''}>골프 (Golf)</option>
                            <option value="TOUR" ${item.type==='TOUR'?'selected':''}>투어 (Tour)</option>
                            <option value="MEAL" ${item.type==='MEAL'?'selected':''}>식사 (Meal)</option>
                        </select>
                    </td>
                    <td class="p-3">
                        <input type="text" value="${item.desc}" onchange="updateItem(${index}, 'desc', this.value)" class="w-full bg-transparent focus:outline-none border-b border-transparent focus:border-blue-300">
                    </td>
                    <td class="p-3 text-center">
                        <input type="number" value="${item.qty}" onchange="updateItem(${index}, 'qty', this.value)" class="w-12 text-center bg-slate-100 rounded focus:outline-none">
                    </td>
                    <td class="p-3 text-right">
                        <div class="flex flex-col items-end">
                            <input type="number" value="${item.price}" onchange="updateItem(${index}, 'price', this.value)" class="w-24 text-right font-bold bg-transparent focus:outline-none">
                            <span class="text-[10px] text-slate-400 no-print">원가: <input type="number" value="${item.cost}" onchange="updateItem(${index}, 'cost', this.value)" class="w-16 text-right bg-slate-800 text-slate-200 rounded px-1"></span>
                        </div>
                    </td>
                    <td class="p-3 text-right font-bold text-slate-800">
                        ${formatVND(itemTotal)}
                    </td>
                    <td class="p-3 text-center no-print">
                        <button onclick="removeItem(${index})" class="text-red-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>
                `;
            }).join('');

            // 합계 업데이트
            document.getElementById('total-price-display').innerText = formatVND(totalPrice);
            
            // 관리자용 분석 업데이트
            document.getElementById('admin-total-cost').innerText = formatVND(totalCost);
            document.getElementById('admin-total-price').innerText = formatVND(totalPrice);
            const profit = totalPrice - totalCost;
            document.getElementById('admin-profit').innerText = formatVND(profit) + ` (${((profit/totalPrice)*100).toFixed(1)}%)`;

            lucide.createIcons();
        }

        function addItem() {
            estimateItems.push({ type: 'TOUR', desc: '새 항목', unit: '회', price: 0, qty: 1, cost: 0 });
            renderEstimateItems();
        }

        function removeItem(index) {
            estimateItems.splice(index, 1);
            renderEstimateItems();
        }

        function updateItem(index, field, value) {
            if(field === 'qty' || field === 'price' || field === 'cost') value = Number(value);
            estimateItems[index][field] = value;
            renderEstimateItems();
        }

        function saveEstimate() {
            const customerName = document.querySelector('input[value="임창호 님"]').value; // 데모용
            const total = estimateItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            // 예약 리스트에 추가 (Mock)
            bookings.unshift({
                id: 'BK00' + (bookings.length + 1),
                customer: customerName.replace(' 님',''),
                tour: estimateItems[0].desc + ' 등',
                date: '2026-02-01',
                price: total,
                status: 'Confirmed',
                payment: 'Unpaid'
            });
            
            alert('견적서가 저장되고 예약 리스트에 등록되었습니다.');
            switchTab('bookings');
        }

        // 초기화
        lucide.createIcons();
    </script>
</body>
</html>
